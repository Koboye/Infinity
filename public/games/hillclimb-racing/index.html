<script>
'use strict';
const $=s=>document.querySelector(s),cv=$('#c'),g=cv.getContext('2d'),dx=$('#dash').getContext('2d');
let W=0,H=0,DPR=1,U=1;
let QCAP=1.5,_qs=0,_qn=0;function adaptQ(dt){if(QCAP<=1)return;_qs+=dt;if(++_qn>=90){const avg=_qs/_qn;_qs=0;_qn=0;if(avg>.026){QCAP=Math.max(1,QCAP-.25);rs()}}}
function rs(){DPR=Math.min(QCAP,devicePixelRatio||1);const iw=innerWidth,ih=innerHeight,por=ih>iw,st=$('#stage');W=por?ih:iw;H=por?iw:ih;st.style.width=W+'px';st.style.height=H+'px';st.style.transform=por?'translateX('+iw+'px) rotate(90deg)':'none';cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';U=H/1024;document.documentElement.style.setProperty('--u',U+'px')}
addEventListener('resize',rs);rs();
/* ---------- assets ---------- */
const NAMES='jeep wheel bgmid dirt coin can crate flag gem rock tree barrel logo i_engine i_susp i_tire i_fuel'.split(' ');
const IM={};
function load(){return Promise.all(NAMES.map(n=>new Promise(r=>{const i=new Image();i.onload=()=>{IM[n]=i;r()};i.onerror=r;i.src='a/'+n+'.png'})))}
/* recolour the red paint of the jeep (skins / vehicles) */
function recolor(img,hs,sat,lit){const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const x=c.getContext('2d');x.drawImage(img,0,0);if(!hs&&sat==null)return c;
 const d=x.getImageData(0,0,c.width,c.height),p=d.data;
 for(let i=0;i<p.length;i+=4){const r=p[i]/255,gg=p[i+1]/255,b=p[i+2]/255,mx=Math.max(r,gg,b),mn=Math.min(r,gg,b),l=(mx+mn)/2,dl=mx-mn;if(dl<.12)continue;let h,s=dl/(1-Math.abs(2*l-1));if(mx===r)h=((gg-b)/dl+6)%6;else if(mx===gg)h=(b-r)/dl+2;else h=(r-gg)/dl+4;h*=60;
  if(!((h<22||h>338)&&s>.45&&l>.12))continue;
  let nh=(h+(hs||0)+360)%360,ns=sat==null?s:s*sat,nl=lit==null?l:Math.min(.95,l*lit+.1);
  const c2=(1-Math.abs(2*nl-1))*ns,hp=nh/60,xx=c2*(1-Math.abs(hp%2-1));let rr=0,g2=0,bb=0;
  if(hp<1)[rr,g2,bb]=[c2,xx,0];else if(hp<2)[rr,g2,bb]=[xx,c2,0];else if(hp<3)[rr,g2,bb]=[0,c2,xx];else if(hp<4)[rr,g2,bb]=[0,xx,c2];else if(hp<5)[rr,g2,bb]=[xx,0,c2];else[rr,g2,bb]=[c2,0,xx];
  const m=nl-c2/2;p[i]=(rr+m)*255;p[i+1]=(g2+m)*255;p[i+2]=(bb+m)*255}
 x.putImageData(d,0,0);return c}
const UPN=[['ENGINE','i_engine',300],['SUSPENSION','i_susp',220],['TIRES','i_tire',260],['FUEL TANK','i_fuel',180]];
const MAXU=8,upCost=(i,l)=>Math.round(UPN[i][2]*Math.pow(1.5,l)/10)*10;
/* ---------- save ---------- */
let S={coins:1245,gems:12,up:[0,0,0,0],veh:0,own:[1,0,0,0],skin:[0,-1,-1,-1],stars:{},snd:1,world:0,lp:{},wt:'all',wp:0,tab:'car',pv:0,drv:0,pd:0,drvOwn:[1],outfit:0,outOwn:[1],accOwn:[],accOn:[]};
try{const t=JSON.parse(localStorage.getItem('hcr_v1')||'null');if(t)S=Object.assign(S,t)}catch(e){}
if(!Array.isArray(S.accOwn))S.accOwn=[];if(!Array.isArray(S.accOn))S.accOn=[];ACC.forEach((_,i)=>{S.accOwn[i]=S.accOwn[i]|0;S.accOn[i]=S.accOn[i]|0});
S.own[0]=1;S.drvOwn[0]=1;S.outOwn[0]=1;if(!VEH[S.veh]||!S.own[S.veh])S.veh=0;if(!DRV[S.drv]||!S.drvOwn[S.drv])S.drv=0;if(!OUT[S.outfit]||!S.outOwn[S.outfit])S.outfit=0;
const save=()=>{try{localStorage.setItem('hcr_v1',JSON.stringify(S))}catch(e){}};
const tot=()=>Object.values(S.stars).reduce((a,b)=>a+b,0);
const vcache={};
/* open-top jeep: cut the hardtop, roof rack, roll cage and the baked-in driver out of the sprite (cut line = belt line) */
const JCUT=[[36,0],[337,0],[337,84],[318,80],[300,74],[262,68],[238,68],[228,74],[205,77],[140,79],[138,84],[36,86]];
function openTop(c){const x=c.getContext('2d');x.save();x.globalCompositeOperation='destination-out';x.beginPath();JCUT.forEach((q,i)=>i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));x.closePath();x.fill();x.restore();return c}
function vsprite(vi){return vsprite2(vi,skinOf(vi))}
function gloss(c){const x=c.getContext('2d'),w=c.width,h=c.height;x.save();x.globalCompositeOperation='source-atop';let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'rgba(255,255,255,.22)');g.addColorStop(.34,'rgba(255,255,255,.05)');g.addColorStop(.6,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(14,8,2,.38)');x.fillStyle=g;x.fillRect(0,0,w,h);g=x.createLinearGradient(0,0,w,0);g.addColorStop(0,'rgba(0,0,0,.14)');g.addColorStop(.2,'rgba(0,0,0,0)');g.addColorStop(.8,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(255,240,200,.12)');x.fillStyle=g;x.fillRect(0,0,w,h);x.restore();return c}
function vsprite2(vi,sk){const k='s'+vi+'_'+sk;if(!vcache[k]){const o=SKINS[sk];const c=recolor(IM.jeep,o.h,o.s,o.l);if(o.pat)decor(c,o.pat);vcache[k]=gloss(openTop(c))}return vcache[k]}
/* ---------- audio ---------- */
let AC=null;function tone(f,d,t='sine',v=.08,f2){if(!S.snd)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),gn=AC.createGain();o.type=t;o.frequency.value=f;if(f2)o.frequency.exponentialRampToValueAtTime(f2,AC.currentTime+d);gn.gain.value=v;gn.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(gn);gn.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const sfx={coin:()=>{tone(988,.08,'square',.05);setTimeout(()=>tone(1318,.12,'square',.05),70)},can:()=>tone(300,.3,'triangle',.1,600),win:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.1),i*130)),bad:()=>tone(200,.5,'sawtooth',.1,60),flip:()=>tone(400,.2,'triangle',.08,800)};
/* ---------- terrain / level ---------- */
let LV=null;
const sm=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)};
function mk(w,l){const WD=WORLDS[w],t=l/(LEVELS-1),df=(.75+.8*t)*WD.dm,goal=goalOf(w,l),fin=goal*20;
 const o={w,l,t,goal,gv:WD.gv,fin,sl:.06+.035*t,a1:70*WD.amp*df,p1:480,a2:13*df,p2:210,a3:3,s:(w*100+l)*1.7+.5,ramps:[],gorges:[],bumps:[]};
 for(let x=3000;x<fin-1500;x+=2900-500*t+((x/7)%500|0))o.ramps.push(x);
 let seed=w*131+l*31+7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};o.rnd=rnd;return o}
/* raw terrain: rolling hills + jump ramps */
function Hr(x){if(x<=0)return 0;const L=LV,f=sm(x/900);
 let y=-x*L.sl*(.35+.65*f)+f*(L.a1*(Math.sin(x/L.p1+L.s)-Math.sin(L.s))+L.a2*(Math.sin(x/L.p2+L.s*2)-Math.sin(L.s*2))+L.a3*(Math.sin(x/53+L.s*3)-Math.sin(L.s*3)));
 for(const r of L.ramps){if(x>r-360&&x<r+170){y-=x<r?95*sm((x-(r-360))/360):95*(1-sm((x-r)/170))}}
 return y}
/* rivers: L.gorges = [{type:'gorge'|'ford',a,b,ya,yb,D,w1,wy,wl,wr}]
   gorge = deep canyon with a real stone bridge deck you drive on (Hf = deck), ford = shallow river you wade through
   L.bumps = solid obstacles (boulders, log piles) as real terrain bumps the wheels must climb */
const gLine=(g,x)=>g.ya+(g.yb-g.ya)*((x-g.a)/(g.b-g.a));
const gDip=(g,x)=>g.D*sm((x-g.a)/g.w1)*sm((g.b-x)/g.w1);
function Hf(x){if(x<=0)return 0;const L=LV,G=L.gorges;
 if(G)for(let i=0;i<G.length;i++){const g=G[i];if(x>g.a&&x<g.b)return g.type==='ford'?gLine(g,x)+gDip(g,x):gLine(g,x)}
 let y=Hr(x);const B=L.bumps;
 if(B)for(let i=0;i<B.length;i++){const b=B[i],d=Math.abs(x-b.x);if(d<b.w)y-=b.h*(.5+.5*Math.cos(Math.PI*d/b.w))}
 return y}
/* visual ground: same as Hf but shows the gorge floor under a bridge */
function Gv(x){const G=LV.gorges;if(G&&x>0)for(let i=0;i<G.length;i++){const g=G[i];if(x>g.a&&x<g.b)return gLine(g,x)+gDip(g,x)}return Hf(x)}
function riverAt(x,m){const G=LV.gorges;if(G)for(let i=0;i<G.length;i++){const g=G[i];if(x>g.a-(m||0)&&x<g.b+(m||0))return g}return null}
let coins,cans,gems,props,bonus,obs,runCoinsTotal;
/* world-themed prop mix [kind,weight]; z: 0 = behind terrain, 1 = in front, undefined = random */
const PZ={bush:1,pine:0,pineS:0,acacia:0,hut:0,house:0,houseS:0,houseN:0};

 <div style="position:absolute;right:calc(20*var(--u));top:calc(700*var(--u));width:calc(400*var(--u));display:flex;flex-direction:column;gap:calc(14*var(--u))">${own?(eq?`<div class="bt y" style="height:calc(84*var(--u));opacity:.6">DRIVER ON</div>`:`<div class="bt y" style="height:calc(84*var(--u))" data-act="dpick">SELECT DRIVER</div>`):`<div class="bt y" style="height:calc(84*var(--u))" data-act="dbuy" ${S.coins<d.cost?'disabled':''}>BUY &nbsp;${d.cost.toLocaleString()}</div>`}<div class="bt g" style="height:calc(80*var(--u))" data-act="race">${svg.play}RACE</div></div>`}
let GV=null;
function drawPreview(t){const c=document.getElementById('gv');if(!c||!GV)return;const x=c.getContext('2d'),v=VEH[GV.vi];x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,c.width,c.height);
 const vh=v.cls==='bike'?160:v.kind==='monster'?185:135,s=Math.min(c.width*.78/v.len,c.height*.72/vh),go=v.wh[0].y+v.R;x.translate(c.width/2,c.height*.9-go*s);x.scale(s,s);x.imageSmoothingQuality='high';
 const sp=t*1.8;drawVeh(x,GV.vi,{sk:GV.sk,sp:[sp,sp],ws:[Math.sin(t*2)*1.5,Math.sin(t*2+1)*1.5],t})}
const AFTER={garage:()=>{GV=S.tab==='drv'?null:{vi:S.pv,sk:skinOf(S.pv)}},skins:()=>{skPrev=skinOf(S.veh);GV={vi:S.veh,sk:skPrev}}};
/* result */
function showResult(ok){mode='menu';$('#hud').classList.add('hide');const u=$('#ui');u.querySelectorAll('.scr').forEach(e=>e.remove());const d=document.createElement('div');d.className='scr on';d.id='s_res';
 const coins=run.coins+run.stuntC+run.bonusC;let cf='';for(let i=0;i<46;i++)cf+=`<div class="conf" style="left:${Math.random()*100}%;background:${['#ffd33d','#ff5a4f','#35c6ff','#5be37d','#fff'][i%5]};animation-duration:${3+Math.random()*3}s;animation-delay:${-Math.random()*5}s"></div>`;
 const stars=ok?run.stars:0,hasNext=ok&&(run.l<LEVELS-1||(run.w<WORLD_COUNT-1&&wOpen(run.w+1)));
 d.innerHTML=`<div style="position:absolute;inset:0;background:rgba(5,10,24,.78)"></div><div class="glass" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(900*var(--u));padding:calc(36*var(--u)) calc(50*var(--u));overflow:hidden;background:linear-gradient(180deg,#0f1c38,#070d1c)">${ok?cf:''}
 <div style="text-align:center;font-size:calc(100*var(--u));letter-spacing:calc(10*var(--u));position:relative">${[1,2,3].map(n=>`<span style="color:${n<=stars?'#ffcc2e':'#33405a'};text-shadow:0 4px 10px #000;font-size:${n===2?'1.25em':'1em'}">\u2605</span>`).join('')}</div>
 <div style="text-align:center;font-size:calc(84*var(--u));font-weight:900;font-style:italic;color:${ok?'#f5d13a':'#ff6a5a'};text-shadow:0 4px 10px #000;position:relative">${ok?'LEVEL COMPLETE!':run.over}</div>
 <div style="position:relative;margin:calc(20*var(--u)) calc(30*var(--u));font-size:calc(40*var(--u))">${[['Distance',Math.floor(run.dist).toLocaleString()+' m'],['Coins Collected',coins.toLocaleString()],['Stunts',run.flips]].concat((run.airBest||0)>=.8?[['Best Air Time',run.airBest.toFixed(1)+' s']]:[]).concat(run.smash>0?[['Obstacles Smashed',run.smash]]:[]).concat(run.trophies+run.chests+run.bags>0?[['Bonus Rewards',run.trophies+' \u{1F3C6}  '+run.chests+' \u{1F381}  '+run.bags+' \u{1F4B0}']]:[]).map(r=>`<div style="display:flex;align-items:center;gap:calc(20*var(--u));padding:calc(10*var(--u)) 0"><span class="gold">\u2605</span>${r[0]}<div class="sp"></div><b>${r[1]}</b></div>`).join('')}</div>
 ${ok&&run.rec?'<div style="position:relative;text-align:right;margin-right:calc(60*var(--u))"><span style="display:inline-block;background:#f5c542;color:#2a1a00;font-weight:900;font-size:calc(26*var(--u));padding:calc(4*var(--u)) calc(16*var(--u));transform:rotate(-4deg)">NEW RECORD!</span></div>':''}
 ${ok?`<div style="position:relative;text-align:center;font-size:calc(30*var(--u));color:#bcd0f0;margin-top:calc(8*var(--u))">Level bonus +${run.bonus}</div>`:''}
 <div style="position:relative;display:flex;gap:calc(20*var(--u));margin-top:calc(26*var(--u))"><div class="bt" style="flex:1" data-go="map">${svg.home}HOME</div><div class="bt" style="flex:1" data-act="retry">${svg.retry}RETRY</div>${hasNext?`<div class="bt g" style="flex:1" data-act="next">${svg.play}NEXT</div>`:''}</div></div>`;
 u.appendChild(d)}
/* ---------- input / events ---------- */
function pedal(id,key){const e=$(id);const on=v=>{if(v&&!inp[key]&&navigator.vibrate)try{navigator.vibrate(8)}catch(_){}inp[key]=v;e.classList.toggle('on',!!v)};e.addEventListener('pointerdown',ev=>{ev.preventDefault();e.setPointerCapture(ev.pointerId);on(1)});['pointerup','pointercancel','lostpointercapture'].forEach(t=>e.addEventListener(t,()=>on(0)))}
function relPedals(){inp.gas=0;inp.brake=0;document.querySelectorAll('.pd.on').forEach(e=>e.classList.remove('on'))}
addEventListener('blur',relPedals);document.addEventListener('visibilitychange',()=>{if(document.hidden){relPedals();if(typeof mode!=='undefined'&&mode==='play'&&!paused)togglePause()}});
pedal('#gas','gas');pedal('#brake','brake');
addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key;if(k==='ArrowRight'||k==='d'||k==='ArrowUp')inp.gas=1;if(k==='ArrowLeft'||k==='a'||k==='ArrowDown')inp.brake=1;if(k==='p'||k==='Escape')togglePause();if(k==='r'&&mode==='play')start(run.w,run.l)});
addEventListener('keyup',e=>{const k=e.key;if(k==='ArrowRight'||k==='d'||k==='ArrowUp')inp.gas=0;if(k==='ArrowLeft'||k==='a'||k==='ArrowDown')inp.brake=0});
document.querySelectorAll('.pu').forEach(e=>e.addEventListener('pointerdown',()=>{if(e.classList.contains('used')||mode!=='play')return;e.classList.add('used');const p=+e.dataset.p;if(p===0){boost.coin=25;say('COIN BOOST x2')}if(p===1){boost.susp=25;say('BETTER SUSPENSION')}if(p===2){boost.tire=25;say('ALL-TERRAIN TIRES')}if(p===3){car.fuel=Math.min(car.st.fuel,car.fuel+45);say('EXTRA FUEL')}}));
function togglePause(){if(mode==='play'){paused=!paused;let m=$('#pm');if(paused){m=document.createElement('div');m.id='pm';m.className='mod on';m.innerHTML=`<div class="glass" style="padding:calc(40*var(--u));width:calc(560*var(--u));display:flex;flex-direction:column;gap:calc(18*var(--u))"><div style="text-align:center;font-size:calc(60*var(--u));font-weight:900;letter-spacing:4px">PAUSED</div><div class="bt y" data-act="resume">${svg.play}RESUME</div><div class="bt" data-act="retry">${svg.retry}RESTART</div><div class="bt" data-act="snd">SOUND: ${S.snd?'ON':'OFF'}</div><div class="bt" data-go="map">${svg.home}QUIT</div></div>`;$('#ui').appendChild(m)}else if(m)m.remove()}}
$('#pause').addEventListener('pointerdown',togglePause);
document.addEventListener('pointerdown',ev=>{const t=ev.target.closest('[data-go],[data-act],[data-lv],[data-v],[data-up],[data-sk],[data-w],[data-wt],[data-wp],[data-pw],[data-pg],[data-tab],[data-sel],[data-nav],[data-ds],[data-out],[data-acc]');if(!t)return;
 const go=t.dataset.go,act=t.dataset.act;
 if(go){const pm=$('#pm');if(pm)pm.remove();paused=false;if(mode==='play'||mode==='over'){mode='menu'}save();showScr(go);return}
 if(t.dataset.lv!=null){const l=+t.dataset.lv,w=S.world;if(wOpen(w)&&lOpen(w,l))start(w,l);else toast(wOpen(w)?'Pass ALL previous levels first':'Pass ALL '+LEVELS+' levels of the previous world first');return}
 if(t.dataset.w){S.world=(S.world+WORLD_COUNT+ +t.dataset.w)%WORLD_COUNT;save();showScr('map');return}
 if(t.dataset.pg!=null){S.lp[S.world]=+t.dataset.pg;save();showScr('map');return}
 if(t.dataset.wt){S.wt=t.dataset.wt;S.wp=0;showScr('worlds');return}
 if(t.dataset.wp){const n=Math.ceil(wList().length/12);S.wp=(S.wp+n+ +t.dataset.wp)%n;showScr('worlds');return}
 if(t.dataset.pw!=null){const i=+t.dataset.pw;if(wOpen(i)){S.world=i;save();showScr('map')}else toast('Pass ALL '+LEVELS+' levels of the previous world first');return}
 if(t.dataset.tab){S.tab=t.dataset.tab;save();showScr('garage');return}
 if(t.dataset.sel!=null){S.pv=+t.dataset.sel;showScr('garage');return}
 if(t.dataset.nav){const l=vList(S.tab),p=l.indexOf(S.pv);S.pv=l[(p+ +t.dataset.nav+l.length)%l.length];showScr('garage');return}
 if(t.dataset.ds!=null){S.pd=+t.dataset.ds;showScr('garage');return}
 if(t.dataset.acc!=null){const i=+t.dataset.acc,a=ACC[i];if(S.accOwn[i])S.accOn[i]=S.accOn[i]?0:1;else if(S.coins>=a.cost){S.coins-=a.cost;S.accOwn[i]=1;S.accOn[i]=1;sfx.win()}save();showScr('garage');return}
 if(t.dataset.out!=null){const i=+t.dataset.out,o=OUT[i];if(S.outOwn[i])S.outfit=i;else if(S.coins>=o.cost){S.coins-=o.cost;S.outOwn[i]=1;S.outfit=i;sfx.win()}save();showScr('garage');return}
 if(t.dataset.v!=null){S.veh=+t.dataset.v;showScr('garage');return}
 if(t.dataset.up!=null){const i=+t.dataset.up,c=upCost(i,S.up[i]);if(S.up[i]<MAXU&&S.coins>=c){S.coins-=c;S.up[i]++;save();sfx.coin();showScr('upg')}return}
 if(t.dataset.sk!=null){skPrev=+t.dataset.sk;document.querySelectorAll('.sw').forEach(e=>e.classList.toggle('sel',e===t));if(GV)GV.sk=skPrev;const sn=document.getElementById('skn');if(sn)sn.textContent=SKINS[skPrev].n.toUpperCase();return}
 if(act==='pick'){if(S.own[S.pv]){S.veh=S.pv;save();sfx.coin();showScr('garage')}}
 else if(act==='race'){S.veh=S.own[S.pv]&&S.tab!=='drv'?S.pv:S.veh;save();showScr('map')}
 else if(act==='toskins'){if(S.own[S.pv]){S.veh=S.pv;save();showScr('skins')}}
 else if(act==='dpick'){if(S.drvOwn[S.pd]){S.drv=S.pd;save();sfx.coin();showScr('garage')}}
 else if(act==='dbuy'){const d=DRV[S.pd];if(S.coins>=d.cost&&!S.drvOwn[S.pd]){S.coins-=d.cost;S.drvOwn[S.pd]=1;S.drv=S.pd;save();sfx.win();showScr('garage')}}
 else if(act==='buy'){const v=VEH[S.pv];if(S.coins>=v.cost&&!S.own[S.pv]){S.coins-=v.cost;S.own[S.pv]=1;S.veh=S.pv;save();sfx.win();showScr('garage')}}
 else if(act==='apply'){S.skin[S.veh]=skPrev;save();showScr('garage')}
 else if(act==='snd'){S.snd=S.snd?0:1;save();if($('#pm')){$('#pm').remove();paused=false}else showScr('set')}
 else if(act==='reset'){if(confirm('Reset all progress?')){localStorage.removeItem('hcr_v1');location.reload()}}
 else if(act==='resume')togglePause();
 else if(act==='retry'){const pm=$('#pm');if(pm)pm.remove();start(run.w,run.l)}
 else if(act==='next'){const w0=run.w,l0=run.l;if(l0<LEVELS-1)start(w0,l0+1);else if(w0<WORLD_COUNT-1&&wOpen(w0+1))start(w0+1,0);else showScr('map')}
 else if(act==='worlds'){const L=wList(),i=L.indexOf(S.world);S.wp=i<0?0:Math.floor(i/12);showScr('worlds')}
});
/* ---------- main loop ---------- */
function updParts(dt){for(const p of parts){p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g||60)*dt;if(p.vr)p.rot+=p.vr*dt}parts=parts.filter(p=>p.l>0)}
let last=0,acc=0,tm=0;
function frame(t){requestAnimationFrame(frame);const dt=Math.min(.05,(t-last)/1000||0);last=t;
 if(mode==='play'&&!paused){adaptQ(dt);acc+=dt;while(acc>1/240){step(1/240);acc-=1/240}
  updParts(dt);drawScene();hudUpd()}
 else if(mode==='over'){updParts(dt);drawScene()}
 else if(mode==='play'&&paused){}
 else{drawMenuBG(dt)}}
function drawMenuBG(dt){tm+=dt;drawPreview(tm);g.setTransform(DPR,0,0,DPR,0,0);const z=H/620;
 if(!LV){LV=mk(0,0)}
 drawBG(tm*160,0,z);try{const WDm=WORLDS[S.world]||WORLDS[0];Scenery.back(g,W,H,{x:tm*160,y:0},z,WDm,tm,0)}catch(e){}
 const sc=document.getElementById('s_title')?1:0;
 if(sc){/* title scene: big jeep on a rock ledge */
  const gy=H*.93,vv=VEH[S.veh],sc2=W*.46/vv.len,go=vv.wh[0].y+vv.R;g.save();g.translate(W*.30,gy-go*sc2+6);g.scale(sc2,sc2);drawVeh(g,S.veh,{sp:[tm*2,tm*2],ws:[0,0],t:tm});g.restore();
  g.fillStyle=dirtPattern();g.save();g.translate(0,gy-8);g.scale(H/620*1.1,H/620*1.1);g.fillRect(0,0,W,H);g.restore();{const k=H/620*1.1,ay=gy-14;const ag=g.createLinearGradient(0,ay,0,ay+60*k);ag.addColorStop(0,'rgba(26,10,3,.5)');ag.addColorStop(1,'rgba(26,10,3,0)');g.fillStyle=ag;g.fillRect(0,ay,W,60*k);g.fillStyle='#2f6b1c';g.fillRect(0,ay-2,W,16*k+2);g.fillStyle='#4aa52e';g.fillRect(0,ay,W,12*k);g.fillStyle='#8be04e';g.fillRect(0,ay,W,4*k);const yf=()=>ay+10*k;grassRoots(0,W,yf,'#4aa52e',k,4*k);grassBlades(0,W,()=>ay+2*k,'#4aa52e','#86d94a',k,0)}}
 else{const gd=g.createLinearGradient(0,H*.5,0,H);gd.addColorStop(0,'#0000');gd.addColorStop(1,'#08101fcc');g.fillStyle=gd;g.fillRect(0,0,W,H)}
 if(!sc&&!document.querySelector('.scr')){}
}
load().then(()=>{showScr('title');requestAnimationFrame(frame)});
