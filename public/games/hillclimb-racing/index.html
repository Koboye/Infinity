<script>
'use strict';
const $=s=>document.querySelector(s),cv=$('#c'),g=cv.getContext('2d'),dx=$('#dash').getContext('2d');
let W=0,H=0,DPR=1,U=1;
function rs(){DPR=Math.min(2,devicePixelRatio||1);const iw=innerWidth,ih=innerHeight,por=ih>iw,st=$('#stage');W=por?ih:iw;H=por?iw:ih;st.style.width=W+'px';st.style.height=H+'px';st.style.transform=por?'translateX('+iw+'px) rotate(90deg)':'none';cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';U=H/1024;document.documentElement.style.setProperty('--u',U+'px')}
addEventListener('resize',rs);rs();
/* ---------- assets ---------- */
const NAMES='jeep wheel bgmid dirt coin can crate flag gem rock tree barrel logo i_engine i_susp i_tire i_fuel'.split(' ');
const IM={};
function load(){return Promise.all(NAMES.map(n=>new Promise(r=>{const i=new Image();i.onload=()=>{IM[n]=i;r()};i.onerror=r;i.src='a/'+n+'.png'})))}
/* recolour the red paint of the jeep (skins / vehicles) */
function recolor(img,hs,sat,lit){const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const x=c.getContext('2d');x.drawImage(img,0,0);if(!hs&&sat==null)return c;
 const d=x.getImageData(0,0,c.width,c.height),p=d.data;
 for(let i=0;i<p.length;i+=4){const r=p[i]/255,gg=p[i+1]/255,b=p[i+2]/255,mx=Math.max(r,gg,b),mn=Math.min(r,gg,b),l=(mx+mn)/2,dl=mx-mn;if(dl<.12)continue;let h,s=dl/(1-Math.abs(2*l-1));if(mx===r)h=((gg-b)/dl+6)%6;else if(mx===gg)h=(b-r)/dl+2;else h=(r-gg)/dl+4;h*=60;
  if(!((h<22||h>338)&&s>.45&&l>.12))continue;
  let nh=(h+(hs||0)+360)%360,ns=sat==null?s:s*sat,nl=lit==null?l:Math.min(.95,l*lit+.1);
  const c2=(1-Math.abs(2*nl-1))*ns,hp=nh/60,xx=c2*(1-Math.abs(hp%2-1));let rr=0,g2=0,bb=0;
  if(hp<1)[rr,g2,bb]=[c2,xx,0];else if(hp<2)[rr,g2,bb]=[xx,c2,0];else if(hp<3)[rr,g2,bb]=[0,c2,xx];else if(hp<4)[rr,g2,bb]=[0,xx,c2];else if(hp<5)[rr,g2,bb]=[xx,0,c2];else[rr,g2,bb]=[c2,0,xx];
  const m=nl-c2/2;p[i]=(rr+m)*255;p[i+1]=(g2+m)*255;p[i+2]=(bb+m)*255}
 x.putImageData(d,0,0);return c}
const SKINS=[{n:'Red',h:0},{n:'Blue',h:212},{n:'Yellow',h:48},{n:'Green',h:112},{n:'White',h:0,s:.08,l:2.2}];
const VEH=[{n:'Mountain Beast',cost:0,pw:1,gr:1,fu:1,sk:0,st:3},{n:'Sand Runner',cost:1500,pw:1.12,gr:1.05,fu:1,sk:2,st:3},{n:'Blue Thunder',cost:3500,pw:1.22,gr:1.12,fu:1.1,sk:1,st:4},{n:'Green Giant',cost:6000,pw:1.35,gr:1.22,fu:1.2,sk:3,st:5}];
const WORLDS=[{n:'Green Hills',grip:1,amp:1,tint:null,gr:['#3f9a28','#86d94a'],dust:'#b58a52'},{n:'Desert',grip:.95,amp:.85,tint:'rgba(255,140,30,.30)',gr:['#b88a3a','#e7c277'],dust:'#d9b06a'},{n:'Snow',grip:.7,amp:1,tint:'rgba(185,225,255,.32)',gr:['#bcd9ec','#ffffff'],dust:'#eef7ff'},{n:'Night',grip:1,amp:1.15,tint:'rgba(8,12,70,.55)',gr:['#1b5236','#3b9a63'],dust:'#8a7a6a',stars:1}];
const GOALS=[500,700,900,1200,1500];
const UPN=[['ENGINE','i_engine',300],['SUSPENSION','i_susp',220],['TIRES','i_tire',260],['FUEL TANK','i_fuel',180]];
const MAXU=8,upCost=(i,l)=>Math.round(UPN[i][2]*Math.pow(1.5,l)/10)*10;
/* ---------- save ---------- */
let S={coins:1245,gems:12,up:[0,0,0,0],veh:0,own:[1,0,0,0],skin:[0,-1,-1,-1],stars:{},snd:1,world:0};
try{const t=JSON.parse(localStorage.getItem('hcr_v1')||'null');if(t)S=Object.assign(S,t)}catch(e){}
const save=()=>{try{localStorage.setItem('hcr_v1',JSON.stringify(S))}catch(e){}};
const tot=()=>Object.values(S.stars).reduce((a,b)=>a+b,0);
const vcache={};
function vsprite(vi){const sk=S.skin[vi]>=0?S.skin[vi]:VEH[vi].sk,k=vi+'_'+sk;if(!vcache[k]){const o=SKINS[sk];vcache[k]=recolor(IM.jeep,o.h,o.s,o.l)}return vcache[k]}
function vsprite2(vi,sk){const k='s'+vi+'_'+sk;if(!vcache[k]){const o=SKINS[sk];vcache[k]=recolor(IM.jeep,o.h,o.s,o.l)}return vcache[k]}
/* ---------- audio ---------- */
let AC=null;function tone(f,d,t='sine',v=.08,f2){if(!S.snd)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),gn=AC.createGain();o.type=t;o.frequency.value=f;if(f2)o.frequency.exponentialRampToValueAtTime(f2,AC.currentTime+d);gn.gain.value=v;gn.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(gn);gn.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const sfx={coin:()=>{tone(988,.08,'square',.05);setTimeout(()=>tone(1318,.12,'square',.05),70)},can:()=>tone(300,.3,'triangle',.1,600),win:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.1),i*130)),bad:()=>tone(200,.5,'sawtooth',.1,60),flip:()=>tone(400,.2,'triangle',.08,800)};
/* ---------- terrain / level ---------- */
let LV=null;
const sm=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)};
function mk(w,l){const WD=WORLDS[w],df=.75+.12*l,fin=GOALS[l]*20;
 const o={w,l,fin,sl:.06+.008*l,a1:70*WD.amp*df,p1:480,a2:13*df,p2:210,a3:3,s:(w*5+l)*1.7+.5,ramps:[]};
 for(let x=3000;x<fin-1500;x+=2900+((x/7)%500|0))o.ramps.push(x);
 let seed=w*17+l*31+7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};o.rnd=rnd;return o}
function Hf(x){if(x<=0)return 0;const L=LV,f=sm(x/900);
 let y=-x*L.sl*(.35+.65*f)+f*(L.a1*(Math.sin(x/L.p1+L.s)-Math.sin(L.s))+L.a2*(Math.sin(x/L.p2+L.s*2)-Math.sin(L.s*2))+L.a3*(Math.sin(x/53+L.s*3)-Math.sin(L.s*3)));
 for(const r of L.ramps){if(x>r-360&&x<r+170){y-=x<r?95*sm((x-(r-360))/360):95*(1-sm((x-r)/170))}}
 return y}
let coins,cans,gems,props,runCoinsTotal;
function genLevel(){const L=LV,fin=L.fin,rnd=L.rnd;coins=[];cans=[];gems=[];props=[];
 const addC=(x,y)=>coins.push({x,y,t:0});
 for(let x=900;x<fin-600;x+=700+rnd()*500){const n=4+(rnd()*4|0);for(let i=0;i<n;i++){const xx=x+i*88;addC(xx,Hf(xx)-62)}}
 for(const r of L.ramps){for(let i=0;i<9;i++){const t=i/8,xx=r-80+t*760;addC(xx,Hf(r)-150-190*Math.sin(Math.PI*t)-20)}}
 for(let x=2000;x<fin-800;x+=2100+rnd()*500)cans.push({x,y:Hf(x)-48,t:0});
 for(let x=4200;x<fin-800;x+=4800+rnd()*1200)gems.push({x,y:Hf(x)-150,t:0});
 for(let x=-400;x<fin+1200;x+=260+rnd()*520){const k=rnd();props.push({x,k:k<.55?'tree':k<.8?'rock':k<.9?'crate':'barrel',s:.75+rnd()*.5,z:rnd()<.5?0:1})}
 runCoinsTotal=coins.length}
/* ---------- run state ---------- */
const PXM=20,R=28,G=1500;
const WH=[{x:-60,y:22},{x:61,y:22}],CP=[{x:92,y:8},{x:-80,y:12}],HD=[{x:-15,y:-52},{x:45,y:-60},{x:-70,y:-56}];
let car,run,cam,parts=[],mode='menu',paused=false,inp={gas:0,brake:0},boost={coin:0,susp:0,tire:0},pop={t:0};
function stats(){const v=VEH[S.veh],u=S.up;return{pw:560*v.pw*(1+.14*u[0]),K:500*(1+.07*u[1]),Cd:18*(1+.09*u[1]),mu:1.15*v.gr*(1+.1*u[2])*WORLDS[LV.w].grip,fuel:(100+22*u[3])*v.fu,vmax:880*(1+.05*u[0])}}
function start(w,l){S.world=w;LV=mk(w,l);genLevel();const st=stats();
 car={x:0,y:Hf(0)-60,a:0,vx:0,vy:0,w:0,sp:[0,0],ws:[0,0],fuel:st.fuel,air:0,rot:0,rotAcc:0,st};
 run={dist:0,coins:0,gems:0,flips:0,stuntC:0,over:'',idle:0,t:0,rpm:.2,w,l,done:0,airT:0,cansGot:0};
 cam={x:car.x,y:car.y};parts=[];boost={coin:0,susp:0,tire:0};inp={gas:0,brake:0};paused=false;mode='play';
 document.querySelectorAll('.pu').forEach(e=>e.classList.remove('used'));
 $('#hud').classList.remove('hide');showScr(null);}
function say(t){const p=$('#pop');p.textContent=t;p.style.opacity=1;pop.t=1.3}
function step(dt){const c=car,st=c.st,th=inp.gas&&c.fuel>0?1:0,br=inp.brake?1:0;
 const ca=Math.cos(c.a),sa=Math.sin(c.a);let ax=0,ay=G,aw=0,gr=0,I=5200;
 const K=st.K,Cd=st.Cd*(boost.susp>0?1.3:1),mu=st.mu*(boost.tire>0?1.3:1);
 for(let i=0;i<2;i++){const o=WH[i],rx=o.x*ca-o.y*sa,ry=o.x*sa+o.y*ca,px=c.x+rx,py=c.y+ry,h=Hf(px),pen=py+R-h;
  if(pen>0){const sl=(Hf(px+2)-Hf(px-2))/4,il=1/Math.sqrt(1+sl*sl),tx=il,ty=sl*il,nx=sl*il,ny=-il;
   const vx=c.vx-c.w*ry,vy=c.vy+c.w*rx,vn=vx*nx+vy*ny,vt=vx*tx+vy*ty;
   let Fn=K*pen-Cd*vn;if(Fn<0)Fn=0;
   let Ft=-.3*vt;
   if(th)Ft+=st.pw*(1-Math.max(0,Math.min(1,vt/st.vmax)));
   if(br){Ft+=vt>25?-st.pw*1.3:-st.pw*.55*(1-Math.max(0,Math.min(1,-vt/320)))}
   const lim=mu*Fn;Ft=Math.max(-lim,Math.min(lim,Ft));
   const Fx=Fn*nx+Ft*tx,Fy=Fn*ny+Ft*ty;ax+=Fx;ay+=Fy;aw+=(rx*Fy-ry*Fx)/I;gr++;
   c.sp[i]+=vt/R*dt;c.ws[i]+=((-pen*.6)-c.ws[i])*Math.min(1,dt*30);

 <div style="position:absolute;left:calc(240*var(--u));right:calc(36*var(--u));bottom:calc(30*var(--u));display:flex;gap:calc(16*var(--u))">${own?`<div class="bt y" style="flex:1" data-act="pick">SELECT</div>`:`<div class="bt y" style="flex:1" data-act="buy" ${S.coins<v.cost?'disabled':''}>BUY &nbsp;${v.cost}</div>`}<div class="bt" style="flex:1" data-go="upg">${svg.tool}UPGRADES</div><div class="bt" style="flex:1" data-go="skins">PAINT / SKINS</div></div>`},
upg:()=>{let c='';UPN.forEach(([n,ic],i)=>{const l=S.up[i],cost=upCost(i,l);c+=`<div class="card" style="left:calc(${60+i*360}*var(--u));top:calc(190*var(--u));width:calc(330*var(--u));height:calc(560*var(--u))"><div style="font-size:calc(34*var(--u));font-weight:800;letter-spacing:2px">${n}</div><img src="a/${ic}.png" style="width:78%;margin-top:calc(14*var(--u))"><div style="font-size:calc(30*var(--u));color:#bcd0f0">Lv. ${l}</div><div class="seg">${Array.from({length:MAXU},(_,k)=>`<s class="${k<l?'f':''}"></s>`).join('')}</div><div class="bt y" style="height:calc(80*var(--u));margin-top:calc(14*var(--u));font-size:calc(34*var(--u))" data-up="${i}" ${l>=MAXU||S.coins<cost?'disabled':''}>${l>=MAXU?'MAX':'<img src="a/coin.png" style="height:70%">'+cost}</div></div>`});
 return `<div style="position:absolute;inset:0;background:linear-gradient(180deg,#0f2142,#080f1f)"></div>${hdr('UPGRADES','title')}${c}<div class="glass" style="position:absolute;left:50%;transform:translateX(-50%);bottom:calc(60*var(--u));padding:calc(20*var(--u)) calc(56*var(--u));font-size:calc(38*var(--u));font-weight:700;display:flex;gap:calc(18*var(--u));align-items:center">${svg.tool.replace('<svg','<svg style="width:calc(50*var(--u));fill:#f5c542"')}Upgrade your vehicle and go further!</div>`},
skins:()=>{const cur=S.skin[S.veh]>=0?S.skin[S.veh]:VEH[S.veh].sk;let sw='';SKINS.forEach((k,i)=>sw+=`<div class="sw ${i===cur?'sel':''}" data-sk="${i}" style="left:calc(36*var(--u));top:calc(${170+i*86}*var(--u));background:${['#e12a22','#2d6fe8','#f2c230','#2fb24a','#e8edf2'][i]}"></div>`);
 return `<div style="position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 70%,#223a63,#0a1426 70%)"></div><div style="position:absolute;left:18%;right:34%;top:70%;height:calc(70*var(--u));border-radius:50%;background:radial-gradient(#4fc3ff88,#4fc3ff22 60%,#0000 72%);border:calc(3*var(--u)) solid #4fc3ff55"></div>${hdr('VEHICLE SKINS','garage')}${sw}<canvas id="gv" style="position:absolute;left:21%;top:28%;width:46%"></canvas><div class="bt y" data-act="apply" style="position:absolute;left:50%;transform:translateX(-50%);bottom:calc(36*var(--u));width:calc(420*var(--u))">APPLY</div>`},
set:()=>`<div style="position:absolute;inset:0;background:linear-gradient(180deg,#0f2142,#080f1f)"></div>${hdr('SETTINGS','title')}<div style="position:absolute;left:50%;top:calc(200*var(--u));transform:translateX(-50%);width:calc(560*var(--u));display:flex;flex-direction:column;gap:calc(20*var(--u))"><div class="bt" data-act="snd">SOUND: ${S.snd?'ON':'OFF'}</div><div class="bt" data-act="reset" style="color:#ff8a80">RESET PROGRESS</div></div>`
};
let skPrev=null;
const AFTER={garage:()=>{VEH.forEach((v,i)=>drawTo($('#th'+i),vsprite(i),150));drawTo($('#gv'),vsprite(S.veh),420,1)},
 skins:()=>{skPrev=S.skin[S.veh]>=0?S.skin[S.veh]:VEH[S.veh].sk;drawTo($('#gv'),vsprite2(S.veh,skPrev),420,1)}};
function drawTo(cvs,spr,w,wheels){const sc=spr.width/IM.jeep.width;cvs.width=420;cvs.height=Math.round(420*spr.height/spr.width)+10;const x=cvs.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(spr,0,0,420,cvs.height-10);
 if(wheels){/* the sprite already contains static wheels; overlay rotating-ready wheel sprites for crisp look */}
 }
/* result */
function showResult(ok){mode='menu';$('#hud').classList.add('hide');const u=$('#ui');u.querySelectorAll('.scr').forEach(e=>e.remove());const d=document.createElement('div');d.className='scr on';d.id='s_res';
 const coins=run.coins+run.stuntC;let cf='';for(let i=0;i<46;i++)cf+=`<div class="conf" style="left:${Math.random()*100}%;background:${['#ffd33d','#ff5a4f','#35c6ff','#5be37d','#fff'][i%5]};animation-duration:${3+Math.random()*3}s;animation-delay:${-Math.random()*5}s"></div>`;
 const stars=ok?run.stars:0,hasNext=ok&&run.l<4;
 d.innerHTML=`<div style="position:absolute;inset:0;background:rgba(5,10,24,.78)"></div><div class="glass" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(900*var(--u));padding:calc(36*var(--u)) calc(50*var(--u));overflow:hidden;background:linear-gradient(180deg,#0f1c38,#070d1c)">${ok?cf:''}
 <div style="text-align:center;font-size:calc(100*var(--u));letter-spacing:calc(10*var(--u));position:relative">${[1,2,3].map(n=>`<span style="color:${n<=stars?'#ffcc2e':'#33405a'};text-shadow:0 4px 10px #000;font-size:${n===2?'1.25em':'1em'}">\u2605</span>`).join('')}</div>
 <div style="text-align:center;font-size:calc(84*var(--u));font-weight:900;font-style:italic;color:${ok?'#f5d13a':'#ff6a5a'};text-shadow:0 4px 10px #000;position:relative">${ok?'LEVEL COMPLETE!':run.over}</div>
 <div style="position:relative;margin:calc(20*var(--u)) calc(30*var(--u));font-size:calc(40*var(--u))">${[['Distance',Math.floor(run.dist).toLocaleString()+' m'],['Coins Collected',coins.toLocaleString()],['Stunts',run.flips]].map(r=>`<div style="display:flex;align-items:center;gap:calc(20*var(--u));padding:calc(10*var(--u)) 0"><span class="gold">\u2605</span>${r[0]}<div class="sp"></div><b>${r[1]}</b></div>`).join('')}</div>
 ${ok&&run.rec?'<div style="position:relative;text-align:right;margin-right:calc(60*var(--u))"><span style="display:inline-block;background:#f5c542;color:#2a1a00;font-weight:900;font-size:calc(26*var(--u));padding:calc(4*var(--u)) calc(16*var(--u));transform:rotate(-4deg)">NEW RECORD!</span></div>':''}
 ${ok?`<div style="position:relative;text-align:center;font-size:calc(30*var(--u));color:#bcd0f0;margin-top:calc(8*var(--u))">Level bonus +${run.bonus}</div>`:''}
 <div style="position:relative;display:flex;gap:calc(20*var(--u));margin-top:calc(26*var(--u))"><div class="bt" style="flex:1" data-go="map">${svg.home}HOME</div><div class="bt" style="flex:1" data-act="retry">${svg.retry}RETRY</div>${hasNext?`<div class="bt g" style="flex:1" data-act="next">${svg.play}NEXT</div>`:''}</div></div>`;
 u.appendChild(d)}
/* ---------- input / events ---------- */
function pedal(id,key){const e=$(id);const on=v=>{inp[key]=v;e.classList.toggle('on',!!v)};e.addEventListener('pointerdown',ev=>{ev.preventDefault();e.setPointerCapture(ev.pointerId);on(1)});['pointerup','pointercancel','lostpointercapture'].forEach(t=>e.addEventListener(t,()=>on(0)))}
pedal('#gas','gas');pedal('#brake','brake');
addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key;if(k==='ArrowRight'||k==='d'||k==='ArrowUp')inp.gas=1;if(k==='ArrowLeft'||k==='a'||k==='ArrowDown')inp.brake=1;if(k==='p'||k==='Escape')togglePause();if(k==='r'&&mode==='play')start(run.w,run.l)});
addEventListener('keyup',e=>{const k=e.key;if(k==='ArrowRight'||k==='d'||k==='ArrowUp')inp.gas=0;if(k==='ArrowLeft'||k==='a'||k==='ArrowDown')inp.brake=0});
document.querySelectorAll('.pu').forEach(e=>e.addEventListener('pointerdown',()=>{if(e.classList.contains('used')||mode!=='play')return;e.classList.add('used');const p=+e.dataset.p;if(p===0){boost.coin=25;say('COIN BOOST x2')}if(p===1){boost.susp=25;say('BETTER SUSPENSION')}if(p===2){boost.tire=25;say('ALL-TERRAIN TIRES')}if(p===3){car.fuel=Math.min(car.st.fuel,car.fuel+45);say('EXTRA FUEL')}}));
function togglePause(){if(mode==='play'){paused=!paused;let m=$('#pm');if(paused){m=document.createElement('div');m.id='pm';m.className='mod on';m.innerHTML=`<div class="glass" style="padding:calc(40*var(--u));width:calc(560*var(--u));display:flex;flex-direction:column;gap:calc(18*var(--u))"><div style="text-align:center;font-size:calc(60*var(--u));font-weight:900;letter-spacing:4px">PAUSED</div><div class="bt y" data-act="resume">${svg.play}RESUME</div><div class="bt" data-act="retry">${svg.retry}RESTART</div><div class="bt" data-act="snd">SOUND: ${S.snd?'ON':'OFF'}</div><div class="bt" data-go="map">${svg.home}QUIT</div></div>`;$('#ui').appendChild(m)}else if(m)m.remove()}}
$('#pause').addEventListener('pointerdown',togglePause);
document.addEventListener('pointerdown',ev=>{const t=ev.target.closest('[data-go],[data-act],[data-lv],[data-v],[data-up],[data-sk],[data-w]');if(!t)return;
 const go=t.dataset.go,act=t.dataset.act;
 if(go){const pm=$('#pm');if(pm)pm.remove();paused=false;if(mode==='play'||mode==='over'){mode='menu'}save();showScr(go);return}
 if(t.dataset.lv!=null){const l=+t.dataset.lv,w=S.world;if(l===0||S.stars[w+'-'+(l-1)]>0)start(w,l);return}
 if(t.dataset.w){S.world=(S.world+4+ +t.dataset.w)%4;showScr('map');return}
 if(t.dataset.v!=null){S.veh=+t.dataset.v;showScr('garage');return}
 if(t.dataset.up!=null){const i=+t.dataset.up,c=upCost(i,S.up[i]);if(S.up[i]<MAXU&&S.coins>=c){S.coins-=c;S.up[i]++;save();sfx.coin();showScr('upg')}return}
 if(t.dataset.sk!=null){skPrev=+t.dataset.sk;document.querySelectorAll('.sw').forEach(e=>e.classList.toggle('sel',e===t));drawTo($('#gv'),vsprite2(S.veh,skPrev),420,1);return}
 if(act==='pick'){save();showScr('map')}
 else if(act==='buy'){const v=VEH[S.veh];if(S.coins>=v.cost&&!S.own[S.veh]){S.coins-=v.cost;S.own[S.veh]=1;save();sfx.win();showScr('garage')}}
 else if(act==='apply'){S.skin[S.veh]=skPrev;save();showScr('garage')}
 else if(act==='snd'){S.snd=S.snd?0:1;save();if($('#pm')){$('#pm').remove();paused=false}else showScr('set')}
 else if(act==='reset'){if(confirm('Reset all progress?')){localStorage.removeItem('hcr_v1');location.reload()}}
 else if(act==='resume')togglePause();
 else if(act==='retry'){const pm=$('#pm');if(pm)pm.remove();start(run.w,run.l)}
 else if(act==='next'){start(run.w,run.l+1)}
});
/* ---------- main loop ---------- */
let last=0,acc=0,tm=0;
function frame(t){requestAnimationFrame(frame);const dt=Math.min(.05,(t-last)/1000||0);last=t;
 if(mode==='play'&&!paused){acc+=dt;while(acc>1/240){step(1/240);acc-=1/240}
  for(const p of parts){p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=60*dt}parts=parts.filter(p=>p.l>0);
  drawScene();hudUpd()}
 else if(mode==='over'){for(const p of parts){p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt}drawScene()}
 else if(mode==='play'&&paused){}
 else{drawMenuBG(dt)}}
function drawMenuBG(dt){tm+=dt;g.setTransform(DPR,0,0,DPR,0,0);const z=H/620;
 if(!LV){LV=mk(0,0)}
 drawBG(tm*160,0,z);
 const sc=document.getElementById('s_title')?1:0;
 if(sc){/* title scene: big jeep on a rock ledge */
  const gy=H*.93,bw=W*.46,bh=bw*IM.jeep.height/IM.jeep.width;g.save();g.translate(W*.05,gy-bh*.99);g.drawImage(vsprite(S.veh),0,0,bw,bh);
  const k=bw/IM.jeep.width,wr=45*k*1.03;[[88,158],[283,158]].forEach(p=>{g.save();g.translate(p[0]*k,p[1]*k);g.rotate(tm*2);g.drawImage(IM.wheel,-wr,-wr,wr*2,wr*2);g.restore()});g.restore();
  g.fillStyle=dirtPattern();g.save();g.translate(0,gy-8);g.scale(H/620*1.1,H/620*1.1);g.fillRect(0,0,W,H);g.restore();g.fillStyle='#4aa52e';g.fillRect(0,gy-14,W,14);g.fillStyle='#86d94a';g.fillRect(0,gy-14,W,6)}
 else{const gd=g.createLinearGradient(0,H*.5,0,H);gd.addColorStop(0,'#0000');gd.addColorStop(1,'#08101fcc');g.fillStyle=gd;g.fillRect(0,0,W,H)}
 if(!sc&&!document.querySelector('.scr')){}
}
load().then(()=>{showScr('title');requestAnimationFrame(frame)});
</script></body></html>
