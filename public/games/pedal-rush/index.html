<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e3b43">
<title>Pedal Rush – Cycle Racing</title>
<style>
:root{--teal:#0e3b43;--teal2:#17606b;--sun:#ffc83d;--coral:#ff5d47;--mint:#5ef2c0;--ink:#06191d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;position:fixed;inset:0;background:var(--teal);color:#fff;font-family:"Arial Rounded MT Bold","Trebuchet MS","Segoe UI",system-ui,sans-serif}
canvas{position:fixed;left:0;top:0;display:block}
.hide{display:none!important}
#hud{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;display:flex;gap:8px;align-items:flex-start;padding:10px;pointer-events:none}
.pill{background:linear-gradient(180deg,var(--teal2),var(--teal));border:3px solid var(--ink);border-radius:14px;padding:5px 12px;font-weight:900;font-size:20px;text-shadow:0 2px 0 var(--ink);box-shadow:0 3px 0 #000a;white-space:nowrap}
.pill small{font-size:12px;opacity:.75;margin-left:3px}.pill b{color:var(--sun)}
.cn{display:inline-block;width:20px;height:20px;border-radius:50%;vertical-align:-4px;margin-right:5px;background:radial-gradient(circle at 35% 30%,#fff3a8,#ffc83d 45%,#e08a00);border:2.5px solid var(--ink)}
#hp{letter-spacing:2px}
.meters{flex:1;max-width:150px;margin-left:auto;padding-top:6px}
.bar{height:16px;border-radius:10px;background:#04120f;border:3px solid var(--ink);overflow:hidden;box-shadow:0 2px 0 #000a}
#sta{display:block;height:100%;width:100%;background:linear-gradient(180deg,#9bffe0,#25c68e)}#sta.low{background:#ff4a3a}
#pad{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0);display:flex;justify-content:space-between;align-items:flex-end;padding:14px;gap:10px;pointer-events:none}
#pad button{pointer-events:auto;height:min(15vh,86px);border:3px solid var(--ink);border-bottom-width:8px;border-radius:22px;color:#fff;font-size:30px;font-weight:900;text-shadow:0 3px 0 var(--ink);background:linear-gradient(180deg,#2aa3b3,#17606b);width:min(24vw,120px)}
#pad #bB{width:min(36vw,170px);font-size:20px;background:linear-gradient(180deg,#ffd95e,#ff9f1c);color:#2a1400;text-shadow:none}
#pad button.on{transform:translateY(5px);border-bottom-width:3px;filter:brightness(1.15)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);background:var(--teal);border:3px solid var(--ink);padding:7px 16px;border-radius:12px;font-weight:900;opacity:0;transition:opacity .2s;pointer-events:none}#toast.on{opacity:1}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000a;padding:12px;overflow:auto}
.card{width:min(440px,100%);max-height:calc(100dvh - 24px);overflow:auto;background:linear-gradient(180deg,var(--teal2),var(--teal) 75%);border:4px solid var(--ink);box-shadow:0 0 0 3px var(--mint),0 24px 60px #000b;border-radius:24px;padding:18px;text-align:center}
.logo{font-size:52px;line-height:.92;font-weight:900;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);transform:rotate(-3deg);margin:6px 0 2px}.logo i{display:block;font-style:normal;color:var(--sun);font-size:46px}
.ttl{font-size:34px;font-weight:900;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.tag{color:var(--mint);font-weight:800;margin:6px 0 10px}.sub{opacity:.8;margin:4px 0 10px}
.big{display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:900;color:var(--sun);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}.big .cn{width:34px;height:34px}
.row2{display:flex;justify-content:center;gap:10px;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.tile{position:relative;background:#0c2e35;border:3px solid #04120f;border-radius:16px;padding:10px 6px;color:#fff;font:inherit;font-size:13px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:3px}
.tile.sel{border-color:var(--sun);background:#17606b}.tile.lock{opacity:.6}.tile .e{font-size:34px}.tile small{opacity:.85}
.st{display:flex;align-items:center;gap:6px;width:100%;font-size:10px}.st span{width:30px;text-align:left}.st i{flex:1;height:6px;background:#04120f;border-radius:4px;overflow:hidden}.st b{display:block;height:100%;background:var(--mint)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.g3>div{background:#0c2e35;border-radius:12px;padding:8px 2px}.g3 b{display:block;font-size:15px}.g3 small{opacity:.7;font-size:10px}
button.go{width:100%;margin-top:10px;padding:14px;font:inherit;font-size:22px;font-weight:900;color:#2a1400;background:linear-gradient(180deg,#ffd95e,#ff9f1c);border:3px solid var(--ink);border-bottom-width:8px;border-radius:18px;letter-spacing:1px}
button.go:active{transform:translateY(4px);border-bottom-width:4px}button.go:disabled{opacity:.4}
button.go.alt{background:linear-gradient(180deg,#3fb6c6,#17606b);color:#fff;font-size:17px;margin-top:6px}
button.go.buy{background:linear-gradient(180deg,#9bffe0,#25c68e)}
.nb{color:var(--sun);font-weight:900;margin:6px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><style id="nomenu">img,canvas,button{-webkit-touch-callout:none;-webkit-user-drag:none;user-select:none;-webkit-user-select:none}img{pointer-events:auto;-webkit-user-drag:none}</style>
<script>
/* no long-press image/context menu while playing; release pedals if the page loses focus */
addEventListener('contextmenu',function(e){e.preventDefault()},true);
addEventListener('dragstart',function(e){e.preventDefault()},true);
document.addEventListener('selectstart',function(e){e.preventDefault()},true);
(function(){function nd(){document.querySelectorAll('img').forEach(function(i){i.draggable=false})}document.addEventListener('DOMContentLoaded',nd);new MutationObserver(nd).observe(document.documentElement,{childList:true,subtree:true})})();
</script>
</head><body>
<canvas id="c"></canvas>
<div id="hud" class="hide"><div class="pill"><b id="dist">0</b><small>m</small></div><div class="pill"><span class="cn"></span><b id="coin">0</b></div><div class="pill" id="hp">❤❤❤</div><div class="meters"><div class="bar"><i id="sta"></i></div></div></div>
<div id="toast"></div>
<div id="pad" class="hide"><button id="bL">◀</button><button id="bB">PEDAL!</button><button id="bR">▶</button></div>
<div id="menu"></div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),cx=cv.getContext('2d'),menu=$('menu');
let W=360,H=640,hy=230,by=550;
let QCAP=1.5,_qs=0,_qn=0;function adaptQ(dt){if(QCAP<=1)return;_qs+=dt;if(++_qn>=90){const avg=_qs/_qn;_qs=0;_qn=0;if(avg>.026){QCAP=Math.max(1,QCAP-.25);rs()}}}
function rs(){const d=Math.min(devicePixelRatio||1,QCAP);W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);cv.style.width=W+'px';cv.style.height=H+'px';cv.width=Math.round(W*d);cv.height=Math.round(H*d);cx.setTransform(d,0,0,d,0,0);hy=H*.36;by=H*.84}
addEventListener('resize',rs);rs();
let toastT=0;function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),1500)}
/* ---------- save ---------- */
let save={coins:0,best:0,bike:0,own:[1,0,0,0],runs:0,mute:0};
try{Object.assign(save,JSON.parse(localStorage.getItem('pedalrush1')||'{}'))}catch(e){}
const persist=()=>{try{localStorage.setItem('pedalrush1',JSON.stringify(save))}catch(e){}};
const BIKES=[{n:'Street BMX',e:'🚲',cost:0,col:'#ff5d47',lane:9,sta:100},{n:'Road Racer',e:'🚴',cost:300,col:'#ffc83d',lane:10.5,sta:125},{n:'Trail Blazer',e:'🚵',cost:800,col:'#5ef2c0',lane:12,sta:155},{n:'Volt E-Bike',e:'⚡',cost:1800,col:'#b58bff',lane:14,sta:210}];
/* ---------- audio ---------- */
let ac;function audio(){if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){ac=null}}
function tone(f,d,ty,v,sl,t0){if(!ac||save.mute)return;const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+(t0||0);o.type=ty||'sine';o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*sl),n+d);g.gain.setValueAtTime(v||.1,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d+.02)}
function sfx(k,a){if(k==='coin'){const f=880*Math.pow(1.0595,Math.min(12,a||0));tone(f,.08,'square',.05);tone(f*1.5,.1,'square',.04,1,.05)}
 else if(k==='bottle')[523,659,784].forEach((f,i)=>tone(f,.12,'triangle',.1,1,i*.06));
 else if(k==='crash'){tone(150,.4,'sawtooth',.16,.25);tone(80,.5,'square',.1,.3)}
 else if(k==='near')tone(660,.12,'triangle',.08,1.6);
 else if(k==='over')[392,330,262].forEach((f,i)=>tone(f,.25,'triangle',.1,1,i*.18))}
/* ---------- game ---------- */
const keys={boost:0};let st='menu',g=null,fl=[],now=0;
const K=d=>1/(1+d*.1),Yd=d=>hy+(by-hy)*K(d),HW=d=>W*.5*K(d),LX=(l,d)=>W/2+l*HW(d)*.667;
const SKY=[[[79,195,255],[217,246,255]],[[255,122,89],[255,210,158]],[[11,16,51],[58,42,122]],[[255,156,207],[255,232,184]]],DARK=[0,.12,.5,.15];
const mix=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t)),rgb=c=>'rgb('+c.join(',')+')';
const hs=n=>{let h=Math.imul(n|0,374761393)+668265263|0;h=Math.imul(h^(h>>>13),1274126177);return(h^(h>>>16))>>>0};
function start(){audio();const B=BIKES[save.bike];g={z:0,v:14,x:0,tl:0,hp:3,inv:0,coins:0,sta:B.sta,max:B.sta,obs:[],nz:26,time:0,shake:0,B,near:0,cr:0,bt:0};fl=[];st='play';
 menu.classList.add('hide');['hud','pad'].forEach(i=>$(i).classList.remove('hide'));hud()}
function spawnRow(){const z=g.nz,L=[-1,0,1],r=Math.random(),pk=a=>a[Math.floor(Math.random()*a.length)];
 const ob=(l,t)=>g.obs.push({t,l,z,p:0}),line=(l,t0)=>{for(let i=0;i<4;i++)g.obs.push({t:'coin',l,z:z+t0+i*3.2})};
 const kind=()=>pk(['cone','cone','pot','car']);
 if(r<.5){const o=pk(L);ob(o,kind());line(pk(L.filter(l=>l!==o)),0)}
 else if(r<.75){const free=pk(L);L.filter(l=>l!==free).forEach(l=>ob(l,kind()));line(free,0)}
 else if(r<.87){const l=pk(L);if(g.sta<g.max*.75)g.obs.push({t:'bottle',l,z});else line(l,0);ob(pk(L.filter(x=>x!==l)),kind())}
 else{const a=pk(L);for(let i=0;i<5;i++)g.obs.push({t:'coin',l:Math.max(-1,Math.min(1,a+(i<3?(i-1)*.0:0))),z:z+i*3.2})}
 g.nz+=Math.max(10,17-g.z/450)}
function hud(){$('dist').textContent=Math.floor(g.z);$('coin').textContent=g.coins;$('hp').textContent='❤'.repeat(Math.max(0,g.hp))+'♡'.repeat(Math.max(0,3-g.hp));$('sta').style.width=(g.sta/g.max*100)+'%';$('sta').classList.toggle('low',g.sta/g.max<.2)}
function floatT(t,x,y,c){fl.push({t,x,y,c:c||'#ffc83d',l:1})}
function crash(o){if(g.inv>0)return;g.hp--;g.inv=1.7;g.v=9;g.shake=1;g.cr++;sfx('crash');o.p=1;floatT('OUCH!',LX(g.x,0),by-90,'#ff5d47');if(g.hp<=0)over()}
function step(dt){
 g.time+=dt;const B=g.B,base=14+Math.min(22,g.time*.55),bo=keys.boost&&g.sta>1;
 const tv=base*(bo?1.55:1)*(g.inv>0?.75:1);g.v+=(tv-g.v)*Math.min(1,dt*2.2);
 if(bo)g.sta=Math.max(0,g.sta-34*dt);else g.sta=Math.min(g.max,g.sta+9*dt);
 g.z+=g.v*dt;g.x+=(g.tl-g.x)*Math.min(1,dt*B.lane);if(g.inv>0)g.inv-=dt;g.shake=Math.max(0,g.shake-dt*2.5);
 while(g.nz<g.z+110)spawnRow();
 for(const o of g.obs){const d=o.z-g.z;
  if(o.t==='coin'||o.t==='bottle'){if(!o.p&&Math.abs(d)<1.4&&Math.abs(o.l-g.x)<.62){o.p=1;if(o.t==='coin'){g.coins+=3;sfx('coin',g.coins/3|0)}else{g.sta=Math.min(g.max,g.sta+55);sfx('bottle');floatT('+STAMINA',LX(g.x,0),by-100,'#9bffe0')}}}
  else if(!o.p){if(Math.abs(d)<(o.t==='car'?1.7:1.2)&&Math.abs(o.l-g.x)<(o.t==='car'?.72:.6))crash(o);
   else if(d<-1.5&&!o.n){o.n=1;if(Math.abs(o.l-g.x)<1.3&&g.inv<=0){g.coins+=5;g.near++;sfx('near');floatT('CLOSE! +5',LX(g.x,0),by-110,'#5ef2c0')}}}}
 g.obs=g.obs.filter(o=>o.z>g.z-6);
 for(const f of fl){f.y-=60*dt;f.l-=dt*1.3}fl=fl.filter(f=>f.l>0);hud()}
function over(){if(st!=='play')return;st='over';sfx('over');const m=Math.floor(g.z),bonus=Math.floor(m/10),tot=g.coins+bonus;g.m=m;g.bonus=bonus;g.tot=tot;
 g.nb=m>save.best;if(g.nb)save.best=m;save.coins+=tot;save.runs++;persist();$('hud').classList.add('hide');$('pad').classList.add('hide');setTimeout(render,500)}
/* ---------- drawing ---------- */
function tree(x,y,u,n){cx.fillStyle='#4a2f1a';cx.fillRect(x-u*.05,y-u*.5,u*.1,u*.5);cx.fillStyle=n%2?'#2f9e44':'#3fb55a';cx.beginPath();cx.arc(x,y-u*.75,u*.3,0,7);cx.arc(x-u*.2,y-u*.55,u*.22,0,7);cx.arc(x+u*.2,y-u*.55,u*.22,0,7);cx.fill()}
function lamp(x,y,u,dark){cx.fillStyle='#2b2f3a';cx.fillRect(x-u*.025,y-u*1.1,u*.05,u*1.1);cx.fillStyle=dark>.3?'#ffe9a0':'#cfd6e4';cx.beginPath();cx.arc(x,y-u*1.12,u*.09,0,7);cx.fill();if(dark>.3){cx.globalAlpha=.25;cx.beginPath();cx.arc(x,y-u*1.12,u*.3,0,7);cx.fill();cx.globalAlpha=1}}
function obj(o,dk){const d=o.z-g.z;if(d<-3||d>115)return;const k=K(Math.max(0,d)),y=Yd(Math.max(0,d)),x=LX(o.l,Math.max(0,d)),u=W*.2*k;if(o.p&&o.t!=='car'&&o.t!=='cone'&&o.t!=='pot')return;
 cx.save();if(o.p&&(o.t==='car'||o.t==='cone'||o.t==='pot'))cx.globalAlpha=.45;
 if(o.t==='coin'){const w=Math.max(.2,Math.abs(Math.cos(now*5+o.z)));cx.fillStyle='#ffc83d';cx.strokeStyle='#2a1400';cx.lineWidth=Math.max(1,u*.05);cx.beginPath();cx.ellipse(x,y-u*.45,u*.2*w,u*.2,0,0,7);cx.fill();cx.stroke();cx.fillStyle='#e08a00';cx.beginPath();cx.ellipse(x,y-u*.45,u*.1*w,u*.11,0,0,7);cx.fill()}
 else if(o.t==='bottle'){cx.fillStyle='#35d0ff';cx.strokeStyle='#06191d';cx.lineWidth=Math.max(1,u*.05);cx.beginPath();cx.roundRect(x-u*.1,y-u*.7,u*.2,u*.5,u*.05);cx.fill();cx.stroke();cx.fillStyle='#fff';cx.fillRect(x-u*.06,y-u*.78,u*.12,u*.09)}
 else if(o.t==='pot'){cx.fillStyle='#16131a';cx.beginPath();cx.ellipse(x,y-u*.04,u*.42,u*.12,0,0,7);cx.fill();cx.fillStyle='#000';cx.beginPath();cx.ellipse(x,y-u*.05,u*.3,u*.08,0,0,7);cx.fill()}
 else if(o.t==='cone'){cx.fillStyle='#ff7a1a';cx.strokeStyle='#06191d';cx.lineWidth=Math.max(1,u*.05);cx.beginPath();cx.moveTo(x-u*.2,y);cx.lineTo(x-u*.07,y-u*.62);cx.lineTo(x+u*.07,y-u*.62);cx.lineTo(x+u*.2,y);cx.closePath();cx.fill();cx.stroke();cx.fillStyle='#fff';cx.fillRect(x-u*.12,y-u*.35,u*.24,u*.1)}
 else{const c=['#e63946','#457b9d','#8d99ae','#f4a261'][hs(o.z*7)%4];cx.fillStyle='rgba(0,0,0,.3)';cx.beginPath();cx.ellipse(x,y,u*.62,u*.12,0,0,7);cx.fill();cx.fillStyle=c;cx.strokeStyle='#06191d';cx.lineWidth=Math.max(1,u*.05);cx.beginPath();cx.roundRect(x-u*.55,y-u*.62,u*1.1,u*.55,u*.1);cx.fill();cx.stroke();cx.fillStyle='#bfe9ff';cx.beginPath();cx.roundRect(x-u*.4,y-u*.98,u*.8,u*.4,u*.1);cx.fill();cx.stroke();cx.fillStyle='#ff3b30';cx.fillRect(x-u*.5,y-u*.34,u*.18,u*.1);cx.fillRect(x+u*.32,y-u*.34,u*.18,u*.1)}
 cx.restore()}
function bike(px,py,u,lean){const B=g.B,ped=Math.sin(g.time*g.v*.5);cx.save();cx.fillStyle='rgba(0,0,0,.3)';cx.beginPath();cx.ellipse(px,py,u*.5,u*.12,0,0,7);cx.fill();cx.translate(px,py);cx.rotate(lean);cx.lineCap='round';cx.lineJoin='round';
 const ln=(w,c,x1,y1,x2,y2)=>{cx.strokeStyle=c;cx.lineWidth=w;cx.beginPath();cx.moveTo(x1,y1);cx.lineTo(x2,y2);cx.stroke()};
 cx.fillStyle='#14161f';cx.strokeStyle='#06191d';cx.lineWidth=2;cx.beginPath();cx.ellipse(0,-u*.55,u*.12,u*.55,0,0,7);cx.fill();cx.stroke();
 ln(u*.13,B.col,0,-u*.55,0,-u*1.05);ln(u*.07,'#e9edf5',-u*.1,-u*.8,u*.1,-u*.8);
 ln(u*.13,'#22377a',-u*.12,-u*1.08,-u*.24,-u*.4+ped*u*.16);ln(u*.13,'#22377a',u*.12,-u*1.08,u*.24,-u*.4-ped*u*.16);
 cx.fillStyle='#fff';cx.strokeStyle='#06191d';cx.lineWidth=2;cx.beginPath();cx.roundRect(-u*.3,-u*1.7,u*.6,u*.68,u*.18);cx.fill();cx.stroke();cx.fillStyle=B.col;cx.fillRect(-u*.3,-u*1.35,u*.6,u*.12);
 ln(u*.1,'#f6c796',-u*.3,-u*1.55,-u*.5,-u*1.38);ln(u*.1,'#f6c796',u*.3,-u*1.55,u*.5,-u*1.38);ln(u*.1,'#14161f',-u*.58,-u*1.38,u*.58,-u*1.38);
 cx.fillStyle='#f6c796';cx.beginPath();cx.arc(0,-u*1.92,u*.19,0,7);cx.fill();cx.stroke();cx.fillStyle='#35d0ff';cx.beginPath();cx.arc(0,-u*1.96,u*.23,Math.PI,0);cx.closePath();cx.fill();cx.stroke();
 cx.strokeStyle='#ff6b1a';cx.lineWidth=u*.07;cx.beginPath();cx.moveTo(-u*.1,-u*1.78);cx.quadraticCurveTo(-u*.1,-u*1.6,-u*.28+Math.sin(now*9)*u*.05,-u*1.52);cx.stroke();cx.restore()}
function draw(){now=performance.now()/1000;const z=g?g.z:now*14,ph=Math.floor(z/500)%4,tt=(z%500)/500,A=SKY[ph],Bn=SKY[(ph+1)%4],dk=DARK[ph]+(DARK[(ph+1)%4]-DARK[ph])*tt;
 const top=mix(A[0],Bn[0],tt),bot=mix(A[1],Bn[1],tt),gr=cx.createLinearGradient(0,0,0,hy);gr.addColorStop(0,rgb(top));gr.addColorStop(1,rgb(bot));cx.fillStyle=gr;cx.fillRect(0,0,W,H);
 cx.fillStyle=dk>.3?'#f4f1d0':'#fff3b0';cx.beginPath();cx.arc(W*.78,hy*.55,Math.min(W,H)*.07,0,7);cx.fill();
 const sx=(g?g.x:0)*18;cx.fillStyle=rgb(mix([90,130,150],[20,24,60],dk*1.6>1?1:dk*1.6));cx.beginPath();cx.moveTo(0,hy+2);for(let x=0;x<=W+10;x+=10)cx.lineTo(x,hy-24-22*Math.sin((x+sx)*.011)-12*Math.sin((x+sx)*.031+1.3));cx.lineTo(W,hy+2);cx.fill();
 const sh=g&&g.shake?(Math.random()-.5)*g.shake*8:0;cx.save();cx.translate(sh,0);
 cx.fillStyle=rgb(mix([76,175,80],[20,60,40],dk*1.5>1?1:dk*1.5));cx.fillRect(-20,hy,W+40,H-hy);
 const N=110,zz=z;let prev=null;
 for(let i=0;i<=N;i++){const d=Math.pow(i/N,2)*200,y=hy+(by-hy)*K(d),hw=W*.5*K(d);if(prev){const m=(d+prev.d)/2,par=Math.floor((zz+m)/4)%2;
   cx.fillStyle=par?'rgba(255,255,255,.05)':'rgba(0,0,0,.06)';cx.fillRect(-20,prev.y,W+40,y-prev.y+1);
   cx.fillStyle=par?'#4a4f5c':'#454a56';cx.beginPath();cx.moveTo(W/2-prev.hw,prev.y);cx.lineTo(W/2+prev.hw,prev.y);cx.lineTo(W/2+hw,y+1);cx.lineTo(W/2-hw,y+1);cx.fill();
   cx.fillStyle=par?'#ff5d47':'#fff';for(const s of[-1,1]){cx.beginPath();cx.moveTo(W/2+s*prev.hw,prev.y);cx.lineTo(W/2+s*prev.hw*1.07,prev.y);cx.lineTo(W/2+s*hw*1.07,y+1);cx.lineTo(W/2+s*hw,y+1);cx.fill()}
   if(Math.floor((zz+m)/3)%2){cx.fillStyle='rgba(255,255,255,.85)';for(const s of[-1,1]){const a=s*prev.hw*.333,b=s*hw*.333,wa=prev.hw*.012,wb=hw*.012;cx.beginPath();cx.moveTo(W/2+a-wa,prev.y);cx.lineTo(W/2+a+wa,prev.y);cx.lineTo(W/2+b+wb,y+1);cx.lineTo(W/2+b-wb,y+1);cx.fill()}}}
  prev={d,y,hw}}
 const items=[];if(g)for(const o of g.obs)items.push({z:o.z,o});
 const j0=Math.floor(zz/8);for(let j=j0;j<j0+14;j++){items.push({z:j*8,s:j})}
 items.sort((a,b)=>b.z-a.z);
 for(const it of items){if(it.o){obj(it.o,dk);continue}const d=it.z-zz;if(d<-2||d>110)continue;const k=K(Math.max(0,d)),y=Yd(Math.max(0,d)),u=W*.28*k,side=hs(it.s)%2?1:-1,x=LX(side*(2.05+(hs(it.s+9)%5)*.12),Math.max(0,d));
  if(it.s%3===0)lamp(x,y,u,dk);else tree(x,y,u,it.s)}
 if(g){const u=Math.min(W,H*.75)*.2,px=LX(g.x,0),lean=(g.tl-g.x)*.28;if(g.inv<=0||Math.floor(now*14)%2)bike(px,by+4,u,lean);
  if(keysBoost()){cx.strokeStyle='rgba(255,255,255,.4)';cx.lineWidth=2;cx.beginPath();for(let i=0;i<10;i++){const x=Math.random()*W,y=hy+Math.random()*(H-hy),l=30+Math.random()*60;cx.moveTo(x,y);cx.lineTo(x,y+l)}cx.stroke()}}
 cx.restore();
 if(dk>.05){cx.fillStyle='rgba(6,10,40,'+dk*.8+')';cx.fillRect(0,0,W,H)}
 if(g){cx.textAlign='center';cx.font='900 '+Math.round(22)+'px "Arial Rounded MT Bold",system-ui';cx.lineWidth=5;cx.lineJoin='round';cx.strokeStyle='#06191d';for(const f of fl){cx.globalAlpha=Math.min(1,f.l*1.6);cx.strokeText(f.t,f.x,f.y);cx.fillStyle=f.c;cx.fillText(f.t,f.x,f.y)}cx.globalAlpha=1}
 const vg=cx.createRadialGradient(W/2,H/2,Math.min(W,H)*.4,W/2,H/2,Math.max(W,H)*.8);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.32)');cx.fillStyle=vg;cx.fillRect(0,0,W,H)}
const keysBoost=()=>st==='play'&&keys.boost&&g.sta>1;
/* ---------- menu ---------- */
let splash=1;
const bars=B=>[['⚡',B.lane/14],['🔋',B.sta/210]].map(([n,p])=>`<div class=st><span>${n}</span><i><b style="width:${Math.round(p*100)}%"></b></i></div>`).join('');
function render(){menu.classList.remove('hide');const B=BIKES[save.bike],own=save.own[save.bike];
 if(st==='over'){menu.innerHTML=`<div class=card><div class=ttl>${g.hp<=0?'WIPEOUT':'DONE'}</div><p class=sub>${B.e} ${B.n}</p>
  <div class=big><span class=cn></span>+${g.tot}</div>${g.nb?'<div class=nb>🏆 NEW BEST!</div>':''}
  <div class=g3><div><b>📏 ${g.m} m</b><small>best ${save.best}</small></div><div><b>🪙 ${g.coins}</b><small>pickups</small></div><div><b>😮 ${g.near}</b><small>close calls</small></div></div>
  <p class=sub>+${g.bonus} distance bonus</p><button class=go data-a=start>RETRY</button><button class="go alt" data-a=menu>BIKE SHOP</button></div>`;return}
 if(st==='pause'){menu.innerHTML=`<div class=card><div class=ttl>PAUSED</div><button class=go data-a=resume>RESUME</button><button class="go alt" data-a=mute>${save.mute?'🔇 SOUND OFF':'🔊 SOUND ON'}</button><button class="go alt" data-a=menu>QUIT</button></div>`;return}
 if(splash){menu.innerHTML=`<div class=card><div class=logo>PEDAL<i>RUSH</i></div><p class=tag>Dodge. Pedal. Don't stop.</p><div style="font-size:84px">${B.e}</div>
  <div class=row2><span class=pill><span class=cn></span><b>${save.coins}</b></span><span class=pill>🏆 <b>${save.best}</b><small>m</small></span></div><button class=go data-a=splash>▶ PLAY</button></div>`;return}
 menu.innerHTML=`<div class=card><div class=row2><span class=pill><span class=cn></span><b>${save.coins}</b></span><span class=pill>🏆 <b>${save.best}</b><small>m</small></span></div>
  <div class=grid>${BIKES.map((b,i)=>`<button class="tile ${i===save.bike?'sel':''} ${save.own[i]?'':'lock'}" data-a=pick data-i=${i}><span class=e>${b.e}</span>${b.n}<small>${save.own[i]?'✓ owned':'🔒 '+b.cost}</small>${bars(b)}</button>`).join('')}</div>
  ${own?'<button class=go data-a=start>▶ RIDE</button>':`<button class="go buy" data-a=buy ${save.coins<B.cost?'disabled':''}>🔓 UNLOCK 🪙${B.cost}</button>`}
  <button class="go alt" data-a=mute>${save.mute?'🔇 SOUND OFF':'🔊 SOUND ON'}</button></div>`}
menu.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const a=b.dataset.a,i=+b.dataset.i;
 if(a==='splash'){audio();splash=0}else if(a==='pick')save.bike=i;else if(a==='buy'&&save.coins>=BIKES[save.bike].cost){save.coins-=BIKES[save.bike].cost;save.own[save.bike]=1;toast('Unlocked '+BIKES[save.bike].n+'!')}
 else if(a==='mute')save.mute=save.mute?0:1;else if(a==='menu'){st='menu';g=null;['hud','pad'].forEach(i=>$(i).classList.add('hide'))}
 else if(a==='start'){persist();start();return}else if(a==='resume'){menu.classList.add('hide');st='play';return}
 persist();render()});
function pause(){if(st!=='play')return;st='pause';keys.boost=0;setPad();render()}
/* ---------- input ---------- */
const mv=d=>{if(st==='play')g.tl=Math.max(-1,Math.min(1,g.tl+d))};
function setPad(){$('bB').classList.toggle('on',!!keys.boost)}
addEventListener('keydown',e=>{if(e.code==='Escape'||e.code==='KeyP'){pause();return}
 if(st==='over'&&['Enter','Space'].includes(e.code)){start();return}
 if(e.code==='ArrowLeft'||e.code==='KeyA')mv(-1);else if(e.code==='ArrowRight'||e.code==='KeyD')mv(1);else if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){keys.boost=1;setPad()}
 if(st==='play')e.preventDefault()});
addEventListener('keyup',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){keys.boost=0;setPad()}});
$('bL').addEventListener('pointerdown',e=>{e.preventDefault();mv(-1)});$('bR').addEventListener('pointerdown',e=>{e.preventDefault();mv(1)});
const bb=$('bB');bb.addEventListener('pointerdown',e=>{keys.boost=1;setPad();try{bb.setPointerCapture(e.pointerId)}catch(x){}});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>bb.addEventListener(ev,()=>{keys.boost=0;setPad()}));
let sx0=0;cv.addEventListener('pointerdown',e=>{sx0=e.clientX;mv(e.clientX<W/2?-1:1)});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});addEventListener('contextmenu',e=>e.preventDefault());
/* ---------- loop ---------- */
let last=performance.now();
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000||0);last=t;if(st==='play'){adaptQ(dt);step(dt)}draw()}
render();requestAnimationFrame(loop);
</script></body></html>
