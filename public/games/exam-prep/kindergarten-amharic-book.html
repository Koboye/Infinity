</style></head><body><header><a href="index.html">← ወደ ExamPro ተመለስ</a><h1>📚 የመዋዕለ ሕፃናት አማርኛ መጽሐፍ</h1><p>8 ቀላል ትምህርቶች · ማየት፣ መናገር፣ መቁጠርና መጫወት</p><div class="progress" id="progress" aria-live="polite"></div></header><main><div class="layout"><nav class="toc" id="toc" aria-label="የመጽሐፉ ምዕራፎች"></nav><article class="book" id="page" aria-live="polite"></article></div></main><script>(function(){'use strict';var chapters=[["👋","ሰላምታና መተዋወቅ","ሰላም ማለት፣ ራሳችንን ማስተዋወቅና ሌሎችን ማክበር እንማራለን።",[["👋","ሰላም","ጓደኛችንን «ሰላም» እንበል።"],["😊","እንዴት ነህ?","ስሜታችንን በቀላል ቃላት እንናገር።"],["🤝","እናመሰግናለን","ሰው ሲረዳን «አመሰግናለሁ» እንበል።"]],"ስምህን ተናገር። ከዚያ «ሰላም፣ ስሜ … ነው» በል።"],["🔤","የግዕዝ ፊደላት — መጀመሪያ","ፊደላትን እንመልከት፣ ድምፃቸውን እንስማ፣ እንደግማቸው።",[["ሀ","ሀ ሁ ሂ ሃ","የሀ ቤተሰብ"],["ለ","ለ ሉ ሊ ላ","የለ ቤተሰብ"],["መ","መ ሙ ሚ ማ","የመ ቤተሰብ"],["ሰ","ሰ ሱ ሲ ሳ","የሰ ቤተሰብ"]],"ሀ፣ ለ፣ መ፣ ሰ በወረቀት ላይ ለመጻፍ ሞክር።"],["📖","ቃላትና ድምፆች","አጫጭር ቃላትን በማየትና በመናገር እንለማመድ።",[["🏠","ቤት","ቤት ውስጥ እንኖራለን።"],["💧","ውሃ","ውሃ እንጠጣለን።"],["☀️","ፀሐይ","ፀሐይ ብርሃን ትሰጣለች።"],["📚","መጽሐፍ","መጽሐፍ እናነባለን።"]],"ከቤትህ ውስጥ ሦስት ነገሮችን አመልክትና ስማቸውን ተናገር።"],["🔢","ቁጥሮች ከ1 እስከ 10","አንድ ነገር ለአንድ ቁጥር በመጠቆም እንቆጥር።",[["1️⃣","1 — አንድ","አንድ ኳስ"],["2️⃣","2 — ሁለት","ሁለት እጆች"],["3️⃣","3 — ሦስት","ሦስት እርሳሶች"],["🔟","4–10","አራት፣ አምስት፣ ስድስት፣ ሰባት፣ ስምንት፣ ዘጠኝ፣ አሥር"]],"አምስት እርሳሶችን ወይም አምስት ጠጠሮችን ቆጥር።"],["🔴","ቀለሞችና ቅርጾች","ቀለሞችንና ቅርጾችን በአካባቢያችን እንፈልግ።",[["🔴","ቀይ","ቀይ ቀለም"],["🟡","ቢጫ","ቢጫ ቀለም"],["🔵","ሰማያዊ","ሰማያዊ ቀለም"],["🔺","ሶስት ማዕዘን","ሶስት ጎኖች አሉት።"],["⚪","ክብ","ክብ ቅርጽ"],["🟩","ካሬ","አራት እኩል ጎኖች አሉት።"]],"በክፍልህ ወይም በቤትህ አንድ ቀይ ነገርና አንድ ክብ ነገር ፈልግ።"],["🐄","እንስሳትና ተፈጥሮ","እንስሳትንና እፅዋትን እንወቅ።",[["🐄","ላም","ላም ወተት ትሰጠናለች።"],["🐈","ድመት","ድመት የቤት እንስሳ ናት።"],["🐦","ወፍ","ወፍ ላባ አላት።"],["🌳","ዛፍ","ዛፍ ሥር፣ ግንድና ቅጠል አለው።"]],"የምታውቀውን አንድ እንስሳ ሳል፤ ስሙንም ተናገር።"],["🧼","ንጽህናና ጤና","እጃችንን መታጠብና ሰውነታችንን መንከባከብ እንማራለን።",[["🫧","እጅ መታጠብ","በሳሙናና በንጹህ ውሃ እጃችንን እንታጠብ።"],["🪥","ጥርስ መቦረሽ","ጥርሳችንን እንቦርሽ።"],["🥕","ጤናማ ምግብ","የተለያዩ ጤናማ ምግቦችን እንመገብ።"],["😴","እረፍት","በቂ እንቅልፍ እንተኛ።"]],"ከአዋቂ ሰው ጋር እጅህን በሳሙናና በውሃ ታጠብ።"],["🇪🇹","ቤተሰቤና አካባቢዬ","ቤተሰብ፣ ትምህርት ቤትና ማኅበረሰብ እንወቅ።",[[
