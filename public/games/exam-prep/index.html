<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a21b8">
<title>ExamPrep · Grade 12, university &amp; exit-exam practice</title>
<style>
:root{--bg:#f4f3ff;--card:#fff;--ink:#1a1838;--muted:#605d8a;--line:#dedcf5;--brand:#5b3df5;--brand2:#3a21b8;--gold:#ffb020;--bad:#c62828;--good:#12803f;--soft:#ecebff}
@media(prefers-color-scheme:dark){:root{--bg:#0f0d1f;--card:#181533;--ink:#ecebff;--muted:#a9a5d6;--line:#2a2650;--brand:#8f7bff;--brand2:#5a44d6;--soft:#211d45;--bad:#ff8a80;--good:#6fe3a0}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans Ethiopic',sans-serif;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3{line-height:1.25;margin:0 0 .5em}.wrap{max-width:860px;margin:0 auto;padding:14px}
.top{position:sticky;top:0;z-index:5;background:var(--brand2);color:#fff}.top .wrap{display:flex;align-items:center;gap:10px;padding:10px 14px}.brand{font-weight:800;flex:1;cursor:pointer}.top a{color:#fff;font-size:14px;text-decoration:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}.hero{background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff;border:0}.hero p{opacity:.92;margin:.2em 0 0}
.btn{appearance:none;border:0;background:var(--brand);color:#fff;padding:10px 16px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}.btn.alt{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}.btn.gold{background:var(--gold);color:#2b1d00}.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}.hint{color:var(--muted);font-size:14px}.mt{margin-top:14px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}.dept{display:block;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;transition:transform .15s,box-shadow .15s}.dept:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.08)}.dept b{display:block}.dept small{color:var(--muted)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--soft);color:var(--brand)}.pill.warn{background:#fff1d6;color:#7a5300}.pill.bad{background:#fde3e1;color:var(--bad)}.pill.good{background:#dff5e7;color:var(--good)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}.stat b{display:block;font-size:19px}.stat small{color:var(--muted);font-size:12px}
.ring,.bar{height:9px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}.ring i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffcf5a);transition:width .5s}.bar i{display:block;height:100%;background:var(--brand);transition:width .3s}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.chips button{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;font:inherit;font-weight:600;cursor:pointer}.chips button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;transition:transform .12s,border-color .12s}.opt:hover:not([disabled]){border-color:var(--brand)}.opt:active:not([disabled]){transform:scale(.98)}.opt.sel{border-color:var(--brand);background:var(--soft)}.opt.right{border-color:var(--good);background:#dff5e7;color:#0b4d27}.opt.wrong{border-color:var(--bad);background:#fde3e1;color:#7a1610;animation:shake .35s}
.ltr{flex:none;width:30px;height:30px;border-radius:9px;background:var(--soft);color:var(--brand);display:grid;place-items:center;font-weight:800}.opt.right .ltr{background:var(--good);color:#fff}.opt.wrong .ltr{background:var(--bad);color:#fff}
.q{font-size:19px;white-space:pre-line}.explain{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;animation:pop .35s}.verdict{padding:10px 12px;font-weight:800;background:var(--soft);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.verdict span{font-weight:500;font-size:14px}.ok{color:var(--good)}.err{color:var(--bad)}
.blk{padding:10px 12px;border-top:1px solid var(--line)}.blk p{margin:.2em 0 0}.blk small{font-weight:800;color:var(--brand);letter-spacing:.5px}.blk.warn small{color:var(--bad)}.more{padding:8px 12px;border-top:1px solid var(--line)}.more p{margin:0}
.flash{margin-top:10px;font-weight:800;text-align:center;animation:rise .6s}.big{font-size:44px;font-weight:800;text-align:center;animation:pop .4s}.c{text-align:center}
details summary{cursor:pointer;font-weight:700;padding:6px 0}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:none;opacity:1}}@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}@keyframes rise{0%{transform:translateY(8px);opacity:0}100%{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><span class="brand" id="home">📚 ExamPrep</span><a href="/">← Games</a></div></header>
<main class="wrap" id="app"></main>
<script src="bank.js"></script>
<script>
(function () {
  'use strict';
  var BANK = window.BANK || [], L = 'ABCD', GOAL = 20, KEY = 'examprep.static.v1', app = document.getElementById('app');
  var POS = /\b(all|none|neither|both)\b.*\b(above|them|these|a and b)\b|\bnone of\b|\ball of\b/i;
  var GROUPS = [['all', 'All'], ['g12', '🎓 Grade 12 Entrance'], ['uni', '🏛 University & Exit'], ['fresh', '📘 Freshman']];
  var ui = { group: 'all', search: '' };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function ymd(d) { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function yest() { var d = new Date(); d.setDate(d.getDate() - 1); return ymd(d); }
  function load() { var s = { xp: 0, streak: 0, last: '', day: '', today: 0, best: {}, mistakes: {}, answered: 0, correct: 0 }; try { Object.assign(s, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {} if (s.day !== ymd()) s.today = 0; return s; }
  function save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }
  function level(xp) { var l = Math.floor(Math.sqrt(xp / 50)); return l + 1; }
  function shuffle(a) { var b = a.slice(); for (var i = b.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = b[i]; b[i] = b[j]; b[j] = t; } return b; }
  function prep(raw, dept, i) {
    var q = { id: dept + '-' + i, text: raw[0], options: raw[1].slice(), answer: raw[2], explanation: raw[3], topic: raw[4] || '' };
    if (!q.options.some(function (o) { return POS.test(o); })) { var key = q.options[q.answer]; q.options = shuffle(q.options); q.answer = q.options.indexOf(key); }
    return q;
  }
  function record(dept, q, ok, combo) {
    var s = load(), t = ymd();
    if (s.day !== t) { s.streak = s.last === yest() ? s.streak + 1 : 1; s.day = t; s.today = 0; } else if (!s.streak) s.streak = 1;
    s.last = t; s.today++; s.answered++;
    var gain = ok ? 10 + Math.min(combo, 5) * 2 : 2; s.xp += gain; if (ok) s.correct++;
    var m = s.mistakes[dept] = s.mistakes[dept] || {};
    if (ok) delete m[q.id]; else if (Object.keys(m).length < 200) m[q.id] = { id: q.id, text: q.text, options: q.options, answer: q.answer, explanation: q.explanation, topic: q.topic };
    save(s); return { s: s, gain: gain };
  }
  function norm(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9\u1200-\u137f\s]/g, ' ').replace(/\s+/g, ' ').trim(); }
  function sentences(t) { return (String(t || '').replace(/\s+/g, ' ').match(/[^.!?]+(?:[.!?]+(?=\s|$)|$)/g) || []).map(function (x) { return x.trim(); }).filter(Boolean); }
  function explain(q, chosen) {
    var s = sentences(q.explanation), key = s[0] || q.explanation, rest = s.slice(1), right = chosen === q.answer, wrong = !right && chosen != null ? q.options[chosen] : null, why = null;
    if (wrong && norm(wrong).length >= 4) why = rest.filter(function (x) { return norm(x).indexOf(norm(wrong)) >= 0; })[0] || null;
    var more = rest.filter(function (x) { return x !== why; });
    return '<div class="explain"><div class="verdict"><b class="' + (right ? 'ok' : chosen == null ? '' : 'err') + '">' + (right ? '✅ Correct!' : chosen == null ? '⏭ Skipped' : '❌ Not quite') + '</b><span>Answer: <b>' + L[q.answer] + '. ' + esc(q.options[q.answer]) + '</b></span></div>' +
      '<div class="blk"><small>💡 KEY IDEA</small><p>' + esc(key) + '</p></div>' +
      (wrong ? '<div class="blk warn"><small>🔍 WHY NOT ' + L[chosen] + '?</small><p>' + esc(why || 'You chose “' + wrong + '”. It looks close, but it is not what the question asks: re-read the key idea and compare it with the correct option.') + '</p></div>' : '') +
      (more.length ? '<details class="more"><summary>Read the full explanation</summary><p>' + esc(more.join(' ')) + '</p></details>' : '') + '</div>';
  }
  function dept(id) { return BANK.filter(function (d) { return d.id === id; })[0]; }

  // ── home
  function home() {
    var p = load(), k = ui.search.trim().toLowerCase(), acc = p.answered ? Math.round(p.correct / p.answered * 100) : 0, pct = Math.min(100, Math.round(p.today / GOAL * 100));
    var mist = 0; Object.keys(p.mistakes).forEach(function (d) { mist += Object.keys(p.mistakes[d]).length; });
    var list = BANK.filter(function (d) { return (ui.group === 'all' || d.group === ui.group) && (!k || d.name.toLowerCase().indexOf(k) >= 0 || d.college.toLowerCase().indexOf(k) >= 0); });
    var order = ['Grade 12 Entrance (ESSLCE)'], colleges = []; list.forEach(function (d) { if (colleges.indexOf(d.college) < 0) colleges.push(d.college); });
    colleges.sort(function (a, b) { return (a === order[0] ? -1 : 0) - (b === order[0] ? -1 : 0); });
    var html = '<section class="card hero"><h1>Pass your entrance, university and exit exams</h1><p>Real past-paper questions with a smart explanation after every answer. Free to practise.</p></section>' +
      '<div class="stats"><div class="stat"><b>🔥 ' + p.streak + '</b><small>day streak</small></div><div class="stat"><b>⭐ ' + p.xp + '</b><small>XP · Level ' + level(p.xp) + '</small></div><div class="stat"><b>🎯 ' + acc + '%</b><small>accuracy</small></div><div class="stat"><b>📝 ' + mist + '</b><small>to review</small></div></div>' +
      '<div class="card"><b>Daily goal: ' + Math.min(p.today, GOAL) + '/' + GOAL + (pct >= 100 ? ' 🎉' : '') + '</b><div class="ring"><i style="width:' + pct + '%"></i></div></div>' +
      '<input id="search" aria-label="Search" placeholder="Search your subject or department…" value="' + esc(ui.search) + '"><div class="chips mt">' +
      GROUPS.map(function (g) { return '<button data-g="' + g[0] + '" class="' + (ui.group === g[0] ? 'on' : '') + '">' + g[1] + '</button>'; }).join('') + '</div>';
    colleges.forEach(function (c) {
      var ds = list.filter(function (d) { return d.college === c; }), total = ds.reduce(function (n, d) { return n + d.q.length; }, 0);
      html += '<details class="card" ' + (c === order[0] || k || ui.group !== 'all' ? 'open' : '') + '><summary>' + esc(c) + ' <span class="pill">' + total + ' questions</span></summary><div class="grid mt">' +
        ds.map(function (d) { return '<button class="dept" data-d="' + esc(d.id) + '"><b>' + esc(d.name) + '</b><small>' + d.q.length + ' questions</small></button>'; }).join('') + '</div></details>';
    });
    if (!colleges.length) html += '<p class="hint">Nothing matches “' + esc(ui.search) + '”.</p>';
    html += '<p class="hint c">Answers and progress are saved on this device. Always study your course materials too.</p>';
    app.innerHTML = html;
    var s = document.getElementById('search'); if (s) s.oninput = function () { ui.search = s.value; var pos = s.selectionStart; home(); var n = document.getElementById('search'); n.focus(); n.setSelectionRange(pos, pos); };
    [].forEach.call(app.querySelectorAll('[data-g]'), function (b) { b.onclick = function () { ui.group = b.getAttribute('data-g'); home(); }; });
    [].forEach.call(app.querySelectorAll('[data-d]'), function (b) { b.onclick = function () { deptPage(b.getAttribute('data-d'), ''); }; });
    window.scrollTo(0, 0);
  }

  // ── department
  function deptPage(id, topic) {
    var d = dept(id), p = load(), mist = Object.keys(p.mistakes[id] || {}).length;
    var topics = []; d.q.forEach(function (r) { if (r[4] && topics.indexOf(r[4]) < 0) topics.push(r[4]); }); topics.sort();
    var pool = d.q.filter(function (r) { return !topic || r[4] === topic; }), max = pool.length;
    var sizes = [5, 10, 20, 30, 50, 100, max].filter(function (x, i, a) { return x <= max && a.indexOf(x) === i; }).sort(function (a, b) { return a - b; });
    var b1 = p.best[id + ':practice'], b2 = p.best[id + ':exam'];
    app.innerHTML = '<p><a href="#" id="back">← All subjects</a></p><section class="card hero"><h1>' + esc(d.name) + '</h1><p>' + d.q.length + ' questions with explanations</p></section>' +
      (mist ? '<div class="card" style="border-color:var(--bad)"><h2>📝 Fix my mistakes</h2><p class="hint">' + mist + ' question(s) you got wrong. Answer one correctly and it leaves the list.</p><button class="btn" id="fix">Practise my mistakes (' + mist + ')</button></div>' : '') +
      (topics.length > 1 ? '<div class="chips"><button data-t="" class="' + (!topic ? 'on' : '') + '">All</button>' + topics.map(function (t) { return '<button data-t="' + esc(t) + '" class="' + (topic === t ? 'on' : '') + '">' + esc(t) + '</button>'; }).join('') + '</div>' : '') +
      '<div class="card"><h2>Practice ' + (b1 ? '<span class="pill good">best ' + b1 + '%</span>' : '') + '</h2><p class="hint">See the answer and a smart explanation after every question.</p><button class="btn" id="prac">Start practice (' + max + ')</button></div>' +
      '<div class="card"><h2>' + (d.group === 'g12' ? 'Mock entrance exam' : 'Exit exam simulation') + ' ' + (b2 ? '<span class="pill good">best ' + b2 + '%</span>' : '') + '</h2><p class="hint">Timed, answers shown only at the end.</p><label for="n" class="hint">Number of questions</label><select id="n">' + sizes.map(function (x) { return '<option>' + x + '</option>'; }).join('') + '</select><button class="btn gold mt" id="exam">Start timed exam</button></div>';
    document.getElementById('back').onclick = function (e) { e.preventDefault(); home(); };
    [].forEach.call(app.querySelectorAll('[data-t]'), function (b) { b.onclick = function () { deptPage(id, b.getAttribute('data-t')); }; });
    document.getElementById('prac').onclick = function () { quiz(id, 'practice', pool.map(function (r, i) { return prep(r, id, d.q.indexOf(r)); }), topic || 'Practice'); };
    document.getElementById('exam').onclick = function () { var n = +document.getElementById('n').value; quiz(id, 'exam', shuffle(pool).slice(0, n).map(function (r) { return prep(r, id, d.q.indexOf(r)); }), ''); };
    var fix = document.getElementById('fix'); if (fix) fix.onclick = function () { var m = load().mistakes[id] || {}; quiz(id, 'practice', Object.keys(m).map(function (k) { return m[k]; }), 'Fix my mistakes'); };
    window.scrollTo(0, 0);
  }

  // ── quiz
  var timer = null;
  function quiz(id, mode, qs, label) {
    clearInterval(timer);
    var set = shuffle(qs), i = 0, picked = {}, combo = 0, bestCombo = 0, xp = 0, flash = null, left = Math.max(1, Math.ceil(set.length * 1.2)) * 60, done = false;
    var PRAISE = ['Nice!', 'Great!', 'On fire!', 'Unstoppable!', 'Genius!'];
    function finish() {
      clearInterval(timer); done = true;
      var score = set.filter(function (q) { return picked[q.id] === q.answer; }).length, pct = set.length ? Math.round(score / set.length * 100) : 0;
      if (mode === 'exam') set.forEach(function (q) { if (picked[q.id] != null) xp += record(id, q, picked[q.id] === q.answer, 0).gain; });
      var s = load(), k = id + ':' + mode; if (pct > (s.best[k] || 0)) { s.best[k] = pct; save(s); }
      app.innerHTML = '<div class="card"><div class="big">' + pct + '%</div><p class="c"><b>' + score + ' of ' + set.length + '</b> correct · ' + (pct >= 80 ? '🏆 Outstanding!' : pct >= 50 ? '👏 Well done — keep going!' : '💪 Every mistake is saved to your review list.') + '</p><p class="c">' + (xp ? '<span class="pill good">+' + xp + ' XP</span> ' : '') + (bestCombo > 1 ? '<span class="pill warn">🔥 best combo ' + bestCombo + '</span>' : '') + '</p>' +
        '<div class="row mt" style="justify-content:center"><button class="btn" id="again">Try again</button><button class="btn alt" id="exit">Back</button></div><h3 class="mt">Review</h3>' +
        set.map(function (q, n) { var c = picked[q.id]; return '<details ' + (c !== q.answer && n < 40 ? 'open' : '') + '><summary>' + (n + 1) + '. ' + (c === q.answer ? '✅' : c == null ? '⏭️' : '❌') + ' ' + esc(q.text) + '</summary>' + explain(q, c) + '</details>'; }).join('') + '</div>';
      document.getElementById('again').onclick = function () { quiz(id, mode, qs.map(function (q) { return mode === 'exam' || label === 'Fix my mistakes' ? q : q; }), label); };
      document.getElementById('exit').onclick = function () { deptPage(id, ''); };
      window.scrollTo(0, 0);
    }
    function choose(k) {
      var q = set[i]; if (done || !q || (mode === 'practice' && picked[q.id] != null)) return;
      picked[q.id] = k;
      if (mode === 'practice') { var ok = k === q.answer; combo = ok ? combo + 1 : 0; bestCombo = Math.max(bestCombo, combo); var r = record(id, q, ok, combo - (ok ? 1 : 0)); xp += r.gain; flash = { ok: ok, gain: r.gain, text: ok ? (combo >= 3 ? PRAISE[Math.min(combo - 3, 4)] + ' ' + combo + ' in a row' : PRAISE[0]) : 'Learn from it' }; }
      draw();
    }
    function next() { if (i + 1 < set.length) { i++; flash = null; draw(); } else finish(); }
    function draw() {
      if (done) return;
      var q = set[i], c = picked[q.id], reveal = mode === 'practice' && c != null, today = load().today;
      var mm = String(Math.floor(left / 60)).padStart(2, '0'), ss = String(left % 60).padStart(2, '0');
      app.innerHTML = '<div class="card"><div class="row sp"><span class="pill">' + (mode === 'exam' ? 'Exam' : esc(label)) + ' · ' + (i + 1) + '/' + set.length + '</span><span class="row" style="gap:6px">' +
        (mode === 'practice' && combo >= 2 ? '<span class="pill warn">🔥 ' + combo + '</span>' : '') + (mode === 'practice' ? '<span class="pill good">⭐ ' + xp + '</span>' : '<span class="pill ' + (left < 60 ? 'bad' : '') + '" id="clock">⏱ ' + mm + ':' + ss + '</span>') + '</span></div>' +
        '<div class="bar mt"><i style="width:' + (i / set.length * 100) + '%"></i></div>' + (mode === 'practice' ? '<p class="hint" style="margin:.4em 0 0">Daily goal: ' + Math.min(today, GOAL) + '/' + GOAL + (today >= GOAL ? ' 🎯 reached!' : '') + '</p>' : '') +
        (q.topic ? '<p class="hint" style="margin:.4em 0 0">' + esc(q.topic) + '</p>' : '') + '<h3 class="q mt">' + esc(q.text) + '</h3>' +
        q.options.map(function (o, k) { return '<button class="opt ' + (reveal ? (k === q.answer ? 'right' : k === c ? 'wrong' : '') : c === k ? 'sel' : '') + '" ' + (reveal ? 'disabled' : '') + ' data-k="' + k + '"><b class="ltr">' + L[k] + '</b><span>' + esc(o) + '</span></button>'; }).join('') +
        (reveal && flash ? '<div class="flash ' + (flash.ok ? 'ok' : 'err') + '">' + esc(flash.text) + ' · +' + flash.gain + ' XP</div>' : '') + (reveal ? explain(q, c) : '') +
        '<div class="row sp mt"><button class="btn alt" id="quit">Quit</button><span class="row">' + (mode === 'exam' && i > 0 ? '<button class="btn alt" id="prev">Back</button>' : '') + '<button class="btn ' + (i + 1 >= set.length ? 'gold' : '') + '" id="next" ' + (mode === 'practice' && c == null ? 'disabled' : '') + '>' + (i + 1 < set.length ? 'Next →' : 'Finish') + '</button></span></div><p class="hint" style="margin:.6em 0 0">Tip: press A–D to answer, Enter for next.</p></div>';
      [].forEach.call(app.querySelectorAll('[data-k]'), function (b) { b.onclick = function () { choose(+b.getAttribute('data-k')); }; });
      document.getElementById('next').onclick = next; document.getElementById('quit').onclick = function () { clearInterval(timer); document.onkeydown = null; deptPage(id, ''); };
      var pv = document.getElementById('prev'); if (pv) pv.onclick = function () { i--; draw(); };
    }
    document.onkeydown = function (e) {
      if (done || /INPUT|SELECT|TEXTAREA/.test((e.target || {}).tagName || '')) return;
      var q = set[i], k = 'abcd'.indexOf(e.key.toLowerCase()), n = ['1', '2', '3', '4'].indexOf(e.key), c = q && picked[q.id];
      if (q && k >= 0 && k < q.options.length) choose(k); else if (q && n >= 0 && n < q.options.length) choose(n);
      else if ((e.key === 'Enter' || e.key === 'ArrowRight') && (mode === 'exam' || c != null)) next();
    };
    if (mode === 'exam') timer = setInterval(function () { left--; if (left <= 0) { finish(); return; } var el = document.getElementById('clock'); if (el) { el.textContent = '⏱ ' + String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0'); if (left < 60) el.className = 'pill bad'; } }, 1000);
    if (!set.length) { app.innerHTML = '<div class="card"><p>No questions here.</p><button class="btn" id="exit">Back</button></div>'; document.getElementById('exit').onclick = function () { deptPage(id, ''); }; return; }
    draw();
  }
  document.getElementById('home').onclick = function () { clearInterval(timer); document.onkeydown = null; home(); };
  home();
})();
</script>
</body>
