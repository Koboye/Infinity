/* ── exam.pro brand tokens (phase 1: splash; reused by every screen that follows) ── */
:root{--ep-navy-950:#050B2E;--ep-navy-900:#08124A;--ep-navy-800:#0E1E7A;--ep-blue:#2F6BFF;--ep-violet:#6D4CF0;--ep-gold:#F5B82E;--ep-gold-soft:#FFE29A;--ep-green:#1DB66A;--ep-paper:#FFFFFF;--ep-r-lg:20px;--ep-r-xl:28px}
body.sp-lock{overflow:hidden}

padding:max(20px,env(safe-area-inset-top)) 24px max(20px,env(safe-area-inset-bottom));
background:radial-gradient(70% 45% at 50% 22%,rgba(109,76,240,.38),transparent 70%),radial-gradient(60% 40% at 85% 70%,rgba(47,107,255,.28),transparent 70%),linear-gradient(180deg,var(--ep-navy-950),var(--ep-navy-900) 55%,var(--ep-navy-800));transition:opacity .4s,transform .4s}

.sp-aurora i:nth-child(2){width:55%;height:38%;right:0;top:34%;background:radial-gradient(closest-side,rgba(47,107,255,.45),transparent);animation:spDrift2 17s ease-in-out infinite alternate}
.sp-aurora i:nth-child(3){width:40%;height:28%;left:30%;bottom:12%;background:radial-gradient(closest-side,rgba(245,184,46,.22),transparent);animation:spDrift1 20s ease-in-out infinite alternate-reverse}
.sp-stars{position:absolute;inset:0;opacity:.55;background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(1.5px 1.5px at 78% 12%,#fff,transparent),radial-gradient(1px 1px at 30% 40%,#fff,transparent),radial-gradient(1.5px 1.5px at 90% 36%,#FFE29A,transparent),radial-gradient(1px 1px at 8% 62%,#fff,transparent),radial-gradient(1px 1px at 66% 28%,#fff,transparent);animation:spTwinkle 4.5s ease-in-out infinite alternate}

.sp-main{position:relative;z-index:2;width:100%;max-width:26rem;display:flex;flex-direction:column;align-items:center;margin-bottom:clamp(110px,24vh,190px)}
.sp-emwrap{position:relative;display:grid;place-items:center;animation:spIn .8s cubic-bezier(.2,.8,.2,1) both}
.sp-emwrap::before{content:"";position:absolute;width:150%;aspect-ratio:1;border-radius:50%;background:radial-gradient(closest-side,rgba(245,184,46,.30),rgba(245,184,46,0) 70%);animation:spHalo 3.6s ease-in-out infinite}
.sp-emblem{position:relative;width:clamp(8.5rem,38vw,12rem);height:auto;filter:drop-shadow(0 8px 22px rgba(245,184,46,.32));animation:spFloat 5s ease-in-out 1s infinite}
.sp-word{margin:.1em 0 0;font:850 clamp(3.1rem,17vw,4.6rem)/1 var(--sans);letter-spacing:-.045em;animation:spUp .6s .2s both}

.sp-chips span{display:inline-flex;align-items:center;gap:.35rem;padding:.38rem .8rem;border-radius:999px;font-size:.82rem;font-weight:700;color:#E6ECFF;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sp-chips .hot{color:#2b1800;background:linear-gradient(180deg,var(--ep-gold-soft),var(--ep-gold));border-color:transparent}
.sp-go{position:relative;overflow:hidden;margin-top:1.5rem;min-height:3.6rem;padding:.9rem 2.4rem;border:0;border-radius:999px;font:inherit;font-size:1.15rem;font-weight:800;color:#2b1800;cursor:pointer;
background:linear-gradient(180deg,var(--ep-gold-soft),var(--ep-gold));box-shadow:0 4px 0 #A8700B,0 12px 28px rgba(245,184,46,.34);transition:transform .12s,box-shadow .12s;animation:spUp .6s 1.2s both,spPulse 2.6s 2.2s ease-in-out infinite}
.sp-go::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg);animation:spSweep 3.4s 2.4s ease-in-out infinite}
.sp-go:active{transform:translateY(3px);box-shadow:0 1px 0 #A8700B,0 6px 14px rgba(245,184,46,.25)}
.sp-go:focus-visible{outline:2px solid var(--ep-gold-soft);outline-offset:4px}
.sp-art{position:absolute;left:0;right:0;bottom:0;height:clamp(150px,30vh,230px);z-index:1;pointer-events:none}
.sp-africa{position:absolute;left:0;right:0;margin:0 auto;bottom:clamp(54px,9vh,80px);width:clamp(6.5rem,30vw,9.5rem);height:auto;filter:drop-shadow(0 0 26px rgba(245,184,46,.35));animation:spIn .9s .3s both}
.sp-ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s 1.2s infinite ease-out}
.sp-sky{position:absolute;left:0;bottom:0;width:100%;height:clamp(70px,13vh,110px);display:block}
@keyframes spIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes spUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.4);opacity:0}}
@keyframes spFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes spHalo{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.08)}}
@keyframes spShine{0%,55%{background-position:100% 0}100%{background-position:-60% 0}}
@keyframes spSweep{0%,60%{left:-60%}100%{left:130%}}
@keyframes spPulse{0%,100%{box-shadow:0 4px 0 #A8700B,0 12px 28px rgba(245,184,46,.34)}50%{box-shadow:0 4px 0 #A8700B,0 14px 40px rgba(245,184,46,.62)}}
@keyframes spTwinkle{from{opacity:.25}to{opacity:.85}}
@keyframes spDrift1{from{transform:translate(0,0) scale(1)}to{transform:translate(12%,8%) scale(1.15)}}

@media(max-height:640px){.sp-main{margin-bottom:96px}.sp-mission{margin-top:.8rem;font-size:1.25rem}.sp-chips{margin-top:.8rem}.sp-go{margin-top:1rem}.sp-africa{display:none}}
@media(min-width:700px){.sp-main{max-width:30rem}}

.ep-grade-kicker{font-size:11px;font-weight:900;letter-spacing:.14em;color:#ffd16b}
.ep-grade-dialog h2{color:#fff;font-size:29px;margin:9px 0}
.ep-grade-dialog p{font-size:14px;line-height:1.5;color:#c8d8ff;margin:0 0 22px}
.ep-grade-close{position:absolute;right:17px;top:15px;background:#ffffff19;color:#fff;border:1px solid #ffffff44;width:37px;height:37px;border-radius:10px;font-size:25px;cursor:pointer}
.ep-grade-choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.ep-grade-choices button{background:linear-gradient(125deg,#284fa6,#423db0);color:#fff;border:1px solid #7898ed;border-radius:13px;min-height:65px;font-size:17px;font-weight:800;cursor:pointer}
.ep-grade-choices button:hover{background:#4269ca}
.ep-grade-choices button:focus-visible,.ep-grade-close:focus-visible{outline:3px solid #ffcf61;outline-offset:3px}
</style>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script src="unified.js"></script>
<script src="break-games.js"></script>
<script src="navigation.js"></script>
</body>
</html>
