/* Accessibility + organisation layer */
:root{--focus:#0a2a8a;--l1:#13804a;--l2:#1565c0;--l3:#6a2fc4;--l4:#b45a00;--l5:#0a7f7a;--l6:#3a3fc4}

.top :focus-visible{outline-color:var(--gold2)}
#app:focus,.explain:focus,.q:focus,.big:focus,h1:focus{outline:none}
.btn{background:linear-gradient(180deg,#2a5bf0,#1747d6)}
.tsz{display:flex;gap:6px;flex:none}.tsz button{min-width:44px;min-height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;font:inherit;font-weight:800;cursor:pointer}.tsz button[disabled]{opacity:.4;cursor:default}

<script>
(function () {
  'use strict';
  var BANK = window.BANK || [], L = 'ABCD', GOAL = 20, KEY = 'examprep.static.v1', app = document.getElementById('app');

  var live = document.getElementById('live'), SC = [0.9, 1, 1.12, 1.25, 1.4], ZK = 'exampro.textsize', zi = 1;

  document.getElementById('tsd').onclick = function () { zoom(-1, true); }; document.getElementById('tsu').onclick = function () { zoom(1, true); }; zoom(0);

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function ymd(d) { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

  function prep(raw, dept, i) {

    if (!q.options.some(function (o) { return POS.test(o); })) { var key = q.options[q.answer]; q.options = shuffle(q.options); q.answer = q.options.indexOf(key); }
    return q;
  }
  function record(dept, q, ok, combo) {

    s.last = t; s.today++; s.answered++;
    var gain = ok ? 10 + Math.min(combo, 5) * 2 : 2; s.xp += gain; if (ok) s.correct++;
    var m = s.mistakes[dept] = s.mistakes[dept] || {};
    if (ok) delete m[q.id]; else if (Object.keys(m).length < 200) m[q.id] = { id: q.id, text: q.text, options: q.options, answer: q.answer, explanation: q.explanation, topic: q.topic };
    save(s); return { s: s, gain: gain };

  function norm(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9\u1200-\u137f\s]/g, ' ').replace(/\s+/g, ' ').trim(); }

  function explain(q, chosen) {

    var more = rest.filter(function (x) { return x !== why; });

    ngat: '<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="12" y="9" width="40" height="49" rx="6" fill="#fff"/><rect x="23" y="4" width="18" height="11" rx="4" fill="#D6336C"/><path d="M19 28l3.2 3.2L28 25M19 40l3.2 3.2L28 37" stroke="#1DB66A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M34 28h12M34 40h12" stroke="#D6336C" stroke-width="3.2" stroke-linecap="round"/></svg>',
    gk: '<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="24" fill="#1E88E5"/><path d="M19 20c7-5 14 0 11 7s-9 4-11 11-9-4-6-10z" fill="#43A047"/><path d="M38 33c7-3 12 4 7 11s-9 1-9-5z" fill="#43A047"/><ellipse cx="32" cy="32" rx="10" ry="24" fill="none" stroke="#fff" stroke-width="1.6" opacity=".5"/><path d="M8 32h48" stroke="#fff" stroke-width="1.6" opacity=".5"/></svg>'
  };
  var CATS = [
    { id: 'kg', icon: 'kg', name: 'Kindergarten', short: 'KG', sub: 'Early learning', groups: [], c: ['#9ADBFF', '#6CC1F5'] },
    { id: 'pri', icon: 'pri', name: 'Grades 1–8', short: 'Primary school', sub: 'Primary school', groups: ['g1_4', 'g5_8'], c: ['#B5EBA8', '#7FD98F'] },
    { id: 'sec', icon: 'sec', name: 'Grades 9–12', short: 'Secondary school', sub: 'Secondary school', groups: ['g9_10', 'g12'], c: ['#DCC2FF', '#B792FF'] },

    { id: 'gk', icon: 'gk', name: 'General Knowledge', short: 'GK', sub: 'Everyday knowledge', groups: ['gk'], c: ['#8DE8D8', '#52CFC4'] }

  function catCount(c) { return BANK.reduce(function (n, d) { return c.groups.indexOf(d.group) >= 0 ? n + d.q.length : n; }, 0); }
  function catById(id) { return CATS.filter(function (c) { return c.id === id; })[0]; }
  var tt = 0;
  function toast(t) { var e = document.getElementById('toast'); e.textContent = t; e.classList.add('on'); say(t); clearTimeout(tt); tt = setTimeout(function () { e.classList.remove('on'); }, 3200); }
  function setNav(which) { document.getElementById('nv-home').setAttribute('aria-current', which === 'home' ? 'page' : 'false'); document.getElementById('nv-sub').setAttribute('aria-current', which === 'sub' ? 'page' : 'false'); document.getElementById('nv-games').setAttribute('aria-current', which === 'games' ? 'page' : 'false'); document.getElementById('nv-profile').setAttribute('aria-current', which === 'profile' ? 'page' : 'false'); }
  function chrome(mode) { var b = document.body.classList; b.toggle('dash-on', mode === 'dash'); b.toggle('has-nav', mode === 'dash' || mode === 'list'); }
  function dash(soft) {
    chrome('dash'); setNav('home'); ui.cat = null;
    var p = load(), acc = p.answered ? Math.round(p.correct / p.answered * 100) : 0, pct = Math.min(100, Math.round(p.today / GOAL * 100));

      '<label class="lbl" for="search">Find your subject or department</label><input id="search" type="search" autocomplete="off" placeholder="For example: Mathematics" value="' + esc(ui.search) + '"><div class="found row sp"><span>Showing ' + list.length + ' subject' + (list.length === 1 ? '' : 's') + (ui.group === 'all' ? '' : ' in ' + (STAGES.filter(function (g) { return g.id === ui.group; })[0] || {}).name) + '</span>' + (ui.group !== 'all' || k ? '<button class="btn alt sm" data-g="all">Show all</button>' : '') + '</div>';
    colleges.forEach(function (c, ci) {

        ds.map(function (d) { return '<button class="dept" data-d="' + esc(d.id) + '"><b>' + esc(d.name) + '</b><small>' + d.q.length + ' questions</small></button>'; }).join('') + '</div></details>';

    var s = document.getElementById('search'); if (s) s.oninput = function () { ui.search = s.value; var pos = s.selectionStart; home(true); var n = document.getElementById('search'); n.focus(); n.setSelectionRange(pos, pos); };
    [].forEach.call(app.querySelectorAll('[data-g]'), function (b) { b.onclick = function () { var g = b.getAttribute('data-g'); ui.group = g; if (g === 'all') ui.search = ''; home(true); var nb = app.querySelector('.stage[data-g="' + g + '"]') || app.querySelector('#search'); if (nb) nb.focus({ preventScroll: true }); say(g === 'all' ? 'Showing all subjects' : 'Showing ' + (STAGES.filter(function (x) { return x.id === g; })[0] || {}).name); }; });

  // ── department
  function deptPage(id, topic) {

    var d = dept(id), p = load(), mist = Object.keys(p.mistakes[id] || {}).length;
    var topics = []; d.q.forEach(function (r) { if (r[4] && topics.indexOf(r[4]) < 0) topics.push(r[4]); }); topics.sort();
    var pool = d.q.filter(function (r) { return !topic || r[4] === topic; }), max = pool.length;
    var sizes = [5, 10, 20, 30, 50, 100, max].filter(function (x, i, a) { return x <= max && a.indexOf(x) === i; }).sort(function (a, b) { return a - b; });

      '<div class="card"><h2>Practice ' + (b1 ? '<span class="pill good">best ' + b1 + '%</span>' : '') + '</h2><p class="hint">See the answer and a smart explanation after every question.</p><button class="btn" id="prac">Start practice (' + max + ')</button></div>' +
      '<div class="card"><h2>' + (d.group === 'uni' || d.group === 'ngat' ? 'Exit exam simulation' : 'Mock exam') + ' ' + (b2 ? '<span class="pill good">best ' + b2 + '%</span>' : '') + '</h2><p class="hint">Timed, answers shown only at the end.</p><label for="n" class="hint">Number of questions</label><select id="n">' + sizes.map(function (x) { return '<option>' + x + '</option>'; }).join('') + '</select><button class="btn gold mt" id="exam">Start timed exam</button></div>';
    document.getElementById('back').onclick = function (e) { e.preventDefault(); home(); };

    document.getElementById('prac').onclick = function () { quiz(id, 'practice', pool.map(function (r, i) { return prep(r, id, d.q.indexOf(r)); }), topic || 'Practice'); };
    document.getElementById('exam').onclick = function () { var n = +document.getElementById('n').value; quiz(id, 'exam', shuffle(pool).slice(0, n).map(function (r) { return prep(r, id, d.q.indexOf(r)); }), ''); };
    var fix = document.getElementById('fix'); if (fix) fix.onclick = function () { var m = load().mistakes[id] || {}; quiz(id, 'practice', Object.keys(m).map(function (k) { return m[k]; }), 'Fix my mistakes'); };

  // ── quiz
  var timer = null;
  function quiz(id, mode, qs, label) {
    window.infinityExamActive = true;
    chrome(null);
    clearInterval(timer);
    var set = shuffle(qs), i = 0, picked = {}, combo = 0, bestCombo = 0, xp = 0, flash = null, left = Math.max(1, Math.ceil(set.length * 1.2)) * 60, done = false;
    var lastQ = null, PRAISE = ['Nice!', 'Great!', 'On fire!', 'Unstoppable!', 'Genius!'];
    function finish() {
      clearInterval(timer); done = true; window.infinityExamActive = false;
      var score = set.filter(function (q) { return picked[q.id] === q.answer; }).length, pct = set.length ? Math.round(score / set.length * 100) : 0;
      if (mode === 'exam') set.forEach(function (q) { if (picked[q.id] != null) xp += record(id, q, picked[q.id] === q.answer, 0).gain; });
      var s = load(), k = id + ':' + mode; if (pct > (s.best[k] || 0)) { s.best[k] = pct; save(s); }

        '<div class="row mt" style="justify-content:center"><button class="btn" id="again">Try again</button><button class="btn alt" id="exit">Back</button></div><h3 class="mt">Review</h3>' +
        set.map(function (q, n) { var c = picked[q.id]; return '<details ' + (c !== q.answer && n < 40 ? 'open' : '') + '><summary>' + (n + 1) + '. ' + (c === q.answer ? '✅' : c == null ? '⏭️' : '❌') + ' ' + esc(q.text) + '</summary>' + explain(q, c) + '</details>'; }).join('') + '</div>';
      document.getElementById('again').onclick = function () { quiz(id, mode, qs.map(function (q) { return mode === 'exam' || label === 'Fix my mistakes' ? q : q; }), label); };
      document.getElementById('exit').onclick = function () { deptPage(id, ''); };
      landed('Results', '.big'); say(pct + ' percent. ' + score + ' of ' + set.length + ' correct.');
    }
    function choose(k) {
      var q = set[i]; if (done || !q || (mode === 'practice' && picked[q.id] != null)) return;
      picked[q.id] = k;
      if (mode === 'practice') { var ok = k === q.answer; combo = ok ? combo + 1 : 0; bestCombo = Math.max(bestCombo, combo); var r = record(id, q, ok, combo - (ok ? 1 : 0)); xp += r.gain; flash = { ok: ok, gain: r.gain, text: ok ? (combo >= 3 ? PRAISE[Math.min(combo - 3, 4)] + ' ' + combo + ' in a row' : PRAISE[0]) : 'Learn from it' }; }
      draw();
    }
    function next() { if (i + 1 < set.length) { i++; flash = null; draw(); } else finish(); }
    function draw() {
      if (done) return;
      var q = set[i], c = picked[q.id], reveal = mode === 'practice' && c != null, today = load().today;
      var mm = String(Math.floor(left / 60)).padStart(2, '0'), ss = String(left % 60).padStart(2, '0');
      app.innerHTML = '<div class="card"><div class="row sp"><span class="pill">' + (mode === 'exam' ? 'Exam' : esc(label)) + ' · ' + (i + 1) + '/' + set.length + '</span><span class="row" style="gap:6px">' +
        (mode === 'practice' && combo >= 2 ? '<span class="pill warn">🔥 ' + combo + '</span>' : '') + (mode === 'practice' ? '<span class="pill good">⭐ ' + xp + '</span>' : '<span class="pill ' + (left < 60 ? 'bad' : '') + '" id="clock">⏱ ' + mm + ':' + ss + '</span>') + '</span></div>' +
        '<div class="bar mt" role="progressbar" aria-label="Question progress" aria-valuemin="1" aria-valuemax="' + set.length + '" aria-valuenow="' + (i + 1) + '"><i style="width:' + (i / set.length * 100) + '%"></i></div>' + (mode === 'practice' ? '<p class="hint" style="margin:.4em 0 0">Daily goal: ' + Math.min(today, GOAL) + '/' + GOAL + (today >= GOAL ? ' 🎯 reached!' : '') + '</p>' : '') +
        (q.topic ? '<p class="hint" style="margin:.4em 0 0">' + esc(q.topic) + '</p>' : '') + '<h3 class="q mt" id="qt">' + esc(q.text) + '</h3><div role="group" aria-labelledby="qt">' +
        q.options.map(function (o, k) { return '<button class="opt ' + (reveal ? (k === q.answer ? 'right' : k === c ? 'wrong' : '') : c === k ? 'sel' : '') + '" ' + (reveal ? 'disabled' : '') + ' aria-pressed="' + (c === k) + '" data-k="' + k + '"><b class="ltr" aria-hidden="true">' + L[k] + '</b><span>' + esc(o) + '</span>' + (reveal ? '<span class="sr">' + (k === q.answer ? ' (correct answer)' : k === c ? ' (your answer, incorrect)' : '') + '</span>' : '') + '</button>'; }).join('') + '</div>' +
        (reveal && flash ? '<div class="flash ' + (flash.ok ? 'ok' : 'err') + '">' + esc(flash.text) + ' · +' + flash.gain + ' XP</div>' : '') + (reveal ? explain(q, c) : '') +
        '<div class="row sp mt"><button class="btn alt" id="quit">Quit</button><span class="row">' + (mode === 'exam' ? '<button class="btn alt" id="game-break" type="button">🎮 Play Game</button>' : '') + (mode === 'exam' && i > 0 ? '<button class="btn alt" id="prev">Back</button>' : '') + '<button class="btn ' + (i + 1 >= set.length ? 'gold' : '') + '" id="next" ' + (mode === 'practice' && c == null ? 'disabled' : '') + '>' + (i + 1 < set.length ? 'Next →' : 'Finish') + '</button></span></div><p class="hint" style="margin:.6em 0 0">Tip: press A–D to answer, Enter for next.</p></div>';
      [].forEach.call(app.querySelectorAll('[data-k]'), function (b) { b.onclick = function () { choose(+b.getAttribute('data-k')); }; });
      document.getElementById('next').onclick = next; var gb = document.getElementById('game-break'); if (gb) gb.onclick = window.examproOpenGameBreak; document.getElementById('quit').onclick = function () { window.infinityExamActive = false; clearInterval(timer); document.onkeydown = null; deptPage(id, ''); };
      var pv = document.getElementById('prev'); if (pv) pv.onclick = function () { i--; draw(); };
      if (reveal) { var ex = app.querySelector('.explain'); if (ex) { ex.setAttribute('tabindex', '-1'); ex.setAttribute('role', 'region'); ex.setAttribute('aria-label', 'Explanation'); ex.focus(); } say(c === q.answer ? 'Correct.' : 'Not quite. The correct answer is ' + L[q.answer] + '.'); }
      else if (c != null) { var ob = app.querySelector('[data-k="' + c + '"]'); if (ob) ob.focus({ preventScroll: true }); }
      else if (lastQ !== q.id) { var qh = app.querySelector('.q'); qh.setAttribute('tabindex', '-1'); qh.focus({ preventScroll: true }); window.scrollTo(0, 0); }

    document.onkeydown = function (e) {

      var q = set[i], k = 'abcd'.indexOf(e.key.toLowerCase()), n = ['1', '2', '3', '4'].indexOf(e.key), c = q && picked[q.id];
      if (q && k >= 0 && k < q.options.length) choose(k); else if (q && n >= 0 && n < q.options.length) choose(n);

    if (mode === 'exam') timer = setInterval(function () { if (window.examproGameBreakOpen) return; left--; if (left <= 0) { finish(); return; } if (left === 300 || left === 60 || left === 10) say(left === 300 ? '5 minutes left' : left === 60 ? '1 minute left' : '10 seconds left'); var el = document.getElementById('clock'); if (el) { el.textContent = '⏱ ' + String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0'); if (left < 60) el.className = 'pill bad'; } }, 1000);
    if (!set.length) { app.innerHTML = '<div class="card"><p>No questions here.</p><button class="btn" id="exit">Back</button></div>'; document.getElementById('exit').onclick = function () { deptPage(id, ''); }; return; }
    draw();
  }
  document.getElementById('home').onclick = function () { clearInterval(timer); document.onkeydown = null; dash(); };
  // Once a student chooses a level on the sign-in screen, open that learning area.
  function openStudentResources() {
    if (window.infinityExamActive) return;
    var category = window.infinityGradeCategory && window.infinityGradeCategory();
    if (!category || !catById(category)) return;

    if (event.detail && event.detail.grade && !window.infinityExamActive) dash();
  });
  window.addEventListener('infinity-auth-changed', function(event){
    if(event.detail && event.detail.uid && !window.infinityExamActive) dash();
  });
  window.infinityNavigateHome = function(){if (!window.infinityExamActive) dash();};
  window.infinityNavigateResources = openStudentResources;
  window.infinityReadProgress = function(){return load();};
  window.infinityExamActive = false;
  window.infinityCanNavigate = function(){return !window.infinityExamActive;};
