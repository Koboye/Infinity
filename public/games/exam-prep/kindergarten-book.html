<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174d83"><title>My Kindergarten Book · ExamPro</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#18274a;background:#f5f8ff}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#153d85,#6852c9);color:white;padding:20px max(18px,calc((100vw - 1000px)/2))}header a{color:white}h1{margin:12px 0 6px;font-size:clamp(27px,5vw,42px)}header p{margin:0 0 14px;opacity:.92}main{max-width:1000px;margin:auto;padding:22px 16px 60px}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px}.toc{align-self:start;position:sticky;top:12px;background:white;border:1px solid #dce5f7;border-radius:18px;padding:12px}.toc button{display:block;width:100%;border:0;border-radius:11px;background:transparent;text-align:left;padding:12px 10px;font-size:14px;font-weight:700;color:#263763;cursor:pointer}.toc button[aria-current=page]{background:#e5edff;color:#2149ae}.book{background:white;border:1px solid #dce5f7;border-radius:22px;padding:clamp(20px,4vw,42px);min-height:550px;box-shadow:0 12px 38px #203d7a12}.eyebrow{font-weight:800;letter-spacing:.1em;color:#6852c9;text-transform:uppercase;font-size:12px}.book h2{font-size:clamp(27px,4vw,42px);margin:12px 0}.lead{font-size:19px;line-height:1.6;color:#4c5873}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:25px 0}.tile{background:#f0f5ff;border-radius:18px;padding:20px;min-height:150px}.emoji{font-size:38px;display:block;margin-bottom:9px}.tile strong{display:block;font-size:21px}.tile p{line-height:1.5;margin:8px 0 0}.activity{background:#fff3d7;border-left:5px solid #f2b22d;padding:18px;border-radius:14px;line-height:1.6}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}.actions button,.actions a{background:#294fc4;border:0;border-radius:12px;padding:13px 20px;color:white;font-weight:800;text-decoration:none;cursor:pointer}.actions button:disabled{opacity:.4;cursor:default}.actions .light{background:#e8edff;color:#28449d}.progress{font-size:13px;color:#cbd6ff}button:focus-visible,a:focus-visible{outline:3px solid #e5b43d;outline-offset:3px}@media(max-width:700px){.layout{grid-template-columns:1fr}.toc{position:static;display:flex;overflow-x:auto;gap:5px}.toc button{min-width:155px}.tiles{grid-template-columns:1fr}.book{min-height:0}}
</style></head><body><header><a href="index.html">← Back to ExamPro</a><h1>📚 My Kindergarten Book</h1><p>Seven colorful beginner lessons · Learn, talk, draw, and play</p><div class="progress" id="progress" aria-live="polite"></div></header><main><div class="layout"><nav class="toc" id="toc" aria-label="Book chapters"></nav><article class="book" id="page" aria-live="polite"></article></div></main><script>
(function(){'use strict';var chapters=[["🌈","Welcome to Kindergarten","We learn by looking, listening, speaking, moving, and playing.",[["👋","Hello!","Say: Hello, my name is ____."],["😊","Feelings","Happy, sad, excited, and calm are feelings. Tell someone how you feel."],["🤝","Kind hands","We share, take turns, and help friends."]],"Say hello to someone and tell them your favorite color."],["🔤","Letters and Sounds","Look at the letter. Say its sound. Find something that begins with it.",[["🍎","A a","A is for apple."],["⚽","B b","B is for ball."],["🐈","C c","C is for cat."],["🐕","D d","D is for dog."],["🥚","E e","E is for egg."],["🐟","F f","F is for fish."]],"Draw one object that begins with A, B, or C."],["🔢","Numbers 1–10","Count slowly. Point to one object for each number.",[["☝️","1 2 3","One, two, three."],["✋","4 5","Four, five."],["🖐️","6 7 8","Six, seven, eight."],["🔟","9 10","Nine, ten."]],"Collect five safe objects. Count them out loud."],["🔺","Shapes and Colors","Look for shapes and colors in your home or classroom.",[["🔴","Circle","A circle is round."],["🟨","Square","A square has four equal sides."],["🔺","Triangle","A triangle has three sides."],["🟦","Blue · Red · Yellow","Name the colors you can see."]],"Find a circle, a square, and a triangle."],["🐾","Animals and Nature","Living things need care.",[["🐄","Cow","A cow is a farm animal."],["🐦","Bird","A bird has feathers."],["🌳","Tree","A tree has roots, a trunk, and leaves."],["☀️","Sun","Sunlight helps plants grow."]],"Name an animal and describe how it moves."],["🧼","Healthy Habits","Small healthy habits help us every day.",[["🫧","Wash hands","Use soap and clean water."],["🪥","Brush teeth","Brush gently with help from a grown-up."],["🥕","Eat well","Enjoy different healthy foods."],["😴","Rest","Sleep helps our bodies grow."]],"Practice washing your hands with a grown-up."],["🇪🇹","My Community","Our homes, schools, and neighborhoods have people who help.",[["🏠","Home","We care for our home."],["🏫","School","We learn and play together."],["👩‍🏫","Teacher","A teacher helps us learn."],["🌍","Ethiopia","Ethiopia is our country."]],"Thank someone who helps you today."]];var key='exampro.kg.book.v1',idx=0;try{idx=Math.max(0,Math.min(chapters.length-1,Number(localStorage.getItem(key))||0));}catch(e){}function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}function show(n){idx=Math.max(0,Math.min(chapters.length-1,n));try{localStorage.setItem(key,String(idx));}catch(e){}var c=chapters[idx];document.getElementById('progress').textContent='Chapter '+(idx+1)+' of '+chapters.length;document.getElementById('toc').innerHTML=chapters.map(function(x,i){return '<button type="button" data-ch="'+i+'" aria-current="'+(i===idx?'page':'false')+'">'+x[0]+' '+esc(x[1])+'</button>';}).join('');document.getElementById('page').innerHTML='<span class="eyebrow">Chapter '+(idx+1)+'</span><h2>'+c[0]+' '+esc(c[1])+'</h2><p class="lead">'+esc(c[2])+'</p><div class="tiles">'+c[3].map(function(t){return '<section class="tile"><span class="emoji" aria-hidden="true">'+t[0]+'</span><strong>'+esc(t[1])+'</strong><p>'+esc(t[2])+'</p></section>';}).join('')+'</div><section class="activity"><strong>✏️ Try it together</strong><p>'+esc(c[4])+'</p></section><div class="actions"><button type="button" id="prev" class="light" '+(idx===0?'disabled':'')+'>← Previous</button><button type="button" id="next" '+(idx===chapters.length-1?'disabled':'')+'>Next chapter →</button><a class="light" href="index.html">Practice in ExamPro ↗</a></div>';document.querySelectorAll('[data-ch]').forEach(function(b){b.onclick=function(){show(Number(b.dataset.ch));};});document.getElementById('prev').onclick=function(){show(idx-1);};document.getElementById('next').onclick=function(){show(idx+1);};}show(idx);})();
</script></body></html>
