<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#254ea9"><title>ABC · ሀ ሁ ሂ | Kindergarten Practice</title><style>
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans Ethiopic","Nyala",system-ui,sans-serif;background:#f5f7ff;color:#172951}header{background:linear-gradient(115deg,#174a99,#6953c5);color:#fff;padding:18px max(16px,calc((100vw - 1000px)/2))}header a{color:#fff;text-decoration:none;font-weight:750}h1{margin:10px 0 5px;font-size:clamp(24px,5vw,38px)}header p{margin:0 0 8px;opacity:.92}main{max-width:1000px;margin:auto;padding:18px 16px 60px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs button{background:#fff;color:#244b9d;border:2px solid #dce5fb;border-radius:13px;padding:13px 17px;font-weight:850;cursor:pointer}.tabs button[aria-selected=true]{background:#294eb9;color:#fff;border-color:#294eb9}.panel{background:#fff;border:1px solid #dce5f5;border-radius:22px;padding:clamp(16px,3vw,28px)}h2{margin:0 0 8px}p{line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:9px;margin:18px 0}.grid button{background:#eff4ff;border:2px solid transparent;border-radius:15px;min-height:85px;color:#193d8d;cursor:pointer;font-size:32px;font-weight:800}.grid button small{display:block;font-size:12px;font-weight:650}.grid button[aria-pressed=true]{border-color:#6348c6;background:#e8e2ff}.focus{background:linear-gradient(120deg,#f3f5ff,#fff5d9);border-radius:20px;text-align:center;padding:22px;margin:15px 0}.big{font-size:clamp(70px,16vw,130px);font-weight:850;line-height:1.2}.focus p{font-size:19px;margin:8px 0}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.actions button,.action{background:#294fbc;border:0;color:white;border-radius:12px;padding:13px 18px;font-size:15px;font-weight:800;cursor:pointer}.actions .secondary{background:#e6edff;color:#244c9d}.quiz{background:#f0f5ff;padding:20px;border-radius:18px}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.choices button{background:white;border:2px solid #d8e2fa;border-radius:15px;min-height:92px;font-size:34px;font-weight:800;color:#1e418f;cursor:pointer}.feedback{font-weight:800;min-height:28px}.note{font-size:13px;color:#586989}.status{color:#e8edff;font-size:13px}button:focus-visible,a:focus-visible{outline:3px solid #f1bd34;outline-offset:3px}@media(max-width:560px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.grid button{min-height:72px;font-size:27px}.choices{gap:7px}.choices button{font-size:27px;min-height:78px}}</style></head><body><header><a href="index.html">← ExamPro</a><h1>🔤 ABC · ሀ ሁ ሂ</h1><p>English alphabet and Amharic fidel practice · የእንግሊዝኛና የአማርኛ ፊደል ልምምድ</p><div id="status" class="status" aria-live="polite"></div></header><main><div class="tabs" role="tablist" aria-label="Practice language"><button id="tab-en" role="tab" aria-selected="true">🇬🇧 ABC English</button><button id="tab-am" role="tab" aria-selected="false">🇪🇹 ሀ ሁ ሂ Amharic</button><button id="tab-quiz" role="tab" aria-selected="false">⭐ Practice Quiz</button></div><section class="panel" id="panel" aria-live="polite"></section></main><script>
(function(){'use strict';var english=[["A","a","Apple","🍎"],["B","b","Ball","⚽"],["C","c","Cat","🐈"],["D","d","Dog","🐕"],["E","e","Egg","🥚"],["F","f","Fish","🐟"],["G","g","Goat","🐐"],["H","h","Hat","🎩"],["I","i","Ice","🧊"],["J","j","Jug","🏺"],["K","k","Kite","🪁"],["L","l","Lion","🦁"],["M","m","Moon","🌙"],["N","n","Nest","🪺"],["O","o","Orange","🍊"],["P","p","Pen","🖊️"],["Q","q","Queen","👑"],["R","r","Rain","🌧️"],["S","s","Sun","☀️"],["T","t","Tree","🌳"],["U","u","Umbrella","☂️"],["V","v","Van","🚐"],["W","w","Water","💧"],["X","x","X-ray","🩻"],["Y","y","Yak","🐂"],["Z","z","Zebra","🦓"]],fidel=[["ሀ","ሁ","ሂ","ሃ","ሄ","ህ","ሆ"],["ለ","ሉ","ሊ","ላ","ሌ","ል","ሎ"],["ሐ","ሑ","ሒ","ሓ","ሔ","ሕ","ሖ"],["መ","ሙ","ሚ","ማ","ሜ","ም","ሞ"],["ሠ","ሡ","ሢ","ሣ","ሤ","ሥ","ሦ"],["ረ","ሩ","ሪ","ራ","ሬ","ር","ሮ"],["ሰ","ሱ","ሲ","ሳ","ሴ","ስ","ሶ"],["ሸ","ሹ","ሺ","ሻ","ሼ","ሽ","ሾ"],["ቀ","ቁ","ቂ","ቃ","ቄ","ቅ","ቆ"],["በ","ቡ","ቢ","ባ","ቤ","ብ","ቦ"],["ተ","ቱ","ቲ","ታ","ቴ","ት","ቶ"],["ቸ","ቹ","ቺ","ቻ","ቼ","ች","ቾ"],["ኀ","ኁ","ኂ","ኃ","ኄ","ኅ","ኆ"],["ነ","ኑ","ኒ","ና","ኔ","ን","ኖ"],["ኘ","ኙ","ኚ","ኛ","ኜ","ኝ","ኞ"],["አ","ኡ","ኢ","ኣ","ኤ","እ","ኦ"],["ከ","ኩ","ኪ","ካ","ኬ","ክ","ኮ"],["ኸ","ኹ","ኺ","ኻ","ኼ","ኽ","ኾ"],["ወ","ዉ","ዊ","ዋ","ዌ","ው","ዎ"],["ዐ","ዑ","ዒ","ዓ","ዔ","ዕ","ዖ"],["ዘ","ዙ","ዚ","ዛ","ዜ","ዝ","ዞ"],["ዠ","ዡ","ዢ","ዣ","ዤ","ዥ","ዦ"],["የ","ዩ","ዪ","ያ","ዬ","ይ","ዮ"],["ደ","ዱ","ዲ","ዳ","ዴ","ድ","ዶ"],["ጀ","ጁ","ጂ","ጃ","ጄ","ጅ","ጆ"],["ገ","ጉ","ጊ","ጋ","ጌ","ግ","ጎ"],["ጠ","ጡ","ጢ","ጣ","ጤ","ጥ","ጦ"],["ጨ","ጩ","ጪ","ጫ","ጬ","ጭ","ጮ"],["ጰ","ጱ","ጲ","ጳ","ጴ","ጵ","ጶ"],["ጸ","ጹ","ጺ","ጻ","ጼ","ጽ","ጾ"],["ፀ","ፁ","ፂ","ፃ","ፄ","ፅ","ፆ"],["ፈ","ፉ","ፊ","ፋ","ፌ","ፍ","ፎ"],["ፐ","ፑ","ፒ","ፓ","ፔ","ፕ","ፖ"]],key='exampro.kg.alphabet.v1',state={tab:'en',en:0,am:0,form:0,correct:0,attempted:0},question=null;try{var saved=JSON.parse(localStorage.getItem(key)||'{}');if(saved&&typeof saved==='object')Object.assign(state,saved);}catch(e){}function save(){try{localStorage.setItem(key,JSON.stringify(state));}catch(e){}}function esc(x){return String(x).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}function speak(s,lang){if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(s);u.lang=lang;u.rate=.75;speechSynthesis.speak(u);}catch(e){}}function setTab(t){state.tab=t;save();render();}function status(){document.getElementById('status').textContent='⭐ '+state.correct+' correct / '+state.attempted+' attempts · ውጤት በዚህ መሣሪያ ይቀመጣል';}function render(){status();['en','am','quiz'].forEach(function(t){document.getElementById('tab-'+t).setAttribute('aria-selected',String(state.tab===t));});var p=document.getElementById('panel');if(state.tab==='en'){var x=english[state.en]||english[0];p.innerHTML='<h2>English ABC · 26 letters</h2><p>Tap a letter. Say it out loud. ፊደሉን ንካና ተናገር።</p><div class="grid">'+english.map(function(v,i){return '<button type="button" data-en="'+i+'" aria-pressed="'+(i===state.en)+'">'+v[0]+'<small>'+v[1]+'</small></button>';}).join('')+'</div><div class="focus"><div class="big">'+x[0]+' '+x[1]+'</div><p>'+x[3]+' '+esc(x[0]+' is for '+x[2])+'</p><div class="actions"><button id="speak">🔊 Hear English</button><button class="secondary" id="next">Next letter →</button></div></div>';p.querySelectorAll('[data-en]').forEach(function(b){b.onclick=function(){state.en=Number(b.dataset.en);save();render();};});p.querySelector('#speak').onclick=function(){speak(x[0]+'. '+x[2],'en-US');};p.querySelector('#next').onclick=function(){state.en=(state.en+1)%english.length;save();render();};}else if(state.tab==='am'){var row=fidel[state.am]||fidel[0],letter=row[state.form]||row[0];p.innerHTML='<h2>የአማርኛ ፊደላት · 7 ቅርጾች</h2><p>ቤተሰብ ምረጥ፣ ከዚያ ፊደሉን ንካ። Select a fidel family, then a form.</p><div class="grid">'+fidel.map(function(v,i){return '<button type="button" data-am="'+i+'" aria-pressed="'+(i===state.am)+'">'+v[0]+'</button>';}).join('')+'</div><div class="focus"><div class="big">'+letter+'</div><p>'+row.join(' · ')+'</p><div class="actions"><button id="speak">🔊 ፊደል ስማ</button><button class="secondary" id="next">ቀጣይ ቤተሰብ →</button></div></div><div class="grid">'+row.map(function(v,i){return '<button type="button" data-form="'+i+'" aria-pressed="'+(i===state.form)+'">'+v+'<small>'+(i+1)+'</small></button>';}).join('')+'</div><p class="note">Audio depends on the Amharic voices installed on your device. የአማርኛ ድምፅ በመሣሪያዎ ድጋፍ ላይ ይመረኮዛል።</p>';p.querySelectorAll('[data-am]').forEach(function(b){b.onclick=function(){state.am=Number(b.dataset.am);state.form=0;save();render();};});p.querySelectorAll('[data-form]').forEach(function(b){b.onclick=function(){state.form=Number(b.dataset.form);save();render();};});p.querySelector('#speak').onclick=function(){speak(letter,'am-ET');};p.querySelector('#next').onclick=function(){state.am=(state.am+1)%fidel.length;state.form=0;save();render();};}else{if(!question)makeQuestion();p.innerHTML='<h2>⭐ Find the letter · ፊደሉን ፈልግ</h2><p>Choose the matching letter. ትክክለኛውን ፊደል ምረጥ።</p><div class="quiz"><p id="prompt" style="font-size:21px;font-weight:800">Find: '+esc(question.answer)+'</p><div class="choices">'+question.options.map(function(v,i){return '<button type="button" data-choice="'+i+'">'+esc(v)+'</button>';}).join('')+'</div><p class="feedback" id="feedback" aria-live="polite"></p><div class="actions"><button id="new" class="secondary">Next question →</button></div></div>';p.querySelectorAll('[data-choice]').forEach(function(b){b.onclick=function(){if(question.done)return;question.done=true;var chosen=question.options[Number(b.dataset.choice)];state.attempted++;var good=chosen===question.answer;if(good)state.correct++;save();status();p.querySelector('#feedback').textContent=good?'🌟 Correct! ትክክል ነው!':'Try again next time. መልሱ: '+question.answer;p.querySelectorAll('[data-choice]').forEach(function(z){z.disabled=true;z.style.borderColor=z.textContent===question.answer?'#2e9b63':'#d8e2fa';});};});p.querySelector('#new').onclick=function(){makeQuestion();render();};}}function makeQuestion(){var am=Math.random()<.5;var pool=am?fidel.map(function(x){return x[0];}):english.map(function(x){return x[0];});var index=Math.floor(Math.random()*pool.length);var options=[pool[index]];while(options.length<3){var x=pool[Math.floor(Math.random()*pool.length)];if(options.indexOf(x)<0)options.push(x);}for(var i=options.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=options[i];options[i]=options[j];options[j]=t;}question={answer:pool[index],options:options,done:false};}['en','am','quiz'].forEach(function(t){document.getElementById('tab-'+t).onclick=function(){setTab(t);};});if(['en','am','quiz'].indexOf(state.tab)<0)state.tab='en';render();})();
</script></body></html>
