<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f1b3d">
<title>Hill Climb Racer</title>
<style>
select{width:100%;margin:2px 0 8px;padding:9px;border-radius:10px;background:#232837;color:#fff;border:0;font-size:15px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0e17;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;position:fixed;inset:0}
/* ROOT-CAUSE FIX of the black screen: a canvas ignores inset:0, so it must be given an explicit CSS size */
canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;display:block}
#hud{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;display:flex;gap:14px;align-items:center;padding:10px 14px;font-size:20px;text-shadow:0 2px 4px #0008;pointer-events:none}
#hud .bar{flex:1;max-width:220px;height:14px;border:2px solid #fff;border-radius:8px;overflow:hidden;background:#0006}
#fuel{display:block;height:100%;background:linear-gradient(90deg,#ff5a36,#ffd23f);width:100%}
#pb{margin-left:auto;pointer-events:auto;font-size:20px;background:#0007;color:#fff;border:0;border-radius:10px;padding:6px 12px}
#ab{margin-left:auto;pointer-events:auto;font-size:20px;background:#0007;color:#fff;border:0;border-radius:10px;padding:6px 12px}#ab.on{background:#2b8a3e}#pb{margin-left:0}
#pad{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0);display:flex;justify-content:space-between;padding:14px}
#pad{align-items:flex-end;gap:10px;pointer-events:none}#pad button{pointer-events:auto;width:min(30vw,150px);height:min(22vh,100px);border:0;border-radius:20px;font-size:22px;font-weight:800;color:#fff;background:#0007;backdrop-filter:blur(4px)}
#pad #bBoostX{width:min(26vw,130px);height:min(16vh,76px);font-size:17px;background:linear-gradient(180deg,#2b5cff99,#6a2bff99);margin:0 auto 6px}
#pad #bBoost small{display:block;font-size:11px;opacity:.8;font-weight:600}
#pad button.on{background:#ffb703;color:#222}#pad #bBoost.on{background:linear-gradient(180deg,#5ee0ff,#6a8bff);color:#04122e}
#gear{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 52px);display:flex;flex-direction:column;align-items:flex-end;gap:5px;pointer-events:none;text-shadow:0 2px 4px #0008;font-weight:800}
#gear .rpm{width:120px;height:8px;border-radius:6px;background:#0006;border:1px solid #fff6;overflow:hidden}#gear .rpm i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4de1ff,#ffd23f,#ff3d3d)}
#gear .g{font-size:13px;opacity:.9}
#nit{display:block;height:100%;width:0;background:linear-gradient(90deg,#4de1ff,#7a5cff)}
#hud .bar.n{max-width:90px;height:10px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 56px);transform:translateX(-50%);background:#000b;padding:8px 16px;border-radius:12px;font-weight:700;font-size:15px;pointer-events:none;opacity:0;transition:opacity .25s}#toast.on{opacity:1}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000a;overflow:auto;padding:12px}
.card{width:min(440px,100%);background:#171a24;border-radius:22px;padding:20px;box-shadow:0 20px 60px #000a;text-align:center}
h1{margin:0;letter-spacing:3px;font-size:28px;background:linear-gradient(90deg,#ffd23f,#ff5a36);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:4px 0 14px;opacity:.8}
.sel{display:flex;align-items:center;justify-content:space-between;background:#232837;border-radius:14px;margin:8px 0;padding:6px}
.sel div{display:flex;flex-direction:column}.sel small{opacity:.6}
.row{display:flex;align-items:center;justify-content:space-between;background:#232837;border-radius:12px;margin:6px 0;padding:6px 10px;text-align:left}
.row span:first-child{width:100px}.pips{letter-spacing:2px;color:#ffd23f}
.card button{background:#3a4160;color:#fff;border:0;border-radius:10px;padding:9px 14px;font-size:16px;font-weight:700}
.card button:disabled{opacity:.35}
.card .go{width:100%;margin-top:12px;padding:15px;font-size:22px;background:linear-gradient(90deg,#ffb703,#ff5a36);color:#222}
.card .buy{width:100%;background:#2b8a3e}
.stat{font-size:18px;margin:6px 0}
.hide{display:none!important}
#hud .bar #fp{white-space:nowrap;font-size:9.5px;line-height:13px;letter-spacing:0;overflow:hidden;max-width:100%}
/* tilt gauge: shows the phone tilt; tap it to re-centre */
#tg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + min(22vh,100px) + 36px);display:flex;align-items:center;gap:8px;font-size:11px;font-weight:900;letter-spacing:1px;text-shadow:0 2px 3px #000a;pointer-events:auto;opacity:.92;z-index:4}
#tg .tr{position:relative;width:min(34vw,150px);height:12px;border-radius:8px;background:#0009;border:2px solid #fff8}
#tg .tr:after{content:'';position:absolute;left:50%;top:-3px;width:2px;height:14px;background:#fff9}
#tg i{position:absolute;top:-2px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#8be8ff;box-shadow:0 0 8px #8be8ff}
#tg.act i{background:#ffd23f;box-shadow:0 0 10px #ffd23f}
/* v6: HUD never overflows on phones */
#hud{flex-wrap:nowrap;gap:5px}#hud .meters{min-width:0;flex:1 1 30px}
@media (max-width:520px){#hud{padding:8px 6px;gap:4px}#hud .pill{padding:4px 8px;border-radius:12px}#hud .pill.big{font-size:20px}#hud .pill.big small{font-size:10px}#hud .pill b{font-size:inherit}#hud .coinp b{font-size:18px}#hud .pill.stage,#hud .pill.plv{padding:3px 7px}#hud button{padding:5px 8px!important;font-size:16px!important}}
@media (max-width:440px){#hud .meters{min-width:0;flex:1 1 40px}#hud .pill.plv{display:none}}
@media (max-width:380px){#hud .pill.plv,#hud .pill.stage{display:none}#hud .meters{min-width:96px}}
/* v6 air-time HUD + nitro button */
#air{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 108px);transform:translateX(-50%);text-align:center;pointer-events:none;font-weight:900;text-shadow:0 3px 8px #000a;z-index:5}
#air b{display:block;font-size:34px;letter-spacing:2px;color:#8be8ff;-webkit-text-stroke:2px #06304a;paint-order:stroke fill}
#air span{display:block;font-size:14px;opacity:.9;margin-top:-2px}
#air.big b{color:#ffd23f;font-size:44px;animation:ap .35s infinite alternate}@keyframes ap{to{transform:scale(1.08)}}
#pad #bBoost{position:relative;overflow:hidden;background:linear-gradient(180deg,#2f8cff,#5b3fd0)!important;font-size:17px}
#pad #bBoost small{display:block;font-size:12px;opacity:.9;margin-top:2px}
#pad #bBoost.on{background:linear-gradient(180deg,#8be8ff,#2f8cff)!important;color:#04122e;text-shadow:none}
#pad #bBoost.empty{filter:grayscale(.8) brightness(.7)}
.chip{width:46px;height:46px;border-radius:14px;flex:none;margin:0 8px;box-shadow:inset 0 -14px 0 var(--top),0 4px 14px #0006}
.sel{background:linear-gradient(180deg,#2a3048,#202536)}
.card{max-height:calc(100dvh - 24px);overflow:auto;background:linear-gradient(180deg,#1b1f2d,#12151f);border:1px solid #ffffff14}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:#ffffff1a;margin:2px 3px 0}

/* v2 design */
#hud{gap:8px;padding:8px 10px;align-items:flex-start;font-size:18px}
#hud .pill{background:linear-gradient(180deg,#1b2036cc,#0c1020cc);border:1px solid #ffffff2a;border-radius:14px;padding:5px 12px;backdrop-filter:blur(6px);box-shadow:0 4px 14px #0005;font-weight:800;white-space:nowrap}
#hud .pill.big{font-size:24px;line-height:1.1}#hud .pill small{font-size:12px;opacity:.7;margin-left:3px}
#hud .meters{flex:1;display:flex;flex-direction:column;gap:6px;max-width:210px;padding-top:6px}
#hud .bar{max-width:none;border:1px solid #fff9;height:13px;background:#0008;box-shadow:0 2px 8px #0005}#hud .bar.n{height:9px;max-width:130px}
#fuel.low{background:#ff2d2d;animation:bl .35s infinite alternate}@keyframes bl{to{opacity:.35}}
#hud button{background:linear-gradient(180deg,#1b2036cc,#0c1020cc)!important;border:1px solid #ffffff2a!important;border-radius:14px!important;padding:6px 11px!important;margin:0!important}#hud #ab.on{background:linear-gradient(180deg,#2fb34f,#1f7a36)!important}
#combo{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);transform:translateX(-50%);text-align:center;pointer-events:none;font-weight:900;font-size:26px;color:#ffd23f;text-shadow:0 3px 8px #000a}
#combo i{display:block;height:5px;margin-top:3px;border-radius:5px;background:#ffd23f;transform-origin:left}
#toast{top:calc(env(safe-area-inset-top,0px) + 118px)}
.card{background:radial-gradient(120% 60% at 50% 0,#2a2f52 0,#12151f 60%)}
.big{font-size:44px;font-weight:900;color:#ffd23f;line-height:1;margin:6px 0}.big small{font-size:14px;color:#fff;opacity:.7;margin-left:6px}
.ln{display:flex;justify-content:space-between;font-size:15px;padding:4px 10px;opacity:.92}.ln b{font-weight:800}
.st{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;opacity:.9;margin:3px 0}.st span{width:38px;text-align:left}.st i{flex:1;height:7px;border-radius:5px;background:#0006;overflow:hidden}.st b{display:block;height:100%;background:linear-gradient(90deg,#4de1ff,#ffd23f)}
.ms{display:flex;justify-content:space-between;align-items:center;background:#232837;border-radius:10px;margin:4px 0;padding:6px 10px;font-size:13px;text-align:left}.ms.d{opacity:.55}.ms.d span{text-decoration:line-through}
.hd{font-size:12px;letter-spacing:2px;opacity:.6;margin:12px 0 4px;text-align:left;font-weight:800}
.row small{display:block;opacity:.55;font-size:10px}.row span:first-child{width:120px}

/* phase 1: skin tiles */
.tile.sk img{width:100%;height:auto;border-radius:8px;display:block;margin-bottom:3px}.tile.sk b{font-size:11px}
.dpt{width:100%;max-width:150px;border-radius:12px;display:block;margin:0 auto 4px}.dab{font-size:11px;font-weight:800;color:#ffd23f;margin-bottom:4px;text-align:left}
.pvh{position:relative;margin:10px 0 8px}.pvh img{width:100%;height:150px;object-fit:cover;border-radius:14px;border:2px solid #0a1230;display:block}.pvh .cap{position:absolute;left:10px;bottom:8px;font-weight:900;font-size:14px;color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000}
/* v3 garage: tabs + tiles */
.wb{margin-top:10px;padding:9px;border-radius:12px;text-align:center;font-weight:800;background:linear-gradient(90deg,#ff9f1c,#ffd23f);color:#222;animation:pu 1s infinite alternate}
#toast{z-index:50}
.gar{display:flex;flex-direction:column;height:min(700px,calc(100dvh - 24px));padding:12px;overflow:hidden;text-align:left}
.gar .top{display:flex;align-items:center;gap:8px}
.pill2{background:#0007;border:1px solid #ffffff22;border-radius:99px;padding:5px 12px;font-weight:800;font-size:15px}
.card .ic{width:38px;height:38px;padding:0;border-radius:12px;font-size:18px;display:flex;align-items:center;justify-content:center;color:#ffd23f;text-decoration:none;font-weight:900;position:relative;background:#232837}
.card .ic.gift{animation:pu 1.2s infinite alternate}@keyframes pu{to{transform:scale(1.12);background:#5b3fd0}}
.ic i{position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;background:#ff3d3d}
.hero{display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#2a3048,#1c2030);border-radius:16px;padding:10px;margin:10px 0 8px}
.hero .e{font-size:40px;filter:drop-shadow(0 3px 6px #0008)}.hm{flex:1;min-width:0}.hm b{display:block;font-size:16px}.hm small{opacity:.65;font-size:11px}
.hb{width:110px}.hb .st{margin:2px 0;font-size:11px;gap:5px}.hb .st span{width:16px}
.tabs{display:flex;gap:6px}.card .tab{flex:1;padding:7px 2px;border-radius:12px;background:#232837;font-size:18px;line-height:1.1;position:relative;display:flex;flex-direction:column;align-items:center}
.tab small{font-size:10px;opacity:.85;font-weight:700}.card .tab.on{background:linear-gradient(180deg,#ffb703,#ff7a36);color:#222}
.dot{position:absolute;top:-4px;right:-2px;background:#ff3d3d;color:#fff;border-radius:99px;font-size:10px;font-style:normal;padding:1px 6px;font-weight:800}
.gar .body{flex:1;overflow:auto;margin:10px -4px 8px;padding:0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.card .tile{position:relative;background:#232837;border:2px solid transparent;border-radius:14px;padding:8px 3px 6px;font-size:11px;font-weight:700;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:76px}
.tile .e{font-size:26px}.tile .sw{width:100%;height:30px;border-radius:8px}.tile small{opacity:.8;font-size:10px}
.card .tile.sel{border-color:#ffd23f;background:#2f3658}.card .tile.lock{opacity:.55}
.chips{display:flex;gap:6px;overflow:auto;margin-bottom:8px}.card .chip2{flex:none;padding:5px 11px;font-size:17px;border-radius:99px;background:#232837}.card .chip2.on{background:#ffd23f;color:#222}
.upr{display:flex;align-items:center;gap:10px;background:#232837;border-radius:14px;padding:8px 10px;margin-bottom:8px}.upr .ui{font-size:26px}.upr>div{flex:1}.upr b{font-size:15px}.upr .pips{font-size:13px}.upr button{min-width:74px}
.g4,.st2{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}.g4>div,.st2>div{background:#232837;border-radius:12px;padding:8px 2px;text-align:center}.g4 b,.st2 b{display:block;font-size:14px}.g4 small,.st2 small{opacity:.65;font-size:10px}.st2{margin-top:14px}
.foot{display:flex;gap:8px}.foot .go{flex:1;margin:0;padding:14px}.card .foot .smart{width:56px;font-size:24px;padding:0;background:#5b3fd0}.card .go.buy2{background:linear-gradient(90deg,#2b8a3e,#40c057);color:#fff}
.hero .st span{text-align:center}

/* ===== v4 brand: Sky Crawler. Sunset orange, deep navy, sky cyan, lime, gold. Chunky cartoon outlines. ===== */
:root{--navy:#0f1b3d;--navy2:#22377a;--orange:#ff6b1a;--gold:#ffc727;--cyan:#35d0ff;--lime:#9be564;--ink:#090a0e}
html,body{font-family:"Arial Rounded MT Bold","Trebuchet MS","Segoe UI",system-ui,sans-serif;background:var(--navy)}
.cn{display:inline-block;width:22px;height:22px;border-radius:50%;vertical-align:-5px;margin-right:5px;background:radial-gradient(circle at 35% 30%,#fff3a8 0,#ffc727 45%,#e08a00 100%);border:2.5px solid var(--ink);box-shadow:inset 0 0 0 3px #ffe27a66}
#hud .pill{background:linear-gradient(180deg,var(--navy2),var(--navy));border:3px solid var(--ink);box-shadow:0 3px 0 #000a,inset 0 0 0 1px #6f8cf0;color:#fff;text-shadow:0 2px 0 var(--ink);backdrop-filter:none}
#hud .pill.big{font-size:26px}
#hud .coinp b{color:var(--gold)}#hud .coinp.bump{animation:bmp .28s ease-out}@keyframes bmp{40%{transform:scale(1.18)}}
#hud .stage,#hud .plv{display:flex;flex-direction:column;align-items:center;line-height:1;padding:4px 10px}#hud .stage small,#hud .plv small{font-size:9px;margin:0 0 2px;color:var(--cyan);opacity:1}
#hud .plv{background:linear-gradient(180deg,#ff9a3c,var(--orange))}#hud .plv small{color:#fff}
#hud .bar{border:3px solid var(--ink);background:#0b1330;height:16px;box-shadow:0 2px 0 #000a}#hud .bar.n{height:11px}
#fuel{background:linear-gradient(180deg,#d7ff8a,#5fc41f)}#nit{background:linear-gradient(180deg,#8be8ff,#2f8cff)}
#hud button{background:linear-gradient(180deg,var(--navy2),var(--navy))!important;border:3px solid var(--ink)!important;box-shadow:0 3px 0 #000a}
#pad button{border:3px solid var(--ink);border-bottom-width:8px;border-radius:24px;color:#fff;text-shadow:0 3px 0 var(--ink);backdrop-filter:none;letter-spacing:1px}
#pad #bBrake{background:linear-gradient(180deg,#ff7a6a,#c8281e)}#pad #bGas{background:linear-gradient(180deg,#c3ff72,#4cae1f)}
#pad #bBrake.on,#pad #bGas.on{color:#fff;transform:translateY(5px);border-bottom-width:3px;filter:brightness(1.15)}
#combo{color:var(--gold);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}#combo i{background:var(--gold)}
#toast{background:var(--navy);border:3px solid var(--ink);box-shadow:0 3px 0 #000a}
.card{background:linear-gradient(180deg,#1f3478,var(--navy) 72%);border:4px solid var(--ink);box-shadow:0 0 0 3px var(--cyan),0 24px 60px #000b}
.ttl{font-size:34px;font-weight:900;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);letter-spacing:1px}
.card .go{background:linear-gradient(180deg,#ffd23f,var(--orange));color:#fff;border:3px solid var(--ink);border-bottom-width:8px;border-radius:18px;text-shadow:0 3px 0 var(--ink);letter-spacing:1px}
.card .go:active{transform:translateY(4px);border-bottom-width:4px}
.card .go.alt{background:linear-gradient(180deg,#5b72c9,#34479a);font-size:18px;margin-top:6px}
.card .go.chest{background:linear-gradient(180deg,#c58bff,#7a3fd8);font-size:18px;margin-top:10px}
.card .go.buy2{background:linear-gradient(180deg,#c3ff72,#3fa81c)}
.card button{border-radius:12px}
.card .tab{background:#1a2b5e;border:2px solid var(--ink)}.card .tab.on{background:linear-gradient(180deg,#ffd23f,var(--orange));color:#fff;text-shadow:0 2px 0 var(--ink)}
.card .tile,.upr,.row,.ms,.g4>div,.st2>div,.sel{background:#1a2b5e;border:2px solid #0a1230}
.card .tile.sel{border-color:var(--gold);background:#2d4596;box-shadow:0 0 0 2px var(--ink)}
.hero{background:linear-gradient(180deg,#2d4596,#1a2b5e);border:2px solid #0a1230}
.pill2{background:#0a1230;border:3px solid var(--ink);box-shadow:inset 0 0 0 1px #6f8cf0;font-weight:900}.pill2.gold b{color:var(--gold)}
.plb{display:flex;align-items:center;gap:6px;flex:none}.plb b{display:flex;align-items:center;justify-content:center;min-width:34px;height:34px;padding:0 5px;border-radius:50%;background:linear-gradient(180deg,#ffb347,var(--orange));border:3px solid var(--ink);font-size:15px;text-shadow:0 2px 0 var(--ink)}
.plb i{display:block;width:42px;height:10px;border-radius:6px;background:#0a1230;border:2px solid var(--ink);overflow:hidden}.plb u{display:block;height:100%;background:linear-gradient(180deg,#8be8ff,#2f8cff)}
.logo{font-size:54px;line-height:.92;font-weight:900;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink),0 12px 18px #0009;transform:rotate(-3deg);margin:8px 0 2px}
.logo .b2{display:block;color:var(--gold);font-size:44px}
.tag{margin:6px 0 8px;font-size:16px;color:var(--cyan);font-weight:800}
.hero2{font-size:84px;filter:drop-shadow(0 8px 0 #0006);margin:4px 0}
.row2{display:flex;justify-content:center;align-items:center;gap:12px;margin:8px 0 4px}
.stars{display:flex;justify-content:center;gap:6px;margin:4px 0}.stars span{font-size:52px;line-height:1;color:#2d3f7a;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.stars span.on{color:var(--gold);animation:sp .5s var(--d) both cubic-bezier(.3,1.6,.5,1)}@keyframes sp{from{transform:scale(0) rotate(-40deg)}}
.big{display:flex;align-items:center;justify-content:center;font-size:46px;color:var(--gold);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}.big .cn{width:36px;height:36px;margin-right:8px;vertical-align:0}
.xpl{display:flex;justify-content:space-between;font-size:13px;font-weight:800;margin:10px 4px 3px;color:var(--cyan)}
.xpb{height:16px;border-radius:10px;background:#0a1230;border:3px solid var(--ink);overflow:hidden}.xpb i{display:block;height:100%;background:linear-gradient(180deg,#8be8ff,#2f8cff);transition:width .8s}
.lvup{margin:8px 0 0;padding:8px;border-radius:12px;background:linear-gradient(90deg,var(--orange),var(--gold));border:3px solid var(--ink);font-weight:900;color:#fff;text-shadow:0 2px 0 var(--ink)}
@media (prefers-reduced-motion:reduce){.stars span.on,#hud .coinp.bump,.card .ic.gift,.wb{animation:none}}

#gear .g b{color:var(--gold)}
/* v5: fuel gauge fix (flex:1 collapsed the bars in the column), labels, power readout */

}
function snd(){

  gn.gain.value=on?(keys.gas||keys.boost?.05:.02):0;

    const cls=['all',...VCL.map(c=>c[0])];
    const mx=k=>Math.max(...VEH.map(q=>q[k]||0))||1,sb=(n,k)=>`<div>${n}<i><u style="width:${Math.round(100*(v[k]||0)/mx(k))}%"></u></i></div>`,stn=Math.min(3,1+Math.floor(save.veh/3));
    body=`<div class=mk-hero><div style="flex:1"><img src="sprites/skins/jeep_${SKINS[skinOf(save.veh)].id}.png" alt=""><div class=nm>${v.n}</div><div class=st>${'\u2605'.repeat(stn)+'\u2606'.repeat(3-stn)}</div></div><div class=mk-bars>${sb('Speed','pw')}${sb('Acceleration','pw')}${sb('Grip','gr')}${sb('Fuel','fuel')}</div></div><div class=chips>${cls.map(c=>`<button class="chip2 ${vf===c?'on':''}" data-a=vf data-v="${c}">${c==='all'?'ALL':CI[c]}</button>`).join('')}</div>
    <div class=grid>${VEH.map((x,i)=>vf!=='all'&&x.cls!==vf?'':`<button class="tile ${i===save.veh?'sel':''} ${i<3||save.ownV[i]?'':'lock'}" data-a=pickv data-i=${i}><span class=e>${CI[x.cls]}</span>${VT[x.t]}<small>${i<3?'FREE':save.ownV[i]?'✓':'🔒 '+x.cost}</small></button>`).join('')}</div>
    <div class=hd>🎨 PAINT SKINS · ${v.n}</div><div class=grid>${SKINS.map((k,j)=>`<button class="tile sk ${j===skinOf(save.veh)?'sel':''} ${save.ownSk[j]?'':'lock'}" data-a=skin data-k=${j}><img src="sprites/skins/jeep_${k.id}.png" alt=""><b>${k.n}</b><small>${j===0||save.ownSk[j]?(j===skinOf(save.veh)?'ON':'✓'):'🔒 '+k.cost}</small></button>`).join('')}</div>`;
  }else if(tab==='drv'){
    if(dsel<0)dsel=save.drv;const D=DRIVERS[dsel],own=dsel===0||save.ownD[dsel];
    const bar=(l,x)=>`<div class=st><span>${l}</span><i><b style="width:${Math.round(x*100)}%"></b></i></div>`;
    body=`<div class=mk-hero><div style="flex:1"><img class=dpt src="sprites/drivers/d${dsel}.png" alt=""><div class=nm>${D.n}</div><div class=st>${dsel===save.drv?'✅ SELECTED':own?'OWNED':'🔒 '+D.cost}</div></div><div class=mk-bars><div class=dab>${D.ab}</div>${bar('⚡',.3+D.sp*4)}${bar('⛽',.3+D.fu*3)}${bar('🪙',.3+D.co*2.2)}${bar('🤸',.3+D.st*2)}${bar('🛡',.3+D.du*2)}</div></div>
    <div class=grid>${DRIVERS.map((x,i)=>`<button class="tile sk ${i===dsel?'sel':''} ${i===0||save.ownD[i]?'':'lock'}" data-a=pickd data-i=${i}><img src="sprites/drivers/d${i}.png" alt=""><b>${x.n}</b><small>${i===save.drv?'ON':i===0||save.ownD[i]?'✓':'🔒 '+x.cost}</small></button>`).join('')}</div>`;
  }else if(tab==='world'){
    if(!pcat)pcat=w.cat||'earth';
    const list=WORLD.map((x,i)=>[x,i]).filter(([x])=>x.cat===pcat);
    body=`<div class=pvh><img src="${scenePrev(V(),'w'+save.world+'_'+save.land,480,270)}" alt=""><div class=cap>${w.n} · ×${pmv} · gravity ${(w.g/1200).toFixed(2)}</div></div>
    <div class=chips>${CATS.map(([k,e,n])=>`<button class="chip2 ${pcat===k?'on':''}" data-a=pcat data-v=${k}>${e} ${n}</button>`).join('')}</div>
    <div class=grid>${list.map(([x,i])=>`<button class="tile sk ${i===save.world?'sel':''} ${i===0||save.ownW[i]?'':'lock'}" data-a=pickw data-i=${i}><img src="${scenePrev(x,'t'+i,240,135)}" alt=""><b>${x.n}</b><small>×${pmul(x)} ${i===save.world?'ON':i===0||save.ownW[i]?'✓':'🔒 '+x.cost}</small></button>`).join('')}</div>`;
  }else if(tab==='land'){
    if(lsel<0)lsel=save.land;const Ls=LAND[lsel];
    body=`<div class=pvh><img src="${scenePrev(landVis(lsel),'l'+lsel+'_'+save.world,480,270)}" alt=""><div class=cap>${Ls.ico} ${Ls.n}${lsel&&!save.ownL[lsel]?' · 🔒 '+Ls.cost:''}</div></div>
    <div class=hd>🏞️ LANDSCAPES · on ${w.n}</div>
    <div class=grid>${LAND.map((x,i)=>`<button class="tile sk ${i===lsel?'sel':''} ${i===0||save.ownL[i]?'':'lock'}" data-a=pickl data-i=${i}><img src="${scenePrev(landVis(i),'l'+i+'_'+save.world,240,135)}" alt=""><b>${x.ico} ${x.n}</b><small>${i===save.land?'ON':i===0||save.ownL[i]?'✓':'🔒 '+x.cost}</small></button>`).join('')}</div>`;
  }else if(tab==='up'){
    body=ownV?`<div class=mk-up>${[[0,'i_engine','ENGINE'],[3,'i_susp','SUSPENSION'],[1,'i_tire','TIRES'],[2,'i_fuel','FUEL TANK']].map(([i,ic,n])=>{const lv=u[i],cost=upCost(i,lv);return `<div class=mk-uc><b>${n}</b><img src="sprites/${ic}.png" alt=""><small>Lv. ${lv}</small><div class=mk-seg>${[0,1,2,3,4].map(k=>`<s style="${k<lv?'background:#35c759':''}"></s>`).join('')}</div><button ${lv>=5||save.coins<cost?'disabled':''} data-a=up data-i=${i}>${lv>=5?'MAX':'\ud83e\ude99 '+cost}</button></div>`}).join('')}</div>`+UPN.map(([n,b,d],i)=>i<4?'':`<div class=upr title="${d}"><span class=ui>${UI[i]}</span><div><b>${n}</b><div class=pips>${'\u25cf'.repeat(u[i])+'\u25cb'.repeat(5-u[i])}</div></div><button ${u[i]>=5||save.coins<upCost(i,u[i])?'disabled':''} data-a=up data-i=${i}>${u[i]>=5?'MAX':'\ud83e\ude99'+upCost(i,u[i])}</button></div>`).join('')+`<p class=sub style="margin:8px 0">\ud83d\udd27 Upgrade your vehicle and go further!</p>`:`<p class=sub>\ud83d\udd12 Unlock this vehicle to upgrade it</p>`;
  }else{
    body=ms.map((q,j)=>`<div class="ms ${sd.done[j]?'d':''}"><span>${sd.done[j]?'✅':'🎯'} ${q.txt}</span><b>🪙${q.rew}</b></div>`).join('')+
      `<div class=st2><div><b>🏁 ${save.st.runs}</b><small>runs</small></div><div><b>🔄 ${save.st.flips}</b><small>flips</small></div><div><b>📏 ${save.st.dist}</b><small>metres</small></div><div><b>🪙 ${save.st.earned}</b><small>earned</small></div></div>`;
  }
  const foot=tab==='drv'&&dsel>=0&&dsel!==save.drv?((dsel===0||save.ownD[dsel])?`<button class="go buy2" data-a=equipd>✅ SELECT ${DRIVERS[dsel].n.toUpperCase()}</button>`:`<button class="go buy2" data-a=buyd ${save.coins<DRIVERS[dsel].cost?'disabled':''}>🔓 ${DRIVERS[dsel].n.toUpperCase()} 🪙${DRIVERS[dsel].cost}</button>`):tab==='land'&&lsel>=0&&lsel!==save.land?((lsel===0||save.ownL[lsel])?`<button class="go buy2" data-a=equipl>✅ USE ${LAND[lsel].n.toUpperCase()}</button>`:`<button class="go buy2" data-a=buyl ${save.coins<LAND[lsel].cost?'disabled':''}>🔓 ${LAND[lsel].n.toUpperCase()} 🪙${LAND[lsel].cost}</button>`):!ownV?`<button class="go buy2" data-a=buyv ${save.coins<v.cost?'disabled':''}>🔓 ${CI[v.cls]} 🪙${v.cost}</button>`:!ownW?`<button class="go buy2" data-a=buyw ${save.coins<w.cost?'disabled':''}>🔓 🪙${w.cost}</button>`:`<button class=go data-a=start>▶ DRIVE</button>`;
  menu.innerHTML=`<div class="card gar">
  <div class=top><a class=ic href="/">‹</a><div class="pill2 gold"><span class=cn></span><b>${save.coins}</b></div><div class=plb title="Player level"><b>${P.l}</b><i><u style="width:${Math.round(P.cur/P.need*100)}%"></u></i></div><div class=pill2>🔥 ${save.streak||0}</div><span style="flex:1"></span><button class="ic ${dailyOn?'gift':''}" data-a=daily title="Daily bonus">🎁${dailyOn?'<i></i>':''}</button><button class=ic data-a=help>?</button></div>
  ${welcome?'<div class=wb>🎁 Welcome gift! +500 🪙 added</div>':''}<div class=hero><span class=e>${CI[v.cls]}</span><div class=hm><b>${v.n}</b><small>🌍 ${w.n} · ×${pmv} · 🏆 ${bt} m</small></div><div class=hb>${bars(S)}</div></div>
  <div class=tabs>${[['car','🚗','Vehicles'],['world','🪐','Planets'],['land','🏞️','Land'],['drv','🧑','Drivers'],['up','🔧','Upgrades'],['mis','🎯','Missions']].map(([k,e,n])=>`<button class="tab ${tab===k?'on':''}" data-a=tab data-v=${k}>${e}<small>${n}</small>${k==='mis'&&left?'<i class=dot>'+left+'</i>':''}</button>`).join('')}</div>
  <div class=body>${body}</div>
  <div class=foot>${foot}<button class="smart" data-a=smart title="Smart pick">🧠</button></div></div>`;
  const bd=menu.querySelector&&menu.querySelector('.body');
  if(bd){if(lastTab===tab+vf)bd.scrollTop=keepTop;else if(tab==='drv'||tab==='land'||tab==='world'){bd.scrollTop=0}else{const sel=bd.querySelector('.tile.sel');if(sel&&sel.scrollIntoView)sel.scrollIntoView({block:'center'})}}
  lastTab=tab+vf;
}
let keepTop=0;
menu.addEventListener('change',e=>{const k=e.target.dataset.s;if(!k)return;save[k]=+e.target.value;persist();render()});
$('ab').onclick=()=>{save.assist=save.assist?0:1;persist();$('ab').classList.toggle('on',!!save.assist);pop(save.assist?'🧠 ASSIST ON':'ASSIST OFF')};
const cyc=(k,n,d)=>save[k]=(save[k]+d+n)%n;
menu.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;
  const a=b.dataset.a,i=+b.dataset.i;
  if(a==='pv')cyc('veh',VEH.length,-1);else if(a==='nv')cyc('veh',VEH.length,1);
  else if(a==='pw')cyc('world',WORLD.length,-1);else if(a==='nw')cyc('world',WORLD.length,1);
  else if(a==='buyv'&&save.coins>=VEH[save.veh].cost){save.coins-=VEH[save.veh].cost;save.ownV[save.veh]=1}
  else if(a==='buyw'&&save.coins>=WORLD[save.world].cost){save.coins-=WORLD[save.world].cost;save.ownW[save.world]=1}
  else if(a==='up'){const u=UP(),cost=upCost(i,u[i]);if(u[i]<5&&save.coins>=cost){save.coins-=cost;u[i]++}}
  else if(a==='daily'){claimDaily()}
  else if(a==='splash'){splash=0}
  else if(a==='wmap'){splash=2}
  else if(a==='wback'){splash=1}
  else if(a==='pickworld'){save.world=i;pcat=null;tab=(i===0||save.ownW[i])?'car':'world';splash=0;persist()}
  else if(a==='sgarage'){splash=0;tab='car'}
  else if(a==='supg'){splash=0;tab='up'}
  else if(a==='mute'){save.mute=save.mute?0:1}
  else if(a==='tilt'){save.tilt=save.tilt?0:1;if(save.tilt){tiltEnable();tiltCal()}}
  else if(a==='tinv'){save.tinv=save.tinv?0:1;TL.n0=null}
  else if(a==='chest'&&!run.chest){run.chest=Math.round((40+Math.random()*160)*(1+run.cp*.15)/5)*5;save.coins+=run.chest;toast('🎁 +'+run.chest+' coins!');sfx('lvl')}
  else if(a==='smart'){smartPick();toast(advMsg.replace(/<[^>]+>/g,''))}
  else if(a==='tab'){tab=b.dataset.v;lsel=-1;dsel=-1}else if(a==='pcat'){pcat=b.dataset.v}else if(a==='pickl'){lsel=i;if(i===0||save.ownL[i])save.land=i}else if(a==='equipl'){save.land=lsel}else if(a==='buyl'&&save.coins>=LAND[lsel].cost){save.coins-=LAND[lsel].cost;save.ownL[lsel]=1;save.land=lsel;toast('🏞️ '+LAND[lsel].n+' landscape unlocked!')}else if(a==='vf'){vf=b.dataset.v}else if(a==='pickv'){save.veh=i}else if(a==='pickd'){dsel=i;if(i===0||save.ownD[i])save.drv=i}else if(a==='equipd'){save.drv=dsel}else if(a==='buyd'&&save.coins>=DRIVERS[dsel].cost){save.coins-=DRIVERS[dsel].cost;save.ownD[dsel]=1;save.drv=dsel;toast('🧑 '+DRIVERS[dsel].n+' joined your team!')}else if(a==='skin'){const k=+b.dataset.k,sk=SKINS[k];if(k===0||save.ownSk[k]){save.vs[save.veh]=k}else if(save.coins>=sk.cost){save.coins-=sk.cost;save.ownSk[k]=1;save.vs[save.veh]=k;toast('🎨 '+sk.n+' skin unlocked!')}else toast('🔒 Need 🪙'+sk.cost+' for the '+sk.n+' skin')}else if(a==='pickw'){save.world=i}
  else if(a==='help'){toast('RIGHT/D gas · LEFT/A brake · coins and red cans refuel you · low fuel = less power · let go in the air to auto-level')}
  else if(a==='start'){persist();start();return}
  else if(a==='resume'){menu.classList.add('hide');$('gear').classList.remove('hide');state='play';tiltCal();return}
  else if(a==='garage'){if(mode==='pause'&&car&&run){run.over='RUN ENDED';over();return}state='menu';mode='garage';$('hud').classList.add('hide');$('pad').classList.add('hide');$('gear').classList.add('hide')}
  persist();render();
});
function pause(){if(state!=='play')return;state='menu';mode='pause';keys.gas=keys.brake=keys.boost=keys.tilt=0;setPad();$('gear').classList.add('hide');$('tg').classList.add('hide');render()}
$('pb').onclick=pause;

/* ---------- TILT CONTROL (gyro) ----------
   Hold the phone like a handlebar. Tilt the top toward you = nose UP (back flip), away from you = nose DOWN (front flip).
   In the air it sets the flip speed directly; on the ground it leans the rider to balance wheelies and drops. */
const TL={ok:0,raw:0,n0:null,v:0,asked:0};
function tiltAngle(e){const o=(screen.orientation&&screen.orientation.angle!=null)?screen.orientation.angle:(window.orientation||0);
  if(o===90)return -e.gamma;if(o===270||o===-90)return e.gamma;if(o===180)return -e.beta;return e.beta}
addEventListener('deviceorientation',e=>{
  if(e.beta==null&&e.gamma==null)return;TL.ok=1;TL.raw=tiltAngle(e)*(save.tinv?-1:1);if(TL.n0==null)TL.n0=TL.raw});
function tiltCal(){if(TL.ok)TL.n0=TL.raw}
function tiltEnable(){ /* iOS needs a tap to allow motion sensors */
  if(TL.asked||typeof DeviceOrientationEvent==='undefined'||typeof DeviceOrientationEvent.requestPermission!=='function')return;TL.asked=1;
  try{DeviceOrientationEvent.requestPermission().then(r=>{if(r!=='granted'){toast('Tilt blocked: allow Motion & Orientation for this site in Settings')}}).catch(()=>{TL.asked=0})}catch(x){TL.asked=0}}
function tiltTick(dt){
  if(!(save.tilt&&TL.ok&&state==='play')){keys.tilt=0;TL.v=0;return}
  let d=TL.raw-(TL.n0==null?TL.raw:TL.n0);d=((d+540)%360)-180;const a=Math.abs(d),t=Math.sign(d)*Math.max(0,Math.min(1,(a-3)/19));
  TL.v+=(t-TL.v)*Math.min(1,dt*14);keys.tilt=Math.abs(TL.v)<.02?0:TL.v}
$('tg').addEventListener('pointerdown',()=>{tiltCal();toast('📱 Tilt centred')});

/* ---------- input ---------- */
const KG=['ArrowRight','ArrowUp','KeyD','KeyW','Space'],KB=['ArrowLeft','ArrowDown','KeyA','KeyS'],KN=['ShiftLeft','ShiftRight','KeyB','KeyN'];
addEventListener('keydown',e=>{
  if(state==='menu'&&mode==='over'&&['Enter','Space','KeyR'].includes(e.code)){e.preventDefault();start();return}
  if(state==='menu'&&mode==='pause'&&e.code==='Enter'){menu.classList.add('hide');$('gear').classList.remove('hide');state='play';return}
  if(e.code==='Escape'||e.code==='KeyP'){pause();return}
  if(KG.includes(e.code))keys.gas=1;if(KB.includes(e.code))keys.brake=1;if(KN.includes(e.code))keys.boost=1;
  if(state==='play'&&(KG.includes(e.code)||KB.includes(e.code)||e.code==='Space'))e.preventDefault();setPad();
});
addEventListener('keyup',e=>{if(KG.includes(e.code))keys.gas=0;if(KB.includes(e.code))keys.brake=0;if(KN.includes(e.code))keys.boost=0;setPad()});
function setPad(){$('bGas').classList.toggle('on',!!keys.gas);$('bBrake').classList.toggle('on',!!keys.brake);$('bBoost').classList.toggle('on',!!keys.boost)}
[['bGas','gas'],['bBrake','brake'],['bBoost','boost']].forEach(([id,k])=>{
  const el=$(id),up=()=>{keys[k]=0;setPad()};
  el.addEventListener('pointerdown',e=>{keys[k]=1;setPad();try{el.setPointerCapture(e.pointerId)}catch(x){}});
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up);
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- loop ---------- */
let last=performance.now();
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  frame(dt);draw();snd();
}
render();requestAnimationFrame(loop);
</script></body></html>
