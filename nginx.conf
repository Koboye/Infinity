events { worker_connections 1024; }
http {
  server {
    listen 80;
    location / {
      try_files $uri $uri/ /index.html;
    }
    location /ws {
      proxy_pass http://app:80;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
    }
  }
}