<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Infinity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d0b2a; --ink2:#161240; --panel:#1b1650; --line:#3a3490; --text:#f4f2ff; --mute:#a9a4de;
  --violet:#7c5cff; --violet2:#9b82ff; --sun:#ffc93c; --ok:#3ddc97; --bad:#ff6b8a;
  --fs-h:clamp(1.75rem,5.5vw,2.25rem); --fs-b:1rem; --fs-s:.875rem; --r:16px;
  --display:'Bricolage Grotesque',system-ui,sans-serif; --body:'Figtree',system-ui,sans-serif;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;font:400 var(--fs-b)/1.5 var(--body);color:var(--text);background:var(--ink);
  background-image:radial-gradient(60rem 36rem at 15% -10%,#3b2bb8 0%,transparent 60%),radial-gradient(50rem 30rem at 100% 110%,#5b2bb8 0%,transparent 60%);
  display:flex;justify-content:center;padding:24px 16px 40px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.app{width:100%;max-width:440px}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;font:800 1.5rem var(--display);margin:8px 0 20px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--sun);display:grid;place-items:center}
.logo svg{width:26px}
.track{display:block;margin:0 auto 18px;width:150px;height:auto}
.track .base{stroke:var(--line)}
.track .fill{stroke:var(--sun);stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .6s ease}
.card{background:linear-gradient(180deg,var(--panel),var(--ink2));border:1px solid var(--line);border-radius:28px;padding:28px 22px;box-shadow:0 30px 60px -30px #000}
.step{display:none}.step.on{display:block;animation:in .35s ease}
@keyframes in{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.step.on{animation:none}.track .fill{transition:none}}
h1{font:800 var(--fs-h)/1.1 var(--display);margin:0 0 6px;text-align:center;letter-spacing:-.01em}
.sub{margin:0 0 22px;text-align:center;color:var(--mute);font-size:var(--fs-s)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:999px;background:var(--ink);border:1px solid var(--line);margin-bottom:18px}
.tab{border:0;background:none;padding:10px 6px;border-radius:999px;font-weight:600;font-size:var(--fs-s);color:var(--mute);cursor:pointer;min-height:44px}
.tab[aria-selected=true]{background:var(--violet);color:#fff}
.band{margin:0 0 16px}
.band h2{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 8px;font:600 var(--fs-s) var(--body);color:var(--mute)}
.band h2 b{color:var(--text);font:600 1rem var(--display)}
.groups{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 12px}.groups::-webkit-scrollbar{display:none}
.gtab{flex:0 0 auto;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--mute);font-weight:600;font-size:var(--fs-s);cursor:pointer}
.gtab[aria-current=true]{background:#7c5cff33;border-color:var(--violet2);color:var(--text)}
.rail{position:relative;display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 12px;padding:4px 12px 14px;margin:0 -22px 8px;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.rail::-webkit-scrollbar{display:none}
.rail .chip{flex:0 0 104px;height:120px;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:1.6rem}
.rail .chip small{font-size:.75rem}
.hint{margin:0 0 14px;text-align:center;font-size:.8rem;color:var(--mute)}
.chip{min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--ink);font:600 1rem var(--display);cursor:pointer;transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--violet2)}
.chip[aria-pressed=true]{background:var(--violet);border-color:var(--sun);box-shadow:0 0 0 3px #ffc93c33}
.chip small{display:block;font:400 .72rem var(--body);color:var(--mute);line-height:1}
.chip[aria-pressed=true] small{color:#ece7ff}
.btn{width:100%;min-height:54px;border:0;border-radius:999px;background:var(--sun);color:#1a1240;font:800 1.05rem var(--display);cursor:pointer;margin-top:8px;transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.pill{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 18px;padding:10px 14px;border-radius:12px;background:var(--ink);border:1px solid var(--line);font-size:var(--fs-s)}
.link{background:none;border:0;padding:6px 2px;color:var(--violet2);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:36px}
.field{margin-bottom:14px}
.field label{display:block;font-size:var(--fs-s);font-weight:600;margin-bottom:6px}
.wrap{position:relative}
.field input{width:100%;min-height:52px;padding:0 48px 0 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--ink)}
.field input::placeholder{color:#7e79c0}
.field input:focus{border-color:var(--violet2);outline:none;box-shadow:0 0 0 3px #7c5cff55}
.field.bad input{border-color:var(--bad)}
.msg{min-height:1.2em;margin:6px 2px 0;font-size:.8rem;color:var(--mute)}
.field.bad .msg{color:var(--bad)}
.eye{position:absolute;right:4px;top:4px;width:44px;height:44px;border:0;background:none;color:var(--mute);cursor:pointer;font-size:var(--fs-s);font-weight:600}
.row{display:flex;justify-content:flex-end;margin:-4px 0 6px}
.swap{text-align:center;margin:18px 0 0;font-size:var(--fs-s);color:var(--mute)}
.done{text-align:center;padding:12px 0}
.done .logo{margin:0 auto 14px;width:64px;height:64px;border-radius:20px}.done .logo svg{width:42px}
</style>
</head>
<body>
<main class="app">
  <div class="brand"><span class="logo"><svg viewBox="0 0 64 32" fill="none" stroke="#1a1240" stroke-width="7" stroke-linecap="round"><path d="M32 16C26 5 6 5 6 16s20 11 26 0 26-11 26 0-20 11-26 0z"/></svg></span>Infinity</div>

  <svg class="track" viewBox="0 0 150 56" fill="none" stroke-width="5" stroke-linecap="round" aria-hidden="true">
    <path class="base" d="M75 28C62 6 10 6 10 28s52 22 65 0 65-22 65 0-52 22-65 0z"/>
    <path class="fill" id="fill" pathLength="1" d="M75 28C62 6 10 6 10 28s52 22 65 0 65-22 65 0-52 22-65 0z"/>
  </svg>

  <div class="card">
    <section class="step on" id="s1" aria-labelledby="h1a">
      <h1 id="h1a">What are you studying?</h1>
      <p class="sub">Pick your level once. Everything adapts to it.</p>
      <div class="tabs" role="tablist" aria-label="Stage" id="tabs"></div>
      <div id="bands"></div>
      <button class="btn" id="go1" disabled>Continue</button>
    </section>

    <section class="step" id="s2" aria-labelledby="h2a">
      <h1 id="h2a">Create your account</h1>
      <p class="sub">Free to start. Takes under a minute.</p>
      <div class="pill"><span id="picked"></span><button class="link" id="chg" type="button">Change</button></div>
      <div id="f2">
        <div class="field"><label for="name">Full name</label><div class="wrap"><input id="name" autocomplete="name" placeholder="Abebe Kebede"></div><p class="msg"></p></div>
        <div class="field"><label for="em2">Email</label><div class="wrap"><input id="em2" type="email" autocomplete="email" placeholder="you@example.com"></div><p class="msg"></p></div>
        <div class="field"><label for="pw2">Password</label><div class="wrap"><input id="pw2" type="password" autocomplete="new-password" placeholder="At least 8 characters"><button class="eye" type="button" data-for="pw2">Show</button></div><p class="msg"></p></div>
        <button class="btn" id="go2">Create account</button>
      </div>
      <p class="swap">Already have an account? <button class="link" data-go="3" type="button">Sign in</button></p>
    </section>

    <section class="step" id="s3" aria-labelledby="h3a">
      <h1 id="h3a">Welcome back</h1>
      <p class="sub">Sign in to continue. Your level is saved to your account.</p>
      <div id="f3">
        <div class="field"><label for="em3">Email</label><div class="wrap"><input id="em3" type="email" autocomplete="email" placeholder="you@example.com"></div><p class="msg"></p></div>
        <div class="field"><label for="pw3">Password</label><div class="wrap"><input id="pw3" type="password" autocomplete="current-password" placeholder="Your password"><button class="eye" type="button" data-for="pw3">Show</button></div><p class="msg"></p></div>
        <div class="row"><button class="link" type="button" id="forgot">Forgot password?</button></div>
        <button class="btn" id="go3">Sign in</button>
      </div>
      <p class="swap">New to Infinity? <button class="link" data-go="2" type="button">Create an account</button></p>
    </section>

    <section class="step" id="s4" aria-live="polite">
      <div class="done"><span class="logo"><svg viewBox="0 0 64 32" fill="none" stroke="#1a1240" stroke-width="7" stroke-linecap="round"><path d="M32 16C26 5 6 5 6 16s20 11 26 0 26-11 26 0-20 11-26 0z"/></svg></span>
      <h1 id="doneH">You're in</h1><p class="sub" id="doneP"></p></div>
    </section>
  </div>
</main>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const DATA={
  School:[["Kindergarten","Early learning",[["KG1","Pre-K"],["KG2","Kindergarten"],["KG3","Advanced"]]],
    ["Primary","Grades 1 to 6",[1,2,3,4,5,6].map(n=>["G"+n,""])],
    ["Preparatory","Grades 7 to 9",[7,8,9].map(n=>["G"+n,""])],
    ["Secondary","Grades 10 to 12",[10,11,12].map(n=>["G"+n,""])]],
  University:[["University","Choose your year",[1,2,3,4,5].map(n=>["Year "+n,""])]],
  NGAT:[["NGAT","Graduate admission track",[["Natural","Science"],["Social","Science"]]]]
};
let stage="School", level=null, who="";
const t=$("#tabs");
Object.keys(DATA).forEach(k=>{const b=document.createElement("button");b.className="tab";b.role="tab";b.textContent=k;
  b.onclick=()=>{stage=k;level=null;draw()};t.append(b)});
function draw(){
  $$(".tab").forEach(b=>b.setAttribute("aria-selected",b.textContent===stage));
  const G=DATA[stage], v=(a)=>stage==="NGAT"?"NGAT "+a:a;
  $("#bands").innerHTML=(G.length>1?`<div class="groups" id="groups">${G.map(([h],i)=>`<button type="button" class="gtab" data-g="${i}">${h}</button>`).join("")}</div>`:"")+
    `<div class="rail" id="rail" aria-label="Choose your grade, swipe sideways">${G.map(([h,s,items],g)=>items.map(([a,b],j)=>`<button class="chip" data-g="${g}" data-first="${j===0}" aria-pressed="${level===v(a)}" data-v="${v(a)}">${a}<small>${b||h}</small></button>`).join("")).join("")}</div><p class="hint">Swipe to see more</p>`;
  const rail=$("#rail"), chips=$$(".rail .chip");
  const mark=()=>{const c=chips.find(c=>c.offsetLeft+c.offsetWidth>rail.scrollLeft+24)||chips[0];$$(".gtab").forEach(t=>t.toggleAttribute("aria-current",t.dataset.g===c.dataset.g)||t.removeAttribute("aria-current"));$$(".gtab").forEach(t=>t.setAttribute("aria-current",t.dataset.g===c.dataset.g))};
  let tick;rail.addEventListener("scroll",()=>{cancelAnimationFrame(tick);tick=requestAnimationFrame(mark)},{passive:true});
  $$(".gtab").forEach(t=>t.onclick=()=>{const f=chips.find(c=>c.dataset.g===t.dataset.g&&c.dataset.first==="true");rail.scrollTo({left:f.offsetLeft-12,behavior:"smooth"})});
  chips.forEach(c=>c.onclick=()=>{level=c.dataset.v;chips.forEach(x=>x.setAttribute("aria-pressed",x===c));$("#go1").disabled=false;c.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"})});
  const sel=chips.find(c=>c.dataset.v===level);if(sel)rail.scrollLeft=sel.offsetLeft-(rail.clientWidth-sel.offsetWidth)/2;
  mark();$("#go1").disabled=!level;
}
function show(n){
  $$(".step").forEach(s=>s.classList.remove("on"));$("#s"+n).classList.add("on");
  $("#fill").style.strokeDashoffset={1:1,2:.55,3:0,4:0}[n];
  const f=$("#s"+n).querySelector("input");if(f&&n>1)setTimeout(()=>f.focus({preventScroll:true}),50);
}
$("#go1").onclick=()=>{$("#picked").textContent=level;show(2)};
$("#chg").onclick=()=>show(1);
$$("[data-go]").forEach(b=>b.onclick=()=>show(b.dataset.go));
$$(".eye").forEach(b=>b.onclick=()=>{const i=$("#"+b.dataset.for),h=i.type==="password";i.type=h?"text":"password";b.textContent=h?"Hide":"Show"});
function check(id,ok,msg){const f=$("#"+id).closest(".field");f.classList.toggle("bad",!ok);f.querySelector(".msg").textContent=ok?"":msg;return ok}
const mail=v=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v);
$("#go2").onclick=()=>{
  const a=check("name",$("#name").value.trim().length>1,"Enter your full name."),
        b=check("em2",mail($("#em2").value),"Enter a valid email, like you@example.com."),
        c=check("pw2",$("#pw2").value.length>=8,"Use at least 8 characters.");
  if(a&&b&&c){who=$("#name").value.trim().split(" ")[0];/* TODO: call your signup API with {name,email,password,level} */finish("Welcome, "+who,"Your "+level+" path is ready.")}
};
$("#go3").onclick=()=>{
  const a=check("em3",mail($("#em3").value),"Enter the email you signed up with."),
        b=check("pw3",$("#pw3").value.length>0,"Enter your password.");
  if(a&&b){/* TODO: call your sign-in API */finish("You're signed in","Picking up where you left off.")}
};
$("#forgot").onclick=()=>{const ok=check("em3",mail($("#em3").value),"Enter your email above, then tap Forgot password.");if(ok)$("#em3").closest(".field").querySelector(".msg").textContent="If that email has an account, a reset link is on its way."};
function finish(h,p){$("#doneH").textContent=h;$("#doneP").textContent=p;show(4)}
draw();
</script>
</body>
</html>
